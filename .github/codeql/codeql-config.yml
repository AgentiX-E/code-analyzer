# CodeQL configuration for AgentiX-E/code-analyzer
#
# **Why this file exists.** `security-and-quality` is the right suite for shipped code and the wrong suite for four
# kinds of file this repository has: fixtures that exist to *contain* the defect the analyzer is meant to find, tests
# that build source text as a string, single-writer development scripts, and benchmark harnesses whose job is to read a
# corpus and send it to a model API. Those produced 44 of the 61 open alerts on 2026-11-12, all of them correct
# detections of a shape that is deliberate, and none of them the thing a reader of the Security tab needs to see first.
#
# **What is not excluded, and why the difference matters.** Every exclusion below is a `(query, path)` pair. The query
# still runs everywhere else, so the same defect in shipped code is still reported; and the paired test file is named in
# the comment, so the mitigation behind a path-level exclusion can be read rather than trusted. Excluding a query
# globally, or a path from analysis, would hide the next real finding in the same directory - which is exactly what the
# 1 680th alert (an unused import in a new end-to-end test) was: found, reported, fixed, not suppressed.
#
# **Reviewing this file.** An entry is a claim that "this shape, in this file, is what the code is for". When one of
# these files changes materially, the claim is worth re-reading.

name: 'code-analyzer CodeQL configuration'

queries:
  - uses: security-extended
  - uses: security-and-quality

query-filters:
  # ---------------------------------------------------------------------------
  # Fixtures: the defect is the fixture
  # ---------------------------------------------------------------------------
  # An unused import and a call to something that is not a function are both fixture content: the analyzer is tested on
  # them, so they must stay. See packages/analyzer/src/__tests__/fixtures/export-chain/.
  - exclude:
      id: js/unused-local-variable
    paths:
      - packages/analyzer/src/__tests__/fixtures/**
  - exclude:
      id: js/call-to-non-callable
    paths:
      - packages/analyzer/src/__tests__/fixtures/**
  # A taint fixture whose purpose is a shell built from an environment variable, so the analyzer has a sink to report.
  - exclude:
      id: js/indirect-command-line-injection
    paths:
      - tests/fixtures/**

  # ---------------------------------------------------------------------------
  # Tests: they read and write what they just created
  # ---------------------------------------------------------------------------
  # `${i}` inside a string that holds generated source code is fixture text, not a template expression.
  - exclude:
      id: js/template-syntax-in-string-literal
    paths:
      - packages/mcp/src/__tests__/**
  # Clones a real repository into a mkdtemp directory and writes what it read back into that directory.
  - exclude:
      id: js/http-to-file-access
    paths:
      - packages/analyzer/src/__tests__/**
  # Writes its own fixture and reads it back in the same case.
  - exclude:
      id: js/file-system-race
    paths:
      - packages/intelligence/src/__tests__/**
  # A route registered inside one case to assert mutual-TLS authentication.
  - exclude:
      id: js/missing-rate-limiting
    paths:
      - packages/server/src/__tests__/**

  # ---------------------------------------------------------------------------
  # Development scripts and benchmark harnesses
  # ---------------------------------------------------------------------------
  # These write the report they are named for, as the last statement of a single-writer run.
  - exclude:
      id: js/file-system-race
    paths:
      - scripts/**
      - .github/scripts/**
  # **By design, and it is the whole harness**: read the corpus that was selected, send it to the model API, write the
  # measurement back. The data is public repository content and the destination is a file the run itself chose.
  - exclude:
      id: js/file-access-to-http
    paths:
      - scripts/**
      - .github/scripts/**
  - exclude:
      id: js/http-to-file-access
    paths:
      - scripts/**

  # ---------------------------------------------------------------------------
  # Product code where the query's premise does not hold - each with the guard that makes it so
  # ---------------------------------------------------------------------------
  # `readFile` opens a descriptor read-only, on a path that `realpathSync` has just resolved and that is then held to
  # the repository root. No file is created, and the temp-directory source the query follows enters only from the test
  # harness, which builds fixtures with `mkdtempSync`. See the comment on `readFile` in
  # packages/intelligence/src/review/agent/repository.ts.
  - exclude:
      id: js/insecure-temporary-file
    paths:
      - packages/intelligence/src/review/agent/repository.ts
  # `registerCors` throws when credentials are enabled with a wildcard origin, before a route exists, and
  # `resolveAllowedOrigin` never answers a wildcard with credentials set. Tested in
  # packages/server/src/__tests__/middleware.test.ts.
  - exclude:
      id: js/cors-misconfiguration-for-credentials
    paths:
      - packages/server/src/middleware/cors.ts
  # 256-bit random API keys are hashed with SHA-256, which is the standard digest for a high-entropy bearer token: there
  # is no dictionary to slow down, and a per-request password KDF would add latency to every MCP call without adding
  # work factor against a 2^256 preimage. Comparison is timing-safe.
  - exclude:
      id: js/insufficient-password-hash
    paths:
      - packages/mcp/src/middleware/index.ts
  # The review session store appends model output to a path built from a session id that `SESSION_ID_PATTERN` has already
  # validated, inside a directory the operator configured. The content is what the reviewer produced and the file name
  # is not derived from it.
  - exclude:
      id: js/http-to-file-access
    paths:
      - packages/intelligence/src/review/session-store.ts
  # Every `git` call here goes through `execFileSync` with an argument list - there is no shell - and the branch is
  # refused when it begins with a dash by `assertGitArgument`, which is what makes `--upload-pack` unreachable. See
  # packages/infra/src/__tests__/assert-git-argument.test.ts and
  # packages/intelligence/src/__tests__/repo-sync-branches.test.ts.
  - exclude:
      id: js/second-order-command-line-injection
    paths:
      - packages/intelligence/src/github/repo-sync.ts
  # **The failure budget is the rate limit this endpoint needs.** A delivery is refused by source after ten invalid
  # signatures a minute, which is what bounds the only work an unauthenticated caller can cause (an HMAC over the whole
  # payload plus a `timingSafeEqual`); a flood that carries a valid signature requires the secret. `DEFAULT_RATE_LIMIT`
  # is off by default for the whole server and would not change this bound if it were on. See
  # packages/server/src/routes/webhook.ts and packages/server/src/__tests__/webhook*.test.ts.
  - exclude:
      id: js/missing-rate-limiting
    paths:
      - packages/server/src/routes/webhook.ts
