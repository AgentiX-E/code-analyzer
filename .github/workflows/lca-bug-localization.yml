name: Long Code Arena — bug localisation

# **The second instrument.** OWASP Benchmark is closed at 1.0000, and iteration 38 said why that figure cannot move
# again: 2 740 generated servlets with one shape per case answer "is a flow followed", not "can a real repository's
# answer be found". This job measures the other question on somebody else's corpus.
#
# **The corpus is Long Code Arena, bug localisation** (Bogomolov et al., arXiv 2406.11612, NeurIPS 2024 D&B):
# given an issue and the repository at the commit where it reproduces, name the files that must change. The ground
# truth is the fixing commit, the metric is the authors' own `quality_metrics.py`, and the published baselines include
# BM25 and a `filepath_imports` context composer - so there is something to be compared against that is not us.
#
# **Nothing is committed.** The split and the checkouts are downloaded per run, so the job always measures the
# published revision; the artifact records the row count, the cuts and the configuration rather than only a number.
#
# **The retrieval arm needs no model**, which is why this job is cheap and why its figure is reproducible to the digit:
# a change in it is a change in the retriever. The answer arm runs when `DEEPSEEK_API_KEY` is present and says so when
# it is not.

on:
  workflow_dispatch:
    inputs:
      max_rows:
        # **Eight by default**: each instance needs its own checkout at its own commit plus a full analysis, and fifty
        # per language exhausted a ninety-minute budget and reported nothing, and twelve reported nothing in two and a
        # half hours. Raise it when there is time to spend.
        description: 'How many instances of each language split to measure'
        required: false
        default: '8'
      max_files:
        # **The size bound.** An instance whose repository holds more files than this is skipped and counted, because
        # an analysis that does not finish is not a measurement. Recorded in the artifact.
        description: 'Skip instances whose repository holds more than this many files'
        required: false
        default: '2000'
      answer_arm:
        # **The model arm, off by default.** One completion per instance, on the slower half of the same measurement.
        description: 'Run the answer arm as well (1) or the deterministic retrieval arm alone (0)'
        required: false
        default: '0'
  push:
    branches: [master]
    paths:
      - 'packages/intelligence/src/__tests__/lca-bug-localization.test.ts'
      - 'packages/intelligence/src/qa/**'
      - 'packages/intelligence/src/search/hybrid-search.ts'
      - 'scripts/lca-gate.js'
      - '.github/workflows/lca-bug-localization.yml'

concurrency:
  group: lca-bug-localization
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  measure:
    name: Measure bug localisation on the authors' test split
    runs-on: ubuntu-latest
    # **Three hours**, because the job checks out and analyses a repository per instance. A budget that is stated rather
    # than discovered by a timeout; the sample size is chosen to fit inside it.
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install parquet support
        run: python3 -m pip install --quiet pyarrow

      # **The split, from the repository that publishes it**, one parquet per language. The hub is public and the
      # licence is Apache-2.0; a 401 here means the dataset became gated, and the job fails rather than measuring a
      # different corpus.
      - name: Fetch the test split
        run: |
          set -euo pipefail
          mkdir -p benchmarks/corpora/lca
          base="https://huggingface.co/datasets/JetBrains-Research/lca-bug-localization/resolve/main"
          for config in py java kt; do
            url="$base/$config/test-00000-of-00001.parquet"
            code=$(curl -sSL -o "/tmp/$config.parquet" -w '%{http_code}' --retry 3 --max-time 600 "$url" || true)
            if [ "$code" != "200" ]; then
              echo "::error::$config split could not be downloaded (http $code); the measurement is skipped rather than invented"
              exit 1
            fi
            echo "$config http=$code bytes=$(wc -c < "/tmp/$config.parquet")"
            sha256sum "/tmp/$config.parquet" | tee -a "$GITHUB_STEP_SUMMARY"
          done

      # **Parquet to JSONL here, in Python, because the product is TypeScript and a parquet reader is not a dependency
      # it should acquire to be measured.** `changed_files` arrives as the string repr of a list, which is why this
      # step parses it rather than casting it.
      - name: Convert the split to JSONL
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          import json
          import pathlib

          import pyarrow.parquet as pq

          root = pathlib.Path('benchmarks/corpora/lca')
          for config in ('py', 'java', 'kt'):
              table = pq.read_table(f'/tmp/{config}.parquet')
              directory = root / config
              directory.mkdir(parents=True, exist_ok=True)
              out = directory / 'test.jsonl'
              rows = 0
              with out.open('w', encoding='utf-8') as handle:
                  for record in table.to_pylist():
                      changed = record.get('changed_files')
                      if isinstance(changed, str):
                          changed = ast.literal_eval(changed)
                      handle.write(json.dumps({
                          'id': int(record['id']),
                          'text_id': record.get('text_id'),
                          'repo_owner': record['repo_owner'],
                          'repo_name': record['repo_name'],
                          'base_sha': record['base_sha'],
                          'issue_title': record.get('issue_title') or '',
                          'issue_body': record.get('issue_body') or '',
                          'changed_files': list(changed or []),
                      }) + '\n')
                      rows += 1
              print(f'{config}: {rows} instances -> {out}')
          PY
          grep -c . benchmarks/corpora/lca/py/test.jsonl

      - name: Are the credentials present?
        id: credential
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        run: |
          if [ -n "$DEEPSEEK_API_KEY" ]; then echo "answer=true" >> "$GITHUB_OUTPUT"; else
            echo "answer=false" >> "$GITHUB_OUTPUT"
            echo "::warning::DEEPSEEK_API_KEY is absent, so the answer arm cannot run and the column will say so."
          fi
          # **Recorded, not used**: the retrieval arm of this benchmark is lexical by definition, so the value is here
          # to say whether a key exists at all rather than to turn a feature on.
          if [ -n "$ZHIPU_API_KEY" ]; then echo "vectors=present" >> "$GITHUB_OUTPUT"; else
            echo "vectors=absent" >> "$GITHUB_OUTPUT"
          fi

      # **`ZHIPU_API_KEY` is deliberately not exported here.** `createAllPhases()` includes the embedding phase, which
      # reads it from the environment: with the key present and the endpoint rate-limited, every one of the thirty-six
      # instances spent its time in retries against an API that was refusing the request, and the job was still running
      # after an hour with no figure to show. The retrieval arm of this benchmark is defined as lexical - the artifact
      # records `space.semantic: false` and the gate requires that it says so - so the key bought nothing and cost the
      # measurement. **The answer arm keeps `DEEPSEEK_API_KEY`**, because that one is the model.
      - name: Measure
        env:
          # **Absolute, because the pipeline joins its root and a relative root makes every path in the measurement
          # carry the corpus directory**: `benchmarks/.../checkouts/o__n/src/app.py` matched nothing in the corpus's
          # universe, and the second published figure was 0 for that reason alone. `toCorpusPath` handles it now, and
          # the fixture stays absolute anyway - two defences, because a figure that depends on one is a figure that
          # dies with it.
          LCA_DIR: ${{ github.workspace }}/benchmarks/corpora/lca
          LCA_MAX_ROWS: ${{ github.event.inputs.max_rows || '8' }}
          LCA_MAX_FILES: ${{ github.event.inputs.max_files || '2000' }}
          LCA_ANSWER_ARM: ${{ github.event.inputs.answer_arm || '0' }}
          BENCHMARK_WRITE: '1'
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -o pipefail
          npx vitest run --config vitest.config.ts \
            packages/intelligence/src/__tests__/lca-bug-localization.test.ts 2>&1 | tee /tmp/lca.log
          grep -o 'LCA-BUG-LOC .*' /tmp/lca.log | tail -1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Gate the figure
        if: always()
        run: node scripts/lca-gate.js

      - name: Upload the figure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lca-bug-localization
          path: benchmarks/lca-bug-localization.json
          if-no-files-found: warn
          retention-days: 90
