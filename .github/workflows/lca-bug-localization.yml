name: Long Code Arena — bug localisation

# **The second instrument.** OWASP Benchmark is closed at 1.0000, and iteration 38 said why that figure cannot move
# again: 2 740 generated servlets with one shape per case answer "is a flow followed", not "can a real repository's
# answer be found". This job measures the other question on somebody else's corpus.
#
# **The corpus is Long Code Arena, bug localisation** (Bogomolov et al., arXiv 2406.11612, NeurIPS 2024 D&B):
# given an issue and the repository at the commit where it reproduces, name the files that must change. The ground
# truth is the fixing commit, the metric is the authors' own `quality_metrics.py`, and the published baselines include
# BM25 and a `filepath_imports` context composer - so there is something to be compared against that is not us.
#
# **Nothing is committed.** The split and the checkouts are downloaded per run, so the job always measures the
# published revision; the artifact records the row count, the cuts and the configuration rather than only a number.
#
# **One job per language, and one process per instance.** This workflow was dispatched eleven times and produced no
# figure: every run ended with `The runner has received a shutdown signal` and exit code 143, at a hundredth of the
# scope as well as at the full sample. The cause was measured on four real checkouts rather than guessed
# (`MEASURED_MB_PER_FILE` in `packages/intelligence/src/benchmark/lca-instrument.ts`): an analysis of 568 files costs
# 2 088 MB of **resident** memory, and V8 returns reclaimed heap pages to itself rather than to the operating system -
# so a run costs the high-water mark of every instance it has analysed. Sharding by language fixed Python and Java and
# left Kotlin red on its first instance, because **the remaining bound was a statement about the machine while the
# analysis runs in a process**: `room` was computed from the runner's sixteen gigabytes and the process holding the
# result was capped at four gigabytes of heap, with tree-sitter's trees outside the heap entirely. So the unit of
# execution is now the unit of failure - `scripts/lca-instance.ts` measures one instance in one child process, the
# parent samples that process's resident set and kills it at `LCA_INSTANCE_RSS_MB`, and the row is published as refused
# naming the number that refused it. **A kill costs one row instead of the whole column, resident memory stops
# accumulating between instances, and the sample can be larger than the four rows a language used to yield.**
#
# **The retrieval arm needs no model**, which is why this job is cheap and why its figure is reproducible to the digit:
# a change in it is a change in the retriever. The answer arm runs when `DEEPSEEK_API_KEY` is present and says so when
# it is not.
#
# **The figure is published against the paper's own MAP table.** `LCA-MAP` prints our average precision beside the best
# published row and the number of rows it beats; the artifact carries the complete table with the protocol it was
# measured under, because a figure quoted without its sample size is a figure nobody can check.
#
# **And since iteration 71, beside a control that runs where the analysis cannot.** The rows a bound refuses are the
# large repositories - which are the ones with the most candidates and therefore the hardest - so a mean over the rows
# that survived is a mean over the easy part of the corpus stated in the same font as a mean over all of it. BM25 needs
# no parser, no graph and no model, so it ranks every checkout this job refuses; the artifact publishes the paired
# difference, the exact sign test on it, the per-size-band means of both rankings, and the measured mean reweighted to
# the attempted population. **A reader can now see how much easier the sample was instead of being asked to assume it
# was not.**

on:
  workflow_dispatch:
    inputs:
      max_rows:
        # **Fifty by default, which is the whole split**, and the reasons are two. The published baselines are means over
        # fifty instances per language, so a figure over twelve is a figure about a sixth of the protocol; and the rows
        # a smaller limit removes are whatever order the split happens to be in, which is a sample nobody chose. **The
        # budget, not this number, is what bounds the run**: a part records how many it intended, reached and measured,
        # so a run that stops at thirty-eight says so instead of reporting a sample of twelve as if it were the split.
        description: 'How many instances of each language split to measure'
        required: false
        default: '50'
      max_files:
        # **The stated cap, and it is no longer the bound that bites.** Since iteration 78 the memory bound is charged
        # at the model the run itself fits (511 MB fixed + 325 MB of margin + 22 KB per declaration, converted to files
        # at 120 declarations per file), so a dense 3 500-file checkout is refused by arithmetic before a process starts
        # and a sparse one is admitted. The cap is the promise to the reader that nothing above it is attempted at all,
        # and it doubled to 4 000 because at the old per-file rate the cap promised instances the ceiling would kill.
        description: 'Skip instances whose checkout holds more than this many files'
        required: false
        default: '4000'
      answer_arm:
        # **The model arm, off by default.** One completion per instance, on the slower half of the same measurement.
        description: 'Run the answer arm as well (1) or the deterministic retrieval arm alone (0)'
        required: false
        default: '0'
  push:
    branches: [master]
    paths:
      - 'packages/intelligence/src/__tests__/lca-bug-localization.test.ts'
      - 'packages/intelligence/src/benchmark/lca-*.ts'
      - 'packages/intelligence/src/qa/**'
      - 'packages/intelligence/src/search/hybrid-search.ts'
      # **The arms the retrieval column is made of, and the reason they are listed by name.** A change to a file-level
      # arm is a change in the figure this job publishes, and until iteration 81 the trigger named one search file out of
      # fourteen - so an arm could be rewritten with the measurement that exists to check it staying green and stale.
      - 'packages/intelligence/src/search/file-body.ts'
      - 'packages/intelligence/src/search/path-imports.ts'
      - 'packages/intelligence/src/search/lexical.ts'
      - 'packages/intelligence/src/search/file-ranking.ts'
      - 'packages/intelligence/src/search/fusion.ts'
      - 'scripts/lca-*.js'
      - 'scripts/lca-*.ts'
      - '.github/workflows/lca-bug-localization.yml'

concurrency:
  group: lca-bug-localization
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  measure:
    name: Measure ${{ matrix.language }} bug localisation
    runs-on: ubuntu-latest
    # **A hundred minutes per language, and the harness states its own budget inside it** (`LCA_BUDGET_MS`): a job that
    # runs out of time writes the part it has, with the rows it never reached recorded as skipped. A job cancelled from
    # outside writes nothing, which is how eleven runs produced no figure at all.
    timeout-minutes: 100
    strategy:
      # **One language failing must not cancel the others**, because the whole point of the shard is that a language
      # that dies costs its own column rather than the measurement.
      fail-fast: false
      matrix:
        language: [py, java, kt]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install parquet support
        run: python3 -m pip install --quiet pyarrow

      # **The split, from the repository that publishes it**, one parquet per language. The hub is public and the
      # licence is Apache-2.0; a 401 here means the dataset became gated, and the job fails rather than measuring a
      # different corpus. **All three are fetched by every leg**, because the corpus directory is one shape and a leg
      # that fetched only its own would be a different corpus by accident.
      - name: Fetch the test split
        run: |
          set -euo pipefail
          mkdir -p benchmarks/corpora/lca
          base="https://huggingface.co/datasets/JetBrains-Research/lca-bug-localization/resolve/main"
          for config in py java kt; do
            url="$base/$config/test-00000-of-00001.parquet"
            code=$(curl -sSL -o "/tmp/$config.parquet" -w '%{http_code}' --retry 3 --max-time 600 "$url" || true)
            if [ "$code" != "200" ]; then
              echo "::error::$config split could not be downloaded (http $code); the measurement is skipped rather than invented"
              exit 1
            fi
            echo "$config http=$code bytes=$(wc -c < "/tmp/$config.parquet")"
            sha256sum "/tmp/$config.parquet" | tee -a "$GITHUB_STEP_SUMMARY"
          done

      # **Parquet to JSONL here, in Python, because the product is TypeScript and a parquet reader is not a dependency
      # it should acquire to be measured.** `changed_files` arrives as the string repr of a list, which is why this
      # step parses it rather than casting it.
      - name: Convert the split to JSONL
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          import json
          import pathlib

          import pyarrow.parquet as pq

          root = pathlib.Path('benchmarks/corpora/lca')
          for config in ('py', 'java', 'kt'):
              table = pq.read_table(f'/tmp/{config}.parquet')
              directory = root / config
              directory.mkdir(parents=True, exist_ok=True)
              out = directory / 'test.jsonl'
              rows = 0
              with out.open('w', encoding='utf-8') as handle:
                  for record in table.to_pylist():
                      changed = record.get('changed_files')
                      if isinstance(changed, str):
                          changed = ast.literal_eval(changed)
                      handle.write(json.dumps({
                          'id': int(record['id']),
                          'text_id': record.get('text_id'),
                          'repo_owner': record['repo_owner'],
                          'repo_name': record['repo_name'],
                          'base_sha': record['base_sha'],
                          'issue_title': record.get('issue_title') or '',
                          'issue_body': record.get('issue_body') or '',
                          'changed_files': list(changed or []),
                      }) + '\n')
                      rows += 1
              print(f'{config}: {rows} instances -> {out}')
          PY
          grep -c . "benchmarks/corpora/lca/${{ matrix.language }}/test.jsonl"

      - name: Are the credentials present?
        id: credential
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        run: |
          if [ -n "$DEEPSEEK_API_KEY" ]; then echo "answer=true" >> "$GITHUB_OUTPUT"; else
            echo "answer=false" >> "$GITHUB_OUTPUT"
            echo "::warning::DEEPSEEK_API_KEY is absent, so the answer arm cannot run and the column will say so."
          fi
          # **Recorded, not used**: the retrieval arm of this benchmark is lexical by definition, so the value is here
          # to say whether a key exists at all rather than to turn a feature on.
          if [ -n "$ZHIPU_API_KEY" ]; then echo "vectors=present" >> "$GITHUB_OUTPUT"; else
            echo "vectors=absent" >> "$GITHUB_OUTPUT"
          fi

      # **The control runs in the parent, and the budget stops the loop rather than paying a fetch per refused row.**
      # BM25 is counted before each instance's bounds are decided, so a checkout the supervisor would kill still gets a
      # figure; and once the budget is spent the remaining rows are not fetched at all - twenty more `git fetch` calls at
      # up to four minutes each is a job that spends its last half hour learning what it already knew.
      #
      # **`ZHIPU_API_KEY` is deliberately not exported here.** `createAllPhases()` includes the embedding phase, which
      # reads it from the environment: with the key present and the endpoint rate-limited, every instance spent its time
      # in retries against an API that was refusing the request, and the job was still running after an hour with no
      # figure to show. The retrieval arm of this benchmark is defined as lexical - the artifact records
      # `space.semantic: false` and the gate requires that it says so - so the key bought nothing and cost the
      # measurement. **The answer arm keeps `DEEPSEEK_API_KEY`**, because that one is the model.
      - name: Measure
        env:
          # **Absolute, because the pipeline joins its root and a relative root makes every path in the measurement
          # carry the corpus directory**: `benchmarks/.../checkouts/o__n/src/app.py` matched nothing in the corpus's
          # universe, and the second published figure was 0 for that reason alone. `toCorpusPath` handles it now, and
          # the fixture stays absolute anyway - two defences, because a figure that depends on one is a figure that
          # dies with it.
          LCA_DIR: ${{ github.workspace }}/benchmarks/corpora/lca
          LCA_LANGUAGES: ${{ matrix.language }}
          LCA_MAX_ROWS: ${{ github.event.inputs.max_rows || '50' }}
          # **Four thousand, raised from two thousand because the memory bound is now a model rather than a rate.** At
          # the superseded 3.7 MB per file the cap promised instances the 6 144 MB ceiling would kill - a 2 000-file
          # checkout was charged 7 400 MB - while the honest memory bound refused 1 700-file checkouts first. Charged at
          # the fitted 22 KB per declaration plus the fixed cost, the ceiling affords 1 916 files at the operating
          # density, so this cap bounds what will be *attempted* and the model refuses what will not fit, per instance
          # and with its arithmetic in the row.
          #
          # **And the raise bought nothing, which is published rather than quietly left standing.** Over the two runs
          # that differ by it, the 27 refusals the old cap produced became **13 cap refusals and 14 refusals by the
          # density model** - the model's own bound is 1 999 files, which is the old cap to within a rounding - while the
          # six instances that did become rows were all under 2 000 files already and moved because the *rate* changed.
          # A cap above the model's bound is a promise the model immediately withdraws; it stays at 4 000 because the
          # model's bound moves with the runner's memory, and the artifact reports both numbers side by side.
          LCA_MAX_FILES: ${{ github.event.inputs.max_files || '4000' }}
          # **Fifty minutes, stated by the harness rather than discovered by the job's own timeout.** The bounds module
          # projects 50 ms per file; this is the other half of the arithmetic, and a run that reaches it writes a part
          # whose unmeasured rows say so.
          # **Seventy minutes, raised from fifty because the previous run lost nine instances to it.** Iteration 76
          # added a file-level arm that the parent reads before each child starts, and the fifty-minute budget that had
          # covered 150 instances covered 141: the nine were not refused by a bound, they were never examined. The job
          # timeout is a hundred minutes, so this leaves thirty for the merge and the gates.
          LCA_BUDGET_MS: '4200000'
          LCA_ANSWER_ARM: ${{ github.event.inputs.answer_arm || '0' }}
          # **The ceiling one instance may reach, enforced by the supervisor rather than promised by the harness.**
          # Every earlier bound was a statement about the machine: `room` was computed from the runner's sixteen
          # gigabytes while the process holding the result was capped at four gigabytes of heap, and tree-sitter's
          # trees are native memory that no heap flag bounds - which is how `airbnb/lottie-android` took the Kotlin leg
          # down with `exit 143` and no row. A child is killed at `LCA_INSTANCE_RSS_MB` and the row is published as
          # refused, naming the figure that refused it.
          LCA_INSTANCE_RSS_MB: '6144'
          LCA_INSTANCE_HEAP_MB: '3072'
          LCA_INSTANCE_TIMEOUT_MS: '900000'
          BENCHMARK_WRITE: '1'
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # **The workspace imports in the child resolve through a tsconfig**, because the packages' `main` points at a
          # `dist/` this job does not build and a figure measured against a stale build is a figure about the build.
          TSX_TSCONFIG_PATH: tsconfig.tests.json
          # **A stated heap for the orchestrator, and it no longer has to be the analyser's.** Iteration 69 moved each
          # instance's analysis into its own process, so this heap holds vitest, the row bookkeeping and nothing else:
          # a smaller figure here is the architecture's own claim, and a parent that grows past it is a defect rather
          # than a measurement.
          NODE_OPTIONS: --max-old-space-size=2048
        run: |
          set -o pipefail
          # **Line-buffered, because a killed process loses a block-buffered pipe.** Every log of this job used to end
          # at the vitest banner, which said nothing about where it stopped: `stdout` through `tee` is buffered in 4 KB
          # blocks, so everything written before the signal went with it. `stdbuf -oL` makes the last line written the
          # last line kept - and that is how the growth in resident memory became visible.
          mkdir -p benchmarks/lca-parts
          npx vitest run --config vitest.config.ts \
            packages/intelligence/src/__tests__/lca-bug-localization.test.ts 2>&1 \
            | stdbuf -oL -eL tee "benchmarks/lca-parts/${{ matrix.language }}.log"
          grep -o 'LCA-PART .*' "benchmarks/lca-parts/${{ matrix.language }}.log" | tail -1 \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # **The part and the log, whether or not the measurement finished.** A part is written after every instance's
      # bounds are decided, so a run that dies has one; a log is what says where it died, and losing it is what made
      # the first eleven runs undiagnosable.
      - name: Upload the part
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lca-part-${{ matrix.language }}
          # **One root, so the artifact is one directory**: a second path outside the workspace makes the archive's
          # layout depend on the least common ancestor of two unrelated directories.
          path: benchmarks/lca-parts/
          # **The log is uploaded with the part** - it is what says where a run that died, died.
          if-no-files-found: warn
          retention-days: 90

  combine:
    name: Combine the parts and gate the figure
    needs: measure
    # **`always()`, because a missing column is a fact to record rather than a reason to hide the columns that exist.**
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Collect the parts
        uses: actions/download-artifact@v4
        with:
          pattern: lca-part-*
          path: benchmarks/lca-parts
          merge-multiple: true

      # **The arithmetic is a module with tests, and this step is the call.** The combination is a mean over the pooled
      # rows rather than over the per-language means, so the combined figure is the one a single run would have
      # produced; `scripts/lca-merge.ts` also names any part that is absent from the artifact.
      - name: Combine
        env:
          BENCHMARK_WRITE: '1'
        run: npx tsx scripts/lca-merge.ts

      - name: Gate the figure
        run: node scripts/lca-gate.js

      - name: Upload the figure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lca-bug-localization
          path: benchmarks/lca-bug-localization.json
          if-no-files-found: warn
          retention-days: 90
