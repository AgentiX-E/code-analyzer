# @code-analyzer — Release Drafter
#
# Automatically drafts the next release notes based on merged PR labels.
# Updates the draft on every push to master.
#
# Triggered:
#   - On push to master
#   - Manually via workflow_dispatch

name: Release Drafter

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-release-draft:
    name: Update Release Draft
    runs-on: ubuntu-latest
    # **`contents: write` because the draft is a release object**, and `pull-requests: read` because the notes are
    # assembled from merged PR labels. Both are what this one job does; the workflow level holds neither, so nothing
    # added here later inherits the write.
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Draft release notes
        uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7
        with:
          config-name: release-drafter-config.yml
          disable-autolabeler: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
