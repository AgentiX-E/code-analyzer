# @code-analyzer — VS Code Extension CI
#
# Builds, tests, packages, and optionally publishes the VS Code extension.
# Runs on PRs (build + test only) and pushes to main (build + package + publish).
#
# Features:
#   - TypeScript compilation verification
#   - VS Code extension tests (using @vscode/test-electron)
#   - .vsix package generation
#   - Automatic publishing to VS Code Marketplace (on version tags)
#   - Extension signing

name: VS Code Extension CI

on:
  push:
    branches: [main]
    paths:
      - 'packages/vscode/**'
      - 'packages/shared/**'
      - 'packages/core/**'
      - 'packages/infra/**'
      - 'packages/analyzer/**'
      - 'packages/intelligence/**'
      - '.github/workflows/vscode-ci.yml'
    tags:
      - 'v*'
  pull_request:
    branches: [main]
    paths:
      - 'packages/vscode/**'
      - '.github/workflows/vscode-ci.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to VS Code Marketplace (true/false)'
        required: false
        type: boolean
        default: false

env:
  NODE_VERSION: '22'

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all dependencies
        run: pnpm build --filter=...@code-analyzer/vscode

      - name: Build VS Code extension
        run: pnpm --filter @code-analyzer/vscode build

      - name: Type-check extension
        run: pnpm --filter @code-analyzer/vscode typecheck
        continue-on-error: true

  test:
    name: Test Extension
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all dependencies
        run: pnpm build --filter=...@code-analyzer/vscode

      - name: Run extension tests
        run: pnpm --filter @code-analyzer/vscode test
        continue-on-error: true

  package:
    name: Package .vsix
    needs: [build, test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all dependencies
        run: pnpm build --filter=...@code-analyzer/vscode

      - name: Install vsce
        run: pnpm add -g @vscode/vsce

      - name: Package extension
        working-directory: packages/vscode
        run: pnpm exec vsce package --out ../../dist/code-analyzer.vsix

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-analyzer-vsix
          path: dist/code-analyzer.vsix
          retention-days: 90

  publish:
    name: Publish to Marketplace
    needs: package
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.publish) ||
      (startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    environment:
      name: marketplace
      url: https://marketplace.visualstudio.com/items?itemName=Lambertyan.code-analyzer

    steps:
      - name: Download .vsix
        uses: actions/download-artifact@v4
        with:
          name: code-analyzer-vsix
          path: dist/

      - name: Publish to VS Code Marketplace
        run: |
          pnpm add -g @vscode/vsce
          pnpm exec vsce publish \
            --packagePath dist/code-analyzer.vsix \
            --pat ${{ secrets.VSCE_PAT }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
