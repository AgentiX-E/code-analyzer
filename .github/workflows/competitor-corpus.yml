name: Competitor Corpus

# **The five repositories the field's benchmark names, reviewed by us.**
#
# **Why this job exists.** Every figure this repository publishes is on a corpus it chose, and **a corpus you chose
# cannot be compared with a competitor's** - the page says so in as many words. **The field's independent benchmark is
# Martian's Code Review Bench, and its offline arm is open-sourced with its dataset: "50 PRs from 5 major open-source
# projects, each with human-verified golden comments" - Sentry, Grafana, Cal.com, Discourse and Keycloak.**
#
# **So this job clones those five and reviews them**, which makes the comparison **a thing we run rather than a claim
# we make.** **It does not reproduce Martian's judge** - that scores whether a developer *acted* on a comment, and
# only their pipeline can do it - **so what this produces is our own precision and recall against the same
# repositories on the same dates**, and **the artifact says both facts rather than one.**
#
# **And it is dispatched rather than scheduled**, because **five real repositories is a lot of reading and each run
# calls a model.**

on:
  workflow_dispatch:
  schedule:
    # **Off-peak on purpose.** The vendor halves every price outside 01:00-04:00 and 06:00-10:00 UTC on weekdays,
    # so a weekly run at this hour costs half what the same run costs at 08:00 - and this workflow's own artifact
    # records the spend it took to produce the figure.
    - cron: '0 5 * * 2'
  # **Not even this file.** A workflow's own edit used to re-run it, so fixing a trigger cost one run of the
  # thing it triggers - which is the shape of a bill that pays for its own paperwork. `gate:actions` and the project
  # standards check read this file on every push; the paid run is a dispatch or the weekly schedule.
  push:
    branches: [master]
    paths:
      - '.github/scripts/measure-competitor-corpus.mjs'

concurrency:
  group: competitor-corpus
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  competitor-corpus:
    name: Review the five repositories the field measures on
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      # **Shallow and pinned**, so **a figure has a date and a commit** and **two runs of this job can be compared.**
      - name: Clone the five
        run: |
          set -e
          mkdir -p /tmp/field
          clone() {
            name="$1"; ref="$2"
            echo "cloning $name at $ref"
            git clone --depth 1 --branch "$ref" "https://github.com/$name" "/tmp/field/$(basename "$name")"
          }
          clone getsentry/sentry 24.10.0
          clone grafana/grafana v11.2.0
          clone calcom/cal.com v4.5.0
          clone discourse/discourse v3.4.0
          clone keycloak/keycloak 26.0.0
          du -sh /tmp/field/*

      - name: Review them, or say why not
        env:
          # **Read from the environment and never written anywhere**, the same boundary the semantic job draws.
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node .github/scripts/measure-competitor-corpus.mjs

      - name: Upload the figure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: competitor-corpus
          path: benchmarks/competitor-corpus.json
          if-no-files-found: warn
          retention-days: 90
