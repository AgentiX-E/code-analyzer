name: AACR Re-read

# **A rejected golden is not a missed defect, and the artifact cannot tell you which it is.**
#
# The lanes run of 2026-11-16 rejected **434 goldens in files it had commented on**, 263 of them on the exact line. Read
# by hand, those pairs are three different things - the same defect said in other words, a different defect at the same
# line, and a nit this reviewer does not write - and **the three want three different devices**. The artifact reports one
# number.
#
# **So this job re-reads the pairs, and it is the cheapest experiment in the repository**: the reviews are paid for, the
# goldens are in the artifact, the comments are in the artifact. About 530 judge calls, two minutes, no review pass.
#
# **And it is controlled.** Every real pair is read beside a crossed pair whose golden comes from another pull request.
# A reader that accepts both earns nothing, and `beyondControl` in the report is the only number that may be quoted as
# recovery - because the failure this job could cause is a looser matcher reported as a better reviewer, and that is the
# one direction no gate in `aacr-bench.yml` can see.

on:
  workflow_dispatch:
    inputs:
      run_id:
        # **The run whose artifact is being re-read**, and it is required: the artifact name alone does not identify a
        # run, and a re-read of the wrong one would produce a rate about a different corpus.
        description: 'Run id of the bench run whose artifact is re-read'
        required: true
        type: string
      artifact:
        description: 'Artifact name inside that run'
        required: false
        type: string
        default: 'aacr-bench-advisory-off-off-off-off-off-off'
      limit:
        # **A cap, because the first reading of a new instrument should be cheap.** Zero reads every pair; a positive
        # number reads that many from the front, which is enough to see whether the three-way split is real before
        # paying for all 263.
        description: 'How many pairs to read (0 = all)'
        required: false
        type: string
        default: '0'
      judge_model:
        # **The model that reads the pairs, and the only reason this input exists is that the floor has only ever been
        # read by one of them.** Every reading in §69.4 - 18.6 % against a 16.0 % floor, seven recoverable pairs - came
        # from `deepseek-chat`, which is also the model that **wrote** the comments being judged. The self-preference
        # literature says a judge is more generous towards its own family's text, so the floor may be reporting the
        # judge rather than the pairs. **Pre-registered: the same-file floor stays inside 16.0 ± 0.05 under a second
        # judge, and the paired verdicts do not separate at p ≤ 0.05.** Not ± 0.01: 0.160 over 219 pairs carries a
        # sampling error of 0.025, and a bar narrower than the reading it tests fails for arithmetic.
        description: 'Judge model for the re-read (a second one re-reads the same pairs)'
        required: false
        type: string
        default: 'deepseek-chat'
      concurrency:
        # **Flight count, because it and the ceiling are one decision.** 967 pairs at six in flight is two minutes for
        # the chat judge and more than twenty for a reasoning one, so a judge that thinks before answering needs both a
        # higher ceiling and more calls in flight. **The two are inputs rather than constants because the reader is now a
        # parameter**, and a constant dimensioned on the fastest reader is a constant that fails on the slowest.
        description: 'Judge calls in flight (a reasoning judge needs more)'
        required: false
        type: string
        default: '6'

permissions:
  # **`actions: read` is the permission this job exists on**: the artifact belongs to another run, and reading it across
  # runs is what makes re-reading cheaper than dispatching again.
  actions: read
  contents: read

concurrency:
  # One re-read per run **and per judge**, and a second dispatch of the same pair replaces the first: two readers
  # spending the same judge budget on the same pairs produce one answer and two bills. **The model is in the key because
  # it was not, and a second judge's dispatch cancelled the first mid-flight** - the one failure mode that looks like a
  # missing artifact rather than like a collision.
  group: aacr-rejudge-${{ inputs.run_id }}-${{ inputs.judge_model }}
  cancel-in-progress: true

jobs:
  rejudge:
    name: Re-read the rejected pairs (${{ inputs.artifact }} of run ${{ inputs.run_id }})
    runs-on: ubuntu-latest
    # **Sixty, from twenty, and the twenty was measured on the fast reader**: the chat judge read 967 pairs in about two
    # minutes at six in flight and the first reasoning-judge dispatch was cancelled at the old ceiling with no report
    # written - **a job that dies at its ceiling spends the calls and produces nothing**, which is the exact failure the
    # confirmation guard exists to prevent. Sixty minutes at six in flight covers a reader eight times slower than the
    # one the number was chosen on.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # **No pnpm, no install.** The reader uses `node:` built-ins and one fetch, which is why it can be run on a laptop
      # against a downloaded artifact without a workspace at all.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc

      - name: Download the artifact being re-read
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ inputs.artifact }}
          path: /tmp/artifact
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # **The arithmetic before the calls**, because a bug in the summary would be discovered after 530 of them.
      - name: Prove the summary arithmetic on written-out answers
        run: node scripts/aacr-rejudge.mjs --self-test

      - name: Re-read the pairs
        env:
          AACR_JUDGE_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          AACR_JUDGE_MODEL: ${{ inputs.judge_model }}
          AACR_REJUDGE_CONCURRENCY: ${{ inputs.concurrency }}
        run: |
          # **`pipefail`, because the guard's exit code was being thrown away by `tee`.** The step reported success on a
          # reading that answered 19 of 20 pairs: `node ... | tee` returns `tee`'s status, so a refusal is a green tick
          # with a sentence nobody reads underneath it.
          set -o pipefail
          node scripts/aacr-rejudge.mjs \
            --bench /tmp/artifact \
            --limit "${{ inputs.limit }}" \
            --out /tmp/rejudge/report.json | tee /tmp/rejudge.log

      - name: Put the reading on the run page
        if: always()
        run: |
          {
            echo '## The rejected pairs, read again'
            echo
            echo 'Every real pair is read beside a crossed pair whose golden comes from another pull request.'
            echo '**The recovery is the difference between the two rates**, never the first rate.'
            echo
            sed -n '/| reading |/,$p' /tmp/rejudge.log || true
          } >> "$GITHUB_STEP_SUMMARY"

      # **Uploaded even when the reading failed**, because a partial report is what says whether a failure was the
      # endpoint or the pairs - and an artifact that only exists on success is an artifact that cannot answer that.
      - name: Upload the reading
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          # **The judge is in the name**, because two readings of one run are two artifacts: this said only the run id,
          # so a second judge uploaded under the first reading's name and a reader downloaded the wrong report.
          name: aacr-rejudge-${{ inputs.run_id }}-${{ inputs.judge_model }}
          path: |
            /tmp/rejudge/report.json
            /tmp/rejudge.log
          if-no-files-found: warn
