name: Secret Probe

# **Which credentials this repository's jobs can actually see, asked rather than assumed.**
#
# **Why this exists.** The semantic review benchmark needs a model credential, and **the question "is one available"
# has three possible answers**: an organization secret that reaches this repository, a repository secret, or nothing.
# **The API cannot answer it** - listing organization secrets needs a scope this token does not carry - **so the job
# answers it instead**, which is **the only place the question has a definitive answer anyway**: **a secret that exists
# but is not exposed to this repository is not available to this repository.**
#
# **What it prints: names and presence, never values.** Each candidate is expanded with `${VAR:+present}` so **the
# output is `present` or an empty string**, and **nothing that could carry a credential reaches the log.** **That is
# the whole reason for the `+` form rather than echoing the variable.**
#
# **And the candidate list is deliberately longer than what is needed**, because **the point is to learn the naming
# the organization used**, not to confirm a guess - **a probe that only checks one spelling answers one spelling.**

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Ask which credentials are exposed here
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Report presence, never values
        env:
          # **The candidates, taken from the workflow that needs them and from the names an organization commonly
          # uses for the two providers this project has used.**
          CANDIDATE_1: ${{ secrets.DEEPSEEK_API_KEY }}
          CANDIDATE_2: ${{ secrets.DEEPSEEK_KEY }}
          CANDIDATE_3: ${{ secrets.DEEPSEEK_API_TOKEN }}
          CANDIDATE_4: ${{ secrets.ZHIPU_API_KEY }}
          CANDIDATE_5: ${{ secrets.ZHIPUAI_API_KEY }}
          CANDIDATE_6: ${{ secrets.GLM_API_KEY }}
          CANDIDATE_7: ${{ secrets.ZHIPU_KEY }}
          CANDIDATE_8: ${{ secrets.OPENAI_API_KEY }}
          CANDIDATE_9: ${{ secrets.LLM_API_KEY }}
        run: |
          # **`${VAR:+present}` and never `$VAR`**, so the log carries the answer without the credential.
          echo "DEEPSEEK_API_KEY=${CANDIDATE_1:+present}"
          echo "DEEPSEEK_KEY=${CANDIDATE_2:+present}"
          echo "DEEPSEEK_API_TOKEN=${CANDIDATE_3:+present}"
          echo "ZHIPU_API_KEY=${CANDIDATE_4:+present}"
          echo "ZHIPUAI_API_KEY=${CANDIDATE_5:+present}"
          echo "GLM_API_KEY=${CANDIDATE_6:+present}"
          echo "ZHIPU_KEY=${CANDIDATE_7:+present}"
          echo "OPENAI_API_KEY=${CANDIDATE_8:+present}"
          echo "LLM_API_KEY=${CANDIDATE_9:+present}"
          echo "---"
          # **And which of the names a job sees in its own environment**, because **a secret that is set as an env var
          # at the job level would appear here** rather than needing the `secrets` context.
          echo "env names containing KEY or TOKEN or SECRET:"
          env | grep -oE '^[A-Z_]*(KEY|TOKEN|SECRET)[A-Z_]*' | sort -u || echo "  none"
