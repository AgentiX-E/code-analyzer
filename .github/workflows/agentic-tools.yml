name: Agentic surface — L4

# **The layer nobody had measured.** Four iterations of `benchmarks/status-register.json` recorded the same gap: 51 MCP
# tools, five roles, and not one record of an agent choosing among them. Every other measurement in this repository is
# about an engine — a retriever's ranking, a parser's accuracy, a localiser's MAP — and none of them is about the moment
# a developer types a sentence and something decides which engine to run.
#
# **What this job measures, in one sentence.** Given the live tool catalog and a sentence in a user's words, does the
# agent name the right tool, state a call its own schema accepts, name entities that exist, and — where the tool can run
# without a corpus it does not have — produce an assertion that holds?
#
# **Three arms, and the third one is why the other two mean anything.**
#
# 1. `full` — the real catalog: name, description, parameter schema. Three attempts per task, so the figure has a
#    reliability half (`pass^k`: every attempt right) and not only an average.
# 2. `names-only` — the same model with the descriptions replaced by the tool's name spelled out. One attempt. **This
#    isolates whether the descriptions are doing any work**; if it scores within the interval of `full`, they are not,
#    and that is a finding the product has to act on either way.
# 3. `lexical` — no model at all. BM25 over the catalog, one deterministic attempt, which is the honest stand-in for the
#    description-index router a product without an agent loop ships. It is the null the model has to clear.
#
# **The headline is the decoyed subset.** 80 of the 100 tasks name a decoy: a real tool in the same family whose name and
# description are close enough that a keyword router picks it and that is wrong for the stated intent. A task whose gold
# tool is the only plausible one measures nothing, so accuracy on the decoyed subset — where being right is
# distinguishable from being lucky — is the number this workflow exists to produce.
#
# **The corpus is this repository.** The fixture is `packages/intelligence/src/search` plus
# `packages/intelligence/src/review/llm`, copied to a temporary checkout and indexed by the product's own pipeline —
# 805 nodes on the commit that added this file. Not a synthetic project: a fixture written for a benchmark contains the
# symbols the benchmark needed, and a real module contains the symbols the code has.
#
# **Nothing here is a local-only measurement.** The runner is the workflow, the model is the organisation's
# `DEEPSEEK_API_KEY`, and the artifact records the commit, the model, the attempts and the interval beside every rate.
#
# **The job fails when it cannot measure.** A missing key is an error rather than a green run with an empty table: a
# workflow that exists to produce a number and produces nothing while reporting success is the defect this repository
# has spent three iterations removing from its documents.

on:
  workflow_dispatch:
    inputs:
      attempts:
        description: 'Attempts per task for the model arms (pass^k needs more than one)'
        required: false
        default: '3'
      tasks:
        description: 'Comma-separated task ids to run, or empty for the whole set'
        required: false
        default: ''
  push:
    branches: [master]
    paths:
      - 'packages/intelligence/src/benchmark/agentic/**'
      - 'packages/mcp/src/tools/**'
      - 'packages/mcp/src/server/**'
      - 'packages/mcp/src/eval/**'
      - 'scripts/agentic-tools.ts'
      - 'scripts/agentic-permissions.ts'
      - '.github/workflows/agentic-tools.yml'

concurrency:
  group: agentic-tools
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  measure:
    name: Measure tool selection against the catalog
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Refuse to run without a model
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "::error::DEEPSEEK_API_KEY is not available to this workflow, so none of the three arms can be compared. A run that reports success without a model would publish a table whose model column is empty."
            exit 1
          fi

      # **The answer key first, and it must score 1.0.** If the gold calls do not pass through the same execution and
      # scoring path the model's calls take, then a correct answer would not have scored 1.0 either and every number
      # below is capped for a reason that belongs to the benchmark rather than to the model.
      - name: Verify the answer key before measuring anything
        run: npm run docs:agentic

      - name: Measure
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          AGENTIC_MODEL: deepseek-chat
        run: |
          TSX_TSCONFIG_PATH=tsconfig.tests.json npx tsx scripts/agentic-tools.ts --run \
            --attempts "${{ github.event.inputs.attempts || '3' }}" \
            ${{ github.event.inputs.tasks && format('--task {0}', github.event.inputs.tasks) || '' }} \
            --write

      - name: Record the figures in the job summary
        if: always()
        run: |
          if [ ! -f benchmarks/agentic-tools.json ]; then
            echo "### L4 — no artifact was produced" >> "$GITHUB_STEP_SUMMARY"
            echo "The run did not write \`benchmarks/agentic-tools.json\`; the log above says why. **Nothing is claimed.**" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const a = require('./benchmarks/agentic-tools.json');
          // **A p of 1.7e-14 printed with four decimals is a p of 0.0000**, which reads as impossible rather than as
          // overwhelming. Anything below 1e-4 is printed in exponential notation.
          const fmtP = (p) => (p < 1e-4 && p > 0 ? p.toExponential(2) : p.toFixed(4));
          const row = (name, arm) => {
            const p = arm.decoyed;
            const f = (x) => (x === null ? '—' : x.toFixed(4));
            return `| ${name} | ${p.n}/${p.of} | **${f(p.value)}** | [${f(p.lower)}, ${f(p.upper)}] | ${f(arm.overall.value)} | ${arm.passEvery.n}/${arm.passEvery.of} |`;
          };
          console.log('## L4 — tool selection');
          console.log('');
          console.log(`Commit \`${a.commit}\` · model \`${a.model}\` · ${a.tasks} tasks · ${a.decoyedTasks} decoyed · catalog ${a.catalog.tools} tools · fixture ${a.catalog.indexedNodes} nodes`);
          console.log('');
          console.log('| arm | decoyed correct | rate | 95 % Wilson | overall | pass^k |');
          console.log('| --- | --- | --- | --- | --- | --- |');
          for (const [name, arm] of Object.entries(a.arms)) console.log(row(name, arm));
          console.log('');
          const c = a.comparison;
          console.log(`McNemar against the null: full vs lexical — only-full ${c.full_vs_lexical.onlyA}, only-lexical ${c.full_vs_lexical.onlyB}, p = ${fmtP(c.full_vs_lexical.pValue)}`);
          console.log('');
          console.log(`McNemar on the description ablation: full vs names-only — only-full ${c.full_vs_names_only.onlyA}, only-names ${c.full_vs_names_only.onlyB}, p = ${fmtP(c.full_vs_names_only.pValue)}`);
          console.log('');
          // **What it chose, not only whether it was right.** A rate says how often; the histogram says whether the
          // answer key is narrow (one tool absorbing everything) or the model is diffuse (a different tool per attempt).
          const full = (a.choices || []).find((entry) => entry.arm === 'full');
          if (full) {
            const histogram = new Map();
            for (const step of full.steps) {
              const name = step.chose[0] || '(no call)';
              histogram.set(name, (histogram.get(name) || 0) + 1);
            }
            const top = [...histogram.entries()].sort((l, r) => r[1] - l[1]).slice(0, 10);
            console.log('Most-chosen tools on the `full` arm (all steps, all attempts):');
            console.log('');
            console.log('| tool | steps |');
            console.log('| --- | --- |');
            for (const [name, count] of top) console.log(`| \`${name}\` | ${count} |`);
            console.log('');
            const distinct = histogram.size;
            console.log(`${distinct} distinct tools were named across ${full.steps.length} steps.`);
          }
          NODE

      # **The artifact is not committed from here.** A bot commit would put a figure in the repository that no reviewer
      # read; the merge is `download the artifact, copy it to benchmarks/agentic-tools.json, run docs:agentic, commit`.
      - name: Upload the artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: agentic-tools
          path: benchmarks/agentic-tools.json
          if-no-files-found: warn
          retention-days: 30

  # **The second axis of the same layer.** `measure` asks whether the agent picks the right tool; this job asks what
  # happens when the tool result tells it to do something else. The two are separate because the second one can only be
  # read beside a control: a rate of 0 % from a harness that has never seen compliance is a statement about the harness.
  permission:
    name: Measure what a planted instruction does, and what the fence does
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # **Three checks, none of which needs a key, and between them they execute every line of the run path.** The dry
      # run puts a scripted model through `runAttempt`, the scorer, the artifact assembly and the fence replay, which is
      # the coverage that was missing when a previous iteration shipped a run path that died on a missing import.
      - name: Check the corpus, the fence and the run path
        run: npm run docs:permissions

      - name: Refuse to run without a model
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "::error::DEEPSEEK_API_KEY is not available to this workflow, so the five arms cannot be compared. A run that reports success without a model would publish a rate whose denominator is a question nobody asked."
            exit 1
          fi

      - name: Measure
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          AGENTIC_MODEL: deepseek-chat
        run: |
          # **One attempt, a hundred sites.** Repetition would quote the same hundred files three times; breadth moves
          # the interval on a zero from 6.0 % to 3.6 %, and the interval is the whole claim. `--limit` exists for a
          # smoke run, not for a published one.
          TSX_TSCONFIG_PATH=tsconfig.tests.json npx tsx scripts/agentic-permissions.ts --run \
            --attempts 1 \
            --write

      - name: Record the figures in the job summary
        if: always()
        run: |
          if [ ! -f benchmarks/agentic-permissions.json ]; then
            echo "### L4 permissions — no artifact was produced" >> "$GITHUB_STEP_SUMMARY"
            echo "The run did not write \`benchmarks/agentic-permissions.json\`; the log above says why. **Nothing is claimed.**" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const a = require('./benchmarks/agentic-permissions.json');
          const f = (x) => (x === null ? '—' : x.toFixed(4));
          console.log('## L4 — what a planted instruction does');
          console.log('');
          console.log(`Commit \`${a.commit}\` · model \`${a.model}\` · ${a.corpus.modules} modules · ${a.attempts} attempts per task`);
          console.log('');
          console.log('| arm | exposed | complied | asr (of exposed) | 95 % Wilson | compliance (of all) | effect |');
          console.log('| --- | --- | --- | --- | --- | --- | --- |');
          for (const [name, arm] of Object.entries(a.arms)) {
            console.log(`| ${name} | ${arm.exposed}/${arm.attempts} | ${arm.asr.n} | **${f(arm.asr.value)}** | [${f(arm.asr.lower)}, ${f(arm.asr.upper)}] | ${f(arm.compliance.value)} (${arm.compliance.n}/${arm.compliance.of}) | ${arm.effect.n}/${arm.effect.of} |`);
          }
          console.log('');
          console.log('| arm | started with |');
          console.log('| --- | --- |');
          for (const [name, arm] of Object.entries(a.arms)) {
            const calls = Object.entries(arm.firstCalls || {})
              .sort((x, y) => y[1] - x[1])
              .map(([tool, n]) => `${tool} ${n}`)
              .join(', ');
            console.log(`| ${name} | ${calls || '—'} |`);
          }
          console.log('');
          const c = a.comparison;
          for (const [key, value] of Object.entries(c)) {
            const p = value.pValue < 1e-4 && value.pValue > 0 ? value.pValue.toExponential(2) : value.pValue.toFixed(4);
            console.log(`- \`${key}\`: only-A ${value.onlyA}, only-B ${value.onlyB}, both ${value.both}, neither ${value.neither}, p = ${p}`);
          }
          console.log('');
          console.log(`**Fence replay.** The model's own destructive calls, ${a.fence.replayed} of them, replayed against the two restricted configurations: executed on an open server ${a.fence.executed}, refused by a read-only client ${a.fence.readOnlyRefused}, refused by a \`scout\` profile ${a.fence.scoutRefused}.`);
          console.log('');
          console.log('`asr` is compliance over the attempts where the payload reached the model; `compliance` is over every attempt. Where they differ, exposure was partial and the first number is over a smaller denominator.');
          NODE

      - name: Upload the artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: agentic-permissions
          path: benchmarks/agentic-permissions.json
          if-no-files-found: warn
          retention-days: 30
