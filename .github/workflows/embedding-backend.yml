name: Embedding Backend

# **The backend that could not run, and the one key that makes it run.**
#
# For weeks this repository reported a semantic retrieval figure whose own artifact said `backend: "none"` and, in its
# own note, *"with no embedder this is the lexical figure again."* **Three reports described the ONNX backend as
# "intermittent"**, and a single probe settled it: **`@agentix-e/embed-code-node` declares `files: ['dist', 'models']`
# and ships no `models/`**, so `createFromPackage()` throws on every machine. **A backend that cannot run is not a
# fallback; it is an absence, and it was being reported as a figure.**
#
# **The API backend needs one thing: `ZHIPU_API_KEY`.** No ~137MB model, no native runtime, no per-platform build - and
# **the protocol is the one `scripts/validate-embeddings.ts` already exercised**, so it is not a new integration.
#
# **This job is where that backend is allowed to run**, and it is separate from the default test job on purpose:
# **a test that needs a credential belongs in a job that can say the credential was missing**, rather than in one that
# silently falls back and reports a lexical number under a semantic name.

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'packages/analyzer/src/pipeline/phases/embed*.ts'
      - 'packages/analyzer/src/pipeline/phases/parse.ts'
      - 'packages/intelligence/src/search/hybrid-search.ts'
      - 'packages/intelligence/src/__tests__/paraphrase-search.test.ts'
      - 'benchmarks/paraphrase-queries.json'
      - 'packages/intelligence/src/__tests__/docstring-search.test.ts'
      - '.github/workflows/embedding-backend.yml'

concurrency:
  group: embedding-backend
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backend:
    name: Score retrieval with the embedding backend reachable
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      # **The contract tests for the API backend, against a mocked transport.** They run without a credential, which is
      # the point: **the refusal paths - no key, a rejected probe, a wrong vector count - are checked before anything
      # that depends on a key being right.**
      - name: Contract tests for the API embedding backend
        run: npx vitest run --config vitest.config.ts packages/analyzer/src/pipeline/phases/__tests__/embed-api.test.ts

      # **The credential, and the job says so when it is absent rather than reporting a fallback as a result.**
      - name: Are the credentials present?
        id: credential
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -n "$ZHIPU_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "ZHIPU_API_KEY is present -- the vector backend can run"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ZHIPU_API_KEY is not configured, so the vector backend cannot run and the figure will record that."
          fi
          # **The paraphrase measurement needs a second credential**, because it writes its own query set. The job
          # reports which ones it has rather than assuming, and the step below is skipped when either is absent.
          if [ -n "$DEEPSEEK_API_KEY" ]; then
            echo "queries=true" >> "$GITHUB_OUTPUT"
          else
            echo "queries=false" >> "$GITHUB_OUTPUT"
            echo "::warning::DEEPSEEK_API_KEY is not configured, so the paraphrase query set cannot be written and that measurement is skipped."
          fi

      - name: Score retrieval with vectors registered
        id: retrieval
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          ZHIPU_EMBEDDING_MODEL: embedding-3
        run: |
          set -o pipefail
          npx vitest run --config vitest.config.ts packages/intelligence/src/__tests__/docstring-search.test.ts 2>&1 | tee /tmp/docstring.log
          # **The three columns, printed where a reader looks**: lexical on its own, and the fusion sweep. A single
          # fused number was what hid the fact that the fused answer was 36 points *worse* than the lexical one.
          grep -o 'DOCSTRING-SEARCH .*' /tmp/docstring.log | tail -1 | tee -a "$GITHUB_STEP_SUMMARY"

      # **The measurement that can say whether the semantic half earns its place.** The docstring figure cannot: there
      # the query is the indexed text, and every column comes out at the same 1.000. Here the questions are written by
      # DeepSeek and every doc comment is stripped from the index, so neither half can copy the words it is asked about.
      #
      # **The questions themselves are a committed dataset** (`benchmarks/paraphrase-queries.json`), read on every run so
      # that two runs differ in the retriever and not in the questions. `DEEPSEEK_API_KEY` is needed only to *write* that
      # set - the first run, or an explicit `PARAPHRASE_REGENERATE=1`.
      - name: Score paraphrase retrieval, with the documentation removed from the index
        id: paraphrase
        if: steps.credential.outputs.present == 'true'
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          ZHIPU_EMBEDDING_MODEL: embedding-3
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -o pipefail
          npx vitest run --config vitest.config.ts packages/intelligence/src/__tests__/paraphrase-search.test.ts 2>&1 | tee /tmp/paraphrase.log
          grep -o 'PARAPHRASE-SEARCH .*' /tmp/paraphrase.log | tail -1 | tee -a "$GITHUB_STEP_SUMMARY"

      # **The question set, uploaded whether the gate passed or not.** It is the input to every later run, and a set that
      # only exists inside a failed job cannot be committed.
      - name: Upload the frozen question set
        if: always() && steps.credential.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: paraphrase-queries
          path: benchmarks/paraphrase-queries.json
          if-no-files-found: warn
          retention-days: 90

      - name: Upload the paraphrase figure
        if: always() && steps.credential.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: paraphrase-search
          path: benchmarks/paraphrase-search.json
          if-no-files-found: warn
          retention-days: 90

      # **The artifact is the evidence, and the gate reads it.** A job that kept the number in its log would leave the
      # matrix's cell as MISSING, which is the honest state and not the useful one.
      - name: Upload the artifact the matrix reads
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docstring-search
          path: benchmarks/docstring-search.json
          if-no-files-found: warn
          retention-days: 90

      # **And a failure when the credential was present and either side of the cosine was still in the hash space**,
      # because **an artifact that says `deterministic` after this job went to the trouble of providing a key is the
      # exact defect the job exists to remove** - and now the two sides are checked separately, since the defect that
      # produced 0.638 was the *index* being in one space while the query was in another.
      - name: Fail when the credential was present and either side is still the hash fallback
        if: steps.credential.outputs.present == 'true'
        run: |
          set -e
          # **Both measurements, because both make the same claim about the space.** A paraphrase figure measured on a
          # hash index is the lexical figure with a semantic name, which is the defect this job exists to prevent.
          for artifact in benchmarks/docstring-search.json benchmarks/paraphrase-search.json; do
            if [ ! -f "$artifact" ]; then
              echo "$artifact was not written, so there is no space to check"
              continue
            fi
            index=$(node -e "const a=require('./$artifact');console.log(a.space.index)")
            query=$(node -e "const a=require('./$artifact');console.log(a.space.query)")
            echo "$artifact -- index space: $index · query space: $query"
            if [ "$index" = "deterministic" ] || [ "$query" = "deterministic" ] || [ "$query" = "none" ]; then
              echo "::error::ZHIPU_API_KEY was present and the semantic half did not run; $artifact records: $(node -e "const a=require('./$artifact');console.log(a.space.reason)")"
              exit 1
            fi
            if [ "$index" != "$query" ]; then
              echo "::error::$artifact holds $index vectors and its queries were embedded as $query — a cosine between two spaces"
              exit 1
            fi
          done
          # **And which questions were measured.** A figure whose set was rewritten by the run that measured it cannot be
          # compared with the previous run, so the source is printed next to the numbers in the job summary.
          if [ -f benchmarks/paraphrase-search.json ]; then
            echo "### Paraphrase questions: $(node -e "const a=require('./benchmarks/paraphrase-search.json');console.log(a.querySet.source + ' · ' + a.querySet.size + ' questions')")" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
