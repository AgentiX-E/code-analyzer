name: Security Audit

on:
  push:
    branches: [master]
    paths:
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/security-audit.yml'
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 8 * * 1' # Every Monday at 08:00 UTC

# **`security-events: write` is granted nowhere in this file.** CodeQL analysis used to live here as a second `init`
# call beside the one in `codeql.yml`, and **it was the copy that won**: both uploaded under the same category
# (`/language:javascript-typescript`), so each run replaced the other's results, and the one without
# `.github/codeql/codeql-config.yml` was the one that produced the alerts. Every shape the triage file excludes - fixture
# defects, test-built source text, harnesses that read a corpus - came back on the next push, which is exactly what a
# triage file is supposed to answer once. The analysis now runs in one place. What is left here measures advisories,
# secrets, licences and ReDoS; `redos-assay` reads the alert list and carries `security-events: read` on the job.
permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Run security test suite
        run: pnpm vitest run packages/core/src/__tests__/security-hardening.test.ts

      - name: Run code-analyzer secret scanner
        id: secret-scan
        run: |
          if pnpm exec code-analyzer scan --secret 2>/dev/null; then
            echo "Secret scanner check passed."
          else
            echo "::warning::Secret scanner CLI not available in CI — skipping deep scan. Verify locally with 'pnpm exec code-analyzer scan --secret'."
          fi

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        id: audit
        run: |
          # **One advisory is exempt, and it is declared in `package.json` under `pnpm.auditConfig.ignoreCves`
          # rather than as a flag here.**
          #
          # **`GHSA-vfj7-8cjw-p6xm` (`braces`) has `patched_versions: <0.0.0`** - **the registry's way of saying no
          # fixed release exists** - so **an audit that fails on it can never pass**, and **a gate that can never pass
          # is not a gate.**
          #
          # **And it is named by id rather than by severity**, because **lowering the level would also hide the next
          # high-severity finding in any package**, whereas **naming one advisory hides exactly one.** **`pnpm audit`
          # has no `--ignore` flag** (that is npm's), which is why the exemption is in the manifest.
          # **The threshold and the exemption both live in `scripts/audit-gate.mjs`.**
          #
          # **`pnpm audit --audit-level=high` cannot express an exemption**, because **it has no `--ignore` flag** (that
          # is npm's) - **so an advisory with `patched_versions: <0.0.0` makes the job permanently red**, and **a gate
          # that can never pass teaches everyone to ignore the job.**
          #
          # **The script names the one advisory and refuses everything else at high or critical**, so **the next
          # high-severity finding in any package still fails the build** - **which is the property a severity threshold
          # would have thrown away.**
          pnpm audit --json > audit.json || true
          node scripts/audit-gate.mjs audit.json

  supply-chain:
    name: Supply Chain Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Verify lockfile integrity
        run: |
          if ! pnpm install --frozen-lockfile --lockfile-only 2>/dev/null; then
            echo "Lockfile is out of sync with package.json"
          fi

      # **The scanner is a container, not a download.** `anchore/sbom-action` fetches syft from GitHub releases and
      # resolves the version tag through the API first — and that API returned 503/504 on **six consecutive runs** on
      # 2026-11-08 ("checking github for release tag", then "unable to find tag=''"), so the job failed in a step whose
      # whole purpose is to read this repository. A retry is not a fix when the dependency is what fails.
      #
      # The image is version-pinned rather than digest-pinned, and the trade is stated rather than hidden: a digest has
      # to be resolved against a registry this environment cannot reach. **Pinning `@sha256:…` is the follow-up**, and
      # it is a change to one line once the digest can be read. The action was SHA-pinned because it runs with the
      # job's token inside the workflow; a scanner container receives a mounted directory and no credentials.
      - name: Generate SBOM
        run: |
          docker run --rm -v "$PWD:/src" -w /src anchore/syft:v1.42.3 \
            dir:. -o spdx-json=sbom.spdx.json
          test -s sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sbom
          path: sbom.spdx.json

  # **The ReDoS findings are sorted by measurement, in the workflow that reads them.**
  #
  # CodeQL fires `js/polynomial-redos` seventy-six times in this repository, and a rule that fires seventy-six times is
  # a rule whose findings have to be sorted before they can be believed. That sort was done by hand for the first
  # thirty-five - an adversarial string lifted from each message, replayed in a child process with a kill timer - and the
  # answer was written into an audit page, where **it cannot be re-run**. A measurement that lives only in a paragraph is
  # a measurement the next reader has to take on trust.
  #
  # So the sort is a program, and this job is where it runs: the alerts come from the API, the adversarial string comes
  # from CodeQL's own sentence rather than from the author's imagination, and **the job fails when any pattern the rule
  # names is still quadratic on the input the rule names**. No model is called, so this costs nothing to run on every
  # push and pull request.
  redos-assay:
    name: ReDoS Assay
    runs-on: ubuntu-latest
    # **`security-events: read`, because this job reads the alert list.** It was the only job in this file that needed
    # the scope the old workflow-level `security-events: write` granted, and narrowing that grant to the job that
    # uploads SARIF turned this one red with `HTTP 403 on page 1` — which is what the read scope looks like when it is
    # missing, and why the grant belongs on the job rather than on the file.
    permissions:
      contents: read
      security-events: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc

      # **No `pnpm install`, because the assay has no dependencies**: it reads the alerts API with `fetch` and replays
      # each pattern with `node -e`. A step that installed 1 400 packages to run a stopwatch would be a step whose
      # failure says nothing about the patterns.
      - name: Measure every open ReDoS finding
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/redos-assay.mjs --json redos-assay.json --fail-if-quadratic

      - name: Upload the measurement
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: redos-assay
          path: redos-assay.json
          if-no-files-found: warn
          retention-days: 90
