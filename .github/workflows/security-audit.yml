name: Security Audit

on:
  push:
    branches: [master]
    paths:
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/security-audit.yml'
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 8 * * 1'  # Every Monday at 08:00 UTC

permissions:
  contents: read
  security-events: write

jobs:
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Run security test suite
        run: pnpm vitest run packages/core/src/__tests__/security-hardening.test.ts

      - name: Run code-analyzer secret scanner
        id: secret-scan
        run: |
          if pnpm exec code-analyzer scan --secret 2>/dev/null; then
            echo "Secret scanner check passed."
          else
            echo "::warning::Secret scanner CLI not available in CI — skipping deep scan. Verify locally with 'pnpm exec code-analyzer scan --secret'."
          fi

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        id: audit
        run: |
          if pnpm audit --audit-level=high; then
            echo "::notice::Dependency audit passed — no high-severity vulnerabilities found."
          else
            echo "::warning::Dependency audit found HIGH-severity vulnerabilities. Review and remediate as soon as possible."
            exit 1
          fi

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'

  supply-chain:
    name: Supply Chain Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Verify lockfile integrity
        run: |
          if ! pnpm install --frozen-lockfile --lockfile-only 2>/dev/null; then
            echo "Lockfile is out of sync with package.json"
          fi

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ./
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json
