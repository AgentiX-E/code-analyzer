# The benchmark scorers, run where anyone can reproduce them.
#
# **Why this workflow exists.** Every figure this project publishes was produced on one laptop, under a protocol
# written into a test file but never executed anywhere else. **A number nobody can reproduce is a number nobody can
# check**, and the competitive analysis's own lesson is harsher than that: three vendors printed the *same*
# benchmark's figure three different ways within five months, each on the day and arm that favoured it.
#
# **So the scoring runs here**, on a machine we do not control, from a commit anybody can check out:
#
#   review-protocol.json   Martian + CR-Bench shape: precision, recall, F1, signal-to-noise
#   docstring-search.json  173 queries, lexical
#   lexical-search-recall.json  40 queries, lexical
#   indexing-speed.json    recorded as unmeasurable, with the reason
#
# **And the artifacts are uploaded**, so the figures are downloadable rather than transcribed. **The baseline is the
# committed file in `benchmarks/`**: a run that produces a different figure without producing a better one is a
# regression, and this job fails on it.

name: Evaluation

on:
  pull_request:
    paths:
      - 'packages/**'
      - 'benchmarks/**'
      - '.github/workflows/evaluation.yml'
  push:
    branches: [master]
    paths:
      - 'packages/**'
      - 'benchmarks/**'
      - '.github/workflows/evaluation.yml'
  schedule:
    # Weekly, so a figure that drifts with a dependency update is found without a commit.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  protocol-evaluation:
    name: Evaluation - protocol scorers
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Keep the committed figures
        # Copied before the run, so the comparison is against what is in the repository rather than against itself.
        run: cp -r benchmarks benchmarks-baseline

      - name: Run the protocol scorers
        # **A runner run is the one that may publish.** Recording is opt-in so an ordinary local run measures without
        # replacing the committed figure; here the artifacts are also compared against the copies taken above.
        env:
          BENCHMARK_WRITE: '1'
        run: |
          npx vitest run --config vitest.config.ts \
            packages/intelligence/src/__tests__/review-benchmark-protocol.test.ts \
            packages/intelligence/src/__tests__/docstring-search.test.ts \
            packages/intelligence/src/__tests__/lexical-search-recall.test.ts

      - name: Report the figures
        run: |
          node -e '
            const fs = require("node:fs");
            const read = (p) => { try { return JSON.parse(fs.readFileSync(p, "utf8")); } catch { return null; } };
            const review = read("benchmarks/review-protocol.json");
            console.log("## Protocol evaluation\n");
            if (review) {
              console.log("| metric | value |");
              console.log("|---|---|");
              for (const k of ["precision", "recall", "f1", "signalToNoise"]) {
                console.log(`| ${k} | ${review[k]} |`);
              }
              console.log("");
              console.log(`corpus: ${JSON.stringify(review.corpus)}`);
            } else {
              console.log("review-protocol.json was not produced");
              process.exitCode = 1;
            }
            // **`docstring-search.json` reports three columns now**, because one fused figure hid a fused answer that was
            // 36 points worse than the lexical one it fused with. Printing `d.recall` against the new shape would print
            // `undefined` and, worse, compare nothing - a figure that is printed and not checked.
            const docstring = read("benchmarks/docstring-search.json");
            if (docstring) {
              console.log(`\ndocstring-search: space=${docstring.space?.index}/${docstring.space?.query} queries=${docstring.corpus?.queries}`);
              console.log(`  lexical: recall@5=${docstring.lexical?.recallAt5} recall@20=${docstring.lexical?.recallAt20} mrr=${docstring.lexical?.mrr}`);
              for (const row of docstring.semanticSweep ?? []) {
                console.log(`  fused w=${row.vectorWeight}: recall@20=${row.recallAt20} mrr=${row.mrr}`);
              }
            } else {
              console.log("docstring-search.json was not produced");
              process.exitCode = 1;
            }
            const lexical = read("benchmarks/lexical-search-recall.json");
            if (lexical) console.log(`\nlexical-search-recall: recall=${lexical.recall} mode=${lexical.mode} queries=${lexical.queries ?? lexical.corpus?.queries}`);
          '

      - name: Fail on a regression
        # **The comparison is here rather than in the report above**, because a figure that is printed and not checked
        # is the same defect this repository has spent a stretch removing: an output nobody reads decides nothing.
        run: |
          node -e '
            const fs = require("node:fs");
            const read = (p) => { try { return JSON.parse(fs.readFileSync(p, "utf8")); } catch { return null; } };
            // **Each file names its own figures**, because they no longer share a shape: `docstring-search.json` carries
            // a lexical column and a sweep, and a shared key list would silently skip both.
            const figures = {
              "review-protocol.json": [["precision"], ["recall"], ["f1"], ["signalToNoise"]],
              "lexical-search-recall.json": [["recall"]],
              "docstring-search.json": [
                ["lexical", "recallAt5"],
                ["lexical", "recallAt20"],
                ["lexical", "mrr"],
              ],
            };
            const at = (object, path) => path.reduce((value, key) => value?.[key], object);
            let regressed = [];
            for (const [name, paths] of Object.entries(figures)) {
              const before = read(`benchmarks-baseline/${name}`);
              const after = read(`benchmarks/${name}`);
              if (!before || !after) continue;
              for (const path of paths) {
                const from = at(before, path);
                const to = at(after, path);
                if (typeof from !== "number" || typeof to !== "number") continue;
                if (to < from) regressed.push(`${name}:${path.join(".")} ${from} -> ${to}`);
              }
            }
            if (regressed.length) {
              console.error("figures regressed:\n  " + regressed.join("\n  "));
              process.exit(1);
            }
            console.log("no figure regressed against the committed baseline");
          '

      - name: Upload the figures
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-figures
          path: benchmarks/*.json
          retention-days: 90
