name: Corpus Probe

# **Whether a corpus can be reached from a runner at all, asked before a measurement is designed around it.**
#
# **Why this job exists.** Two cells in the competitor matrix are `MISSING` because their corpora are published on a
# hub this project has never fetched from. **A measurement plan built on a dataset nobody has downloaded is a plan, not
# a number** - so the first question is whether the bytes arrive, what their shape is, and what they hash to. This job
# answers only that question, and it prints the answer instead of asserting it.
#
# **What the first run answered.** `AWS/crosscode-eval` is **gated** (HTTP 401 without an accepted licence), and so is
# `JetBrains-Research/lca-code-generation`. `JetBrains-Research/lca-bug-localization` and
# `tianyang/repobench_python_v1.1` are **public**. This second run reads the two public ones far enough to know the
# column names, the row count and the shape of one row, because a harness written against a guessed schema is a harness
# that fails on its first real run.

on:
  workflow_dispatch:
  # **Dispatch is only offered for a workflow the default branch knows about**, so the probe also runs on a push that
  # touches it - which is how a branch that is not `master` can ask the question before it is merged.
  push:
    paths:
      - '.github/workflows/corpus-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    name: Read the public corpora far enough to know their schema
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Install parquet support
        run: python3 -m pip install --quiet pyarrow pandas

      - name: Long Code Arena — bug localization, file list
        run: |
          set -uo pipefail
          curl -sS --max-time 120 \
            "https://huggingface.co/api/datasets/JetBrains-Research/lca-bug-localization/tree/main" \
            -o /tmp/tree.json
          python3 - <<'PY'
          import json
          entries = json.load(open('/tmp/tree.json'))
          for e in entries:
              print(e['type'], e.get('size'), e['path'])
          PY

      - name: Long Code Arena — bug localization, schema and one row
        run: |
          set -uo pipefail
          base="https://huggingface.co/datasets/JetBrains-Research/lca-bug-localization/resolve/main"
          curl -sSL --max-time 300 "$base/data/test-00000-of-00001.parquet" -o /tmp/lca.parquet
          ls -l /tmp/lca.parquet
          sha256sum /tmp/lca.parquet
          python3 - <<'PY'
          import json
          import pyarrow.parquet as pq

          table = pq.read_table('/tmp/lca.parquet')
          print('rows:', table.num_rows)
          print('columns:', table.column_names)
          row = {name: table.column(name)[0].as_py() for name in table.column_names}
          for name, value in row.items():
              text = value if isinstance(value, str) else json.dumps(value, default=str)
              print(f'--- {name} ({type(value).__name__}, {len(text)} chars)')
              print(text[:1500])
          PY

      - name: RepoBench — retrieval split, file list
        run: |
          set -uo pipefail
          curl -sS --max-time 120 \
            "https://huggingface.co/api/datasets/tianyang/repobench_python_v1.1/tree/main" \
            -o /tmp/rb-tree.json
          python3 - <<'PY'
          import json
          entries = json.load(open('/tmp/rb-tree.json'))
          for e in entries:
              print(e['type'], e.get('size'), e['path'])
          PY

      - name: RepoBench — retrieval split, schema and one row
        run: |
          set -uo pipefail
          base="https://huggingface.co/datasets/tianyang/repobench_python_v1.1/resolve/main"
          curl -sSL --max-time 300 "$base/repobench_v1.1_python_test_r.jsonl" -o /tmp/rb.jsonl || true
          ls -l /tmp/rb.jsonl 2>/dev/null || echo "no jsonl at that path"
          head -c 2000 /tmp/rb.jsonl 2>/dev/null || true
          echo

      - name: Which LCA splits exist
        run: |
          set -uo pipefail
          for split in train validation test; do
            code=$(curl -sSL -o /tmp/p.parquet -w '%{http_code}' --max-time 300 \
              "https://huggingface.co/datasets/JetBrains-Research/lca-bug-localization/resolve/main/data/${split}-00000-of-00001.parquet" || true)
            echo "$split http=$code bytes=$(wc -c < /tmp/p.parquet)"
          done
