name: Corpus Probe

# **Whether a corpus can be reached from a runner at all, asked before a measurement is designed around it.**
#
# **Why this job exists.** Two cells in the competitor matrix are `MISSING` because their corpora are published on a
# hub this project has never fetched from. **A measurement plan built on a dataset nobody has downloaded is a plan, not
# a number** - so the first question is whether the bytes arrive, what their shape is, and what they hash to. This job
# answers only that question, and it prints the answer instead of asserting it.
#
# **What the first two runs answered.** `AWS/crosscode-eval` is **gated** (HTTP 401 without an accepted licence), and so
# is `JetBrains-Research/lca-code-generation`; `JetBrains-Research/lca-bug-localization` and
# `tianyang/repobench_python_v1.1` are **public**. The bug-localization dataset keeps one directory per configuration
# (`py`, `java`, `kt`) and one for the archived repositories, not a `data/` prefix. This run reads those four trees and
# one row of `py`, because a harness written against a guessed path fails on its first real run.
#
# **The listing and the row dump are separate scripts on disk**, because a heredoc inside a loop indents its own
# terminator and the shell then never finds it - a defect this job had on its second run.

on:
  workflow_dispatch:
  # **Dispatch is only offered for a workflow the default branch knows about**, so the probe also runs on a push that
  # touches it - which is how a branch that is not `master` can ask the question before it is merged.
  push:
    paths:
      - '.github/workflows/corpus-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    name: Read the public corpora far enough to know their schema
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Install parquet support
        run: python3 -m pip install --quiet pyarrow pandas

      - name: Write the two readers
        run: |
          set -euo pipefail
          mkdir -p /tmp/probe
          cat > /tmp/probe/list.py <<'PY'
          import json, sys
          entries = json.load(open(sys.argv[1]))
          for entry in entries:
              print(' ', entry['type'], entry.get('size'), entry['path'])
          PY
          cat > /tmp/probe/row.py <<'PY'
          import json, sys
          import pyarrow.parquet as pq
          table = pq.read_table(sys.argv[1])
          print('rows:', table.num_rows)
          print('columns:', table.column_names)
          row = {name: table.column(name)[0].as_py() for name in table.column_names}
          for name, value in row.items():
              text = value if isinstance(value, str) else json.dumps(value, default=str)
              print(f'--- {name} ({type(value).__name__}, {len(text)} chars)')
              print(text[:1200])
          PY
          echo written

      - name: The four directories of the bug-localization dataset
        run: |
          set -uo pipefail
          for dir in py java kt repos; do
            echo "### $dir"
            curl -sS --max-time 120 \
              "https://huggingface.co/api/datasets/JetBrains-Research/lca-bug-localization/tree/main/$dir" \
              -o /tmp/tree-$dir.json
            python3 /tmp/probe/list.py /tmp/tree-$dir.json
          done

      - name: The archived-repository index
        run: |
          set -uo pipefail
          curl -sSL --max-time 120 \
            "https://huggingface.co/datasets/JetBrains-Research/lca-bug-localization/resolve/main/repos.json" \
            -o /tmp/repos.json
          ls -l /tmp/repos.json
          sha256sum /tmp/repos.json
          head -c 2500 /tmp/repos.json
          echo

      - name: One row of py, schema and fields
        run: |
          set -uo pipefail
          base="https://huggingface.co/datasets/JetBrains-Research/lca-bug-localization/resolve/main"
          for candidate in "py/test-00000-of-00001.parquet" "py/test.parquet" "py/dev-00000-of-00001.parquet"; do
            code=$(curl -sSL -o /tmp/lca.parquet -w '%{http_code}' --max-time 300 "$base/$candidate" || true)
            echo "$candidate http=$code bytes=$(wc -c < /tmp/lca.parquet)"
            if [ "$code" = "200" ] && [ "$(wc -c < /tmp/lca.parquet)" -gt 1000 ]; then
              sha256sum /tmp/lca.parquet
              python3 /tmp/probe/row.py /tmp/lca.parquet
              break
            fi
          done

      - name: RepoBench — retrieval split, schema
        run: |
          set -uo pipefail
          curl -sS --max-time 120 \
            "https://huggingface.co/api/datasets/tianyang/repobench_python_v1.1/tree/main" \
            -o /tmp/rb-tree.json
          python3 /tmp/probe/list.py /tmp/rb-tree.json
