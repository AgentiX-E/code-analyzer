name: Martian Harness

# **The field's own judge, run by us, on the field's own 50 PRs.**
#
# **Why this exists, and why the earlier claim was wrong.** A previous version of the audits page said Martian's judge
# "can only run inside their pipeline". **It cannot - the benchmark is MIT and open-sources the PRs, the golden
# comments, the judge prompts and the evaluation pipeline**, and its README's "Adding a new tool" section ends:
# *"If a tool doesn't meet these yet, the harness is public and you're welcome to run it and publish your own
# results."*
#
# **So this job runs that harness on our output.** It clones the benchmark, scores the 50 PRs' diffs with our review
# engine, writes the `benchmark_data.json` the pipeline expects, and runs their judge — **which is what makes our F1
# comparable with Greptile's rather than merely analogous to it.**
#
# **And the honest boundary is stated rather than hidden.** We do not run `step0_fork_prs`, because that installs a
# bot account on GitHub and this job has no such account to install — **so our reviews come from our engine reading
# each PR's diff, which is the same input the other tools saw** (their reviews are also comments on those diffs).
# **The artifact records which judge model produced the figure and which scoring profile was active**, because
# **the benchmark's own documentation says the judge moves the numbers.**

on:
  workflow_dispatch:
    inputs:
      # **The competitor arm is a dispatch and not a schedule.** The scheduled run already buys our own review of fifty
      # diffs; adding a second reviewer to it would double a weekly bill on a job nobody asked to grow. A dispatch is a
      # person deciding to spend, which is the rule this file's trigger section already states.
      competitor:
        description: 'Buy the competitor arm (open-code-review with our model) or run ours alone'
        required: false
        type: choice
        default: 'off'
        options: ['off', 'record']
      # **The corpus slice**, so a calibration and the run it calibrates never share a row.
      max_pull_requests:
        description: 'How many of the fifty pull requests to review (a calibration is cheaper than a confirmation)'
        required: false
        type: string
        default: '12'
  schedule:
    # **Off-peak on purpose.** The vendor halves every price outside 01:00-04:00 and 06:00-10:00 UTC on weekdays,
    # so a weekly run at this hour costs half what the same run costs at 08:00 - and this workflow's own artifact
    # records the spend it took to produce the figure.
    - cron: '40 4 * * 2'
  # **And not a push, on any path.** An earlier version kept one path - the harness itself - on the argument that an
  # edited harness should be exercised. **The run of 2026-11-10 priced that argument at 60.59 CNY for one push**, of
  # which 5.89 USD was a competitor over goldens that had not changed. A paid run has two honest triggers: a dispatch,
  # which is a person deciding to spend, and the schedule above, which is one row a reviewer can see. The harness's
  # arithmetic is now checked by a gate that calls no model, so an edited harness is still exercised on every commit -
  # for free.

concurrency:
  group: martian-harness
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  martian-harness:
    name: Score our reviews with the field's judge
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      # **Their repository, their prompts, their golden comments** - pinned by commit so **a figure has a date**.
      - name: Clone the benchmark
        run: |
          set -e
          git clone --depth 1 https://github.com/withmartian/code-review-benchmark /tmp/martian
          echo "cloned at $(git -C /tmp/martian rev-parse HEAD)"
          ls /tmp/martian/offline/golden_comments/
          du -sh /tmp/martian

      - name: Install the harness
        working-directory: /tmp/martian/offline
        run: |
          # **Pinned to the version the stored run used** (`Successfully installed uv-0.13.7` in run 42820158574),
          # because `uv sync` resolves the harness's own lock against whatever uv is installed.
          pip install uv==0.13.7
          uv sync

      # **Our reviews, in their schema.** The script reads their golden comments for the PR list, scores each PR's
      # diff with our engine, and writes `results/benchmark_data.json`.
      - name: Score the 50 PRs with our engine
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MARTIAN_DIR: /tmp/martian
        run: node .github/scripts/run-martian-harness.mjs

      # **The competitor's arm, on the same fifty diffs, with the same model - the row no leaderboard can show.**
      #
      # Every published figure on this board was produced with its vendor's own model, so a comparison against one is a
      # comparison across two models as well as two reviewers. `open-code-review` accepts our endpoint, so this arm
      # removes the model from the difference - and **their own judge scores it beside ours in the steps below**, which
      # is what makes the pair a measurement rather than two recollections.
      - name: Prove the competitor arm's arithmetic without a model
        run: node .github/scripts/run-martian-competitor.mjs --self-check

      - name: Install the competitor, pinned
        if: inputs.competitor == 'record'
        run: |
          set -e
          # **Pinned to the version the AACR head-to-head was measured against**, so the two boards compare the same
          # program and a bump is a visible change to both rather than a silent one.
          node scripts/install-pinned.mjs @alibaba-group/open-code-review@1.13.8
          command -v ocr
          ocr --version

      - name: Review the fifty pull requests with the competitor and our model
        if: inputs.competitor == 'record'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MARTIAN_DIR: /tmp/martian
          MARTIAN_MODEL: deepseek-chat
          # **The same endpoint the judge uses**, which is the whole point: a difference between the two rows is then a
          # difference between two review systems given one model.
          OCR_LLM_URL: https://api.deepseek.com/anthropic
          OCR_LLM_TOKEN: ${{ secrets.DEEPSEEK_API_KEY }}
          OCR_LLM_MODEL: deepseek-chat
          OCR_VERSION: '1.13.8'
          MAX_PRS: ${{ inputs.max_pull_requests || '12' }}
        run: node .github/scripts/run-martian-competitor.mjs

      # **Their judge, with our model behind it - which is their design working as documented.**
      #
      # **The first run of this job failed here and reported success**, because the steps carried `|| true` - and
      # `LLMJudge(...)` raised on a missing `MARTIAN_API_KEY`. **The `|| true` is removed**, so **a failure is a red
      # job rather than a green lie.**
      #
      # **And the judge does not have to be theirs.** Their `LLMJudge` builds **`AsyncOpenAI(api_key, base_url)`**,
      # reads **`MARTIAN_BASE_URL`** with a default of their own gateway, and reads **`MARTIAN_MODEL`** **with no
      # allowlist at all** - so **any OpenAI-compatible endpoint can judge**, and **`MARTIAN_BASE_URL` and
      # `MARTIAN_MODEL` are the documented knobs for exactly that.** **This job points them at DeepSeek**, which
      # **removes the credential blocker and, more importantly, removes the judge as a confound**: **the same judge
      # scoring our output and (in a later run) theirs is the only way to tell a difference in the reviewer from a
      # difference in the judge.**
      - name: Their dedup step
        working-directory: /tmp/martian/offline
        env:
          # **Their client is `AsyncOpenAI`, and these three variables are its documented knobs.**
          MARTIAN_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MARTIAN_BASE_URL: https://api.deepseek.com/v1
          MARTIAN_MODEL: deepseek-chat
        run: |
          set -e
          # **Every arm that produced candidates is deduped and judged, and one that did not is skipped in a sentence.**
          # A competitor arm that scored nothing is a fact its own artifact records; failing the job on it would make
          # the honest outcome of an optional purchase look like a broken pipeline.
          for tool in agentix-e open-code-review-deepseek; do
            has=$(node -e "const c=require('/tmp/martian/offline/results/deepseek-chat/candidates.json');const n=Object.values(c).filter((b)=>Array.isArray(b?.['${tool}'])&&b['${tool}'].length>0).length;process.stdout.write(String(n))" 2>/dev/null || echo 0)
            echo "${tool}: ${has} pull requests with candidates"
            if [ "${has}" = "0" ]; then echo "skipping ${tool}: no candidates"; continue; fi
            uv run python -m code_review_benchmark.step2_5_dedup_candidates --tool "${tool}"
          done
          ls -la results/

      - name: Their judge step
        working-directory: /tmp/martian/offline
        env:
          # **The same three knobs, so the judge and the reviewer share one credential and nothing else is needed.**
          MARTIAN_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MARTIAN_BASE_URL: https://api.deepseek.com/v1
          MARTIAN_MODEL: deepseek-chat
        run: |
          set -e
          for tool in agentix-e open-code-review-deepseek; do
            has=$(node -e "const c=require('/tmp/martian/offline/results/deepseek-chat/candidates.json');const n=Object.values(c).filter((b)=>Array.isArray(b?.['${tool}'])&&b['${tool}'].length>0).length;process.stdout.write(String(n))" 2>/dev/null || echo 0)
            if [ "${has}" = "0" ]; then echo "skipping ${tool}: no candidates to judge"; continue; fi
            uv run python -m code_review_benchmark.step3_judge_comments --tool "${tool}"
          done
          find results -name 'evaluations*.json' -maxdepth 3 | head -5
          ls -la results/

      # **Every tool in the field, judged by one judge on one corpus, beside ours.**
      #
      # **This is the part that makes the comparison first-hand rather than recomputed.** Their repository ships
      # `offline/results/benchmark_data.json`, which holds **every tool's raw review comments for all 50 PRs** - so
      # **every tool's comments can be re-judged by one model**, and **ours is judged by the same one.** **The earlier
      # figure for the field was recomputed from their committed evaluations**, which **can be checked and cannot be
      # re-taken** - and **a number two parties do not produce the same way is not a comparison.**
      - name: Score the whole field with one judge
        env:
          MARTIAN_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MARTIAN_BASE_URL: https://api.deepseek.com/v1
          MARTIAN_MODEL: deepseek-chat
          MARTIAN_DIR: /tmp/martian
        run: node .github/scripts/field-comparison.mjs

      - name: Collect the figure
        if: always()
        run: |
          set -e
          mkdir -p benchmarks
          for f in $(find /tmp/martian/offline/results -name 'evaluations*.json' -maxdepth 3 2>/dev/null | head -5); do
            cp "$f" "benchmarks/$(basename $(dirname "$f"))_$(basename "$f")" || true
          done
          cp /tmp/martian/offline/results/benchmark_data.json benchmarks/martian-benchmark-data.json 2>/dev/null || true
          # **And the candidates file**, because `benchmark_data.json` carries `review_comments` and the issue
          # statements live in `results/{model}/candidates.json`. **The comparison job read the wrong one and reported
          # 50 rows of zero**; shipping both means the next job cannot make that mistake silently.
          for f in /tmp/martian/offline/results/*/candidates.json; do
            [ -f "$f" ] || continue
            model=$(basename "$(dirname "$f")")
            cp "$f" "benchmarks/candidates-${model}.json" || true
            echo "packaged candidates for ${model}"
          done
          ls -la benchmarks/ | tail -8
          git -C /tmp/martian rev-parse HEAD > benchmarks/martian-harness-commit.txt

      - name: Upload the figure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: martian-harness
          path: benchmarks/
          if-no-files-found: warn
          retention-days: 90
