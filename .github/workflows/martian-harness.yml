name: Martian Harness

# **The field's own judge, run by us, on the field's own 50 PRs.**
#
# **Why this exists, and why the earlier claim was wrong.** A previous version of the audits page said Martian's judge
# "can only run inside their pipeline". **It cannot - the benchmark is MIT and open-sources the PRs, the golden
# comments, the judge prompts and the evaluation pipeline**, and its README's "Adding a new tool" section ends:
# *"If a tool doesn't meet these yet, the harness is public and you're welcome to run it and publish your own
# results."*
#
# **So this job runs that harness on our output.** It clones the benchmark, scores the 50 PRs' diffs with our review
# engine, writes the `benchmark_data.json` the pipeline expects, and runs their judge — **which is what makes our F1
# comparable with Greptile's rather than merely analogous to it.**
#
# **And the honest boundary is stated rather than hidden.** We do not run `step0_fork_prs`, because that installs a
# bot account on GitHub and this job has no such account to install — **so our reviews come from our engine reading
# each PR's diff, which is the same input the other tools saw** (their reviews are also comments on those diffs).
# **The artifact records which judge model produced the figure and which scoring profile was active**, because
# **the benchmark's own documentation says the judge moves the numbers.**

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/scripts/run-martian-harness.mjs'
      - '.github/scripts/field-comparison.mjs'
      - '.github/workflows/martian-harness.yml'
      - 'packages/intelligence/src/review/llm/**'

concurrency:
  group: martian-harness
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  martian-harness:
    name: Score our reviews with the field's judge
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      # **Their repository, their prompts, their golden comments** - pinned by commit so **a figure has a date**.
      - name: Clone the benchmark
        run: |
          set -e
          git clone --depth 1 https://github.com/withmartian/code-review-benchmark /tmp/martian
          echo "cloned at $(git -C /tmp/martian rev-parse HEAD)"
          ls /tmp/martian/offline/golden_comments/
          du -sh /tmp/martian

      - name: Install the harness
        working-directory: /tmp/martian/offline
        run: |
          pip install uv
          uv sync

      # **Our reviews, in their schema.** The script reads their golden comments for the PR list, scores each PR's
      # diff with our engine, and writes `results/benchmark_data.json`.
      - name: Score the 50 PRs with our engine
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MARTIAN_DIR: /tmp/martian
        run: node .github/scripts/run-martian-harness.mjs

      # **Their judge, with our model behind it - which is their design working as documented.**
      #
      # **The first run of this job failed here and reported success**, because the steps carried `|| true` - and
      # `LLMJudge(...)` raised on a missing `MARTIAN_API_KEY`. **The `|| true` is removed**, so **a failure is a red
      # job rather than a green lie.**
      #
      # **And the judge does not have to be theirs.** Their `LLMJudge` builds **`AsyncOpenAI(api_key, base_url)`**,
      # reads **`MARTIAN_BASE_URL`** with a default of their own gateway, and reads **`MARTIAN_MODEL`** **with no
      # allowlist at all** - so **any OpenAI-compatible endpoint can judge**, and **`MARTIAN_BASE_URL` and
      # `MARTIAN_MODEL` are the documented knobs for exactly that.** **This job points them at DeepSeek**, which
      # **removes the credential blocker and, more importantly, removes the judge as a confound**: **the same judge
      # scoring our output and (in a later run) theirs is the only way to tell a difference in the reviewer from a
      # difference in the judge.**
      - name: Their dedup step
        working-directory: /tmp/martian/offline
        env:
          # **Their client is `AsyncOpenAI`, and these three variables are its documented knobs.**
          MARTIAN_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MARTIAN_BASE_URL: https://api.deepseek.com/v1
          MARTIAN_MODEL: deepseek-chat
        run: |
          uv run python -m code_review_benchmark.step2_5_dedup_candidates --tool agentix-e
          ls -la results/

      - name: Their judge step
        working-directory: /tmp/martian/offline
        env:
          # **The same three knobs, so the judge and the reviewer share one credential and nothing else is needed.**
          MARTIAN_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MARTIAN_BASE_URL: https://api.deepseek.com/v1
          MARTIAN_MODEL: deepseek-chat
        run: |
          uv run python -m code_review_benchmark.step3_judge_comments --tool agentix-e
          find results -name 'evaluations*.json' -maxdepth 3 | head -5
          ls -la results/

      # **Every tool in the field, judged by one judge on one corpus, beside ours.**
      #
      # **This is the part that makes the comparison first-hand rather than recomputed.** Their repository ships
      # `offline/results/benchmark_data.json`, which holds **every tool's raw review comments for all 50 PRs** - so
      # **every tool's comments can be re-judged by one model**, and **ours is judged by the same one.** **The earlier
      # figure for the field was recomputed from their committed evaluations**, which **can be checked and cannot be
      # re-taken** - and **a number two parties do not produce the same way is not a comparison.**
      - name: Score the whole field with one judge
        env:
          MARTIAN_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MARTIAN_BASE_URL: https://api.deepseek.com/v1
          MARTIAN_MODEL: deepseek-chat
          MARTIAN_DIR: /tmp/martian
        run: node .github/scripts/field-comparison.mjs

      - name: Collect the figure
        if: always()
        run: |
          set -e
          mkdir -p benchmarks
          for f in $(find /tmp/martian/offline/results -name 'evaluations*.json' -maxdepth 3 2>/dev/null | head -5); do
            cp "$f" "benchmarks/$(basename $(dirname "$f"))_$(basename "$f")" || true
          done
          cp /tmp/martian/offline/results/benchmark_data.json benchmarks/martian-benchmark-data.json 2>/dev/null || true
          ls -la benchmarks/ | tail -8
          git -C /tmp/martian rev-parse HEAD > benchmarks/martian-harness-commit.txt

      - name: Upload the figure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: martian-harness
          path: benchmarks/
          if-no-files-found: warn
          retention-days: 90
