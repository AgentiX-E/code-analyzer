# @code-analyzer — Performance Regression Detection
#
# Runs benchmark suites and compares against the baseline stored in the master branch.
# Fails the PR if any benchmark regresses beyond the threshold (15% slower).
#
# Triggered:
#   - On every PR targeting master
#   - On push to master (to update the baseline)
#   - Manually via workflow_dispatch

name: Performance Benchmarks

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    paths:
      - 'packages/**/src/**'
      - 'scripts/run-benchmarks.ts'
      - 'vitest.bench.config.ts'
      - '.github/workflows/benchmark.yml'
  workflow_dispatch:
    inputs:
      category:
        description: 'Benchmark category to run (empty = all)'
        required: false
        type: choice
        options:
          - ''
          - parse
          - graph
          - scope
          - embed
          - search
          - heuristic
      compare:
        description: 'Compare against baseline (true/false)'
        required: false
        type: boolean
        default: true

env:

jobs:
  benchmarks:
    name: Run Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # **Before a figure exists, whether one may be published.** `benchmarks/citations.json` declares a minimum
      # ground-truth count and the runner would happily benchmark four toy cases; this refuses a run whose dataset
      # is below the declaration, and refuses a citation that overstates its own dataset.
      - name: Is the dataset large enough to publish a figure from?
        run: node scripts/benchmark-dataset-gate.js

      - name: Build all packages
        run: pnpm build

      - name: Download baseline report
        id: baseline
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: benchmark-baseline.json
          key: benchmark-baseline-${{ github.ref == 'refs/heads/master' && github.sha || 'master-latest' }}
          restore-keys: |
            benchmark-baseline-master-

      - name: Run benchmarks
        id: run
        run: |
          CATEGORY_FLAG=""
          if [ -n "${{ github.event.inputs.category }}" ]; then
            CATEGORY_FLAG="--category ${{ github.event.inputs.category }}"
          fi

          COMPARE_FLAG=""
          if [ -f benchmark-baseline.json ] && [ "${{ github.event.inputs.compare }}" != "false" ]; then
            COMPARE_FLAG="--compare benchmark-baseline.json"
          fi

          npx tsx scripts/run-benchmarks.ts $CATEGORY_FLAG $COMPARE_FLAG --output benchmark-report.json

      - name: Check for regressions
        if: github.event_name == 'pull_request' && steps.run.outcome == 'success'
        run: |
          REGRESSIONS=$(python3 -c "
          import json
          with open('benchmark-report.json') as f:
              report = json.load(f)
          regressions = report['summary']['casesWithRegressions']
          print(regressions)
          ")
          if [ "$REGRESSIONS" -gt 0 ]; then
            echo "::warning::Detected $REGRESSIONS performance regression(s) — check the benchmark summary above."
          fi

      - name: Measure this repository's own index
        # **A benchmark that produces an artifact rather than a pass/fail.**
        #
        # It indexes `packages/` — 141 000 lines of this repository on this runner — and records seconds per million
        # lines beside the phases that spent them. **It is deliberately not the competitor-facing figure**:
        # `benchmarks/indexing-speed.json` is a third-party repository at a pinned tag, measured by
        # `real-corpus-benchmark.yml`, and two producers writing one path let the last writer decide what the table
        # cited.
        #
        # **And it left the unit suite because it is not a unit test.** It runs eighteen phases over 141 000 lines —
        # 110 seconds and 1.3 GB before the parse cache landed — which is a load the coverage worker should not be
        # asked to carry while it is instrumenting every file in the repository.
        run: |
          BENCHMARK_WRITE=1 npx vitest run --config vitest.bench.config.ts \
            packages/analyzer/src/__tests__/indexing-speed.bench.ts 2>&1 | tee /tmp/indexing-self.log
          # **Read the artifact, not the console line.** The first version ended with `grep '^INDEXING '` and exited 1
          # on a run where the benchmark passed and printed its figure — the console output is prefixed when stdout is
          # not a terminal, so the pattern matched nothing and a green measurement reported a red step. The artifact is
          # the thing the table cites, so reading it is also the stronger check: a figure that did not reach the file
          # did not happen.
          node -e "
            const a = require('./benchmarks/indexing-self-index.json');
            if (a.valid !== true) { console.error('no valid measurement:', a.reason); process.exit(1); }
            console.log('INDEXING', a.secondsPerMillionLines, 's/M lines over', a.corpus.lines, 'lines,', a.durationMs, 'ms,', a.pipeline.phases, 'phases');
          "

      - name: Upload the self-index artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: indexing-self-index
          path: benchmarks/indexing-self-index.json
          retention-days: 90

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: benchmark-report
          path: benchmark-report.json
          retention-days: 90

      - name: Cache baseline (master branch only)
        if: github.ref == 'refs/heads/master' && steps.run.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: benchmark-report.json
          key: benchmark-baseline-${{ github.sha }}

  # Summary comment on PR
  pr-comment:
    name: Post Benchmark Summary
    needs: benchmarks
    if: github.event_name == 'pull_request' && always()
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: benchmark-report

      - name: Generate summary comment
        id: summary
        run: |
          REPORT=$(python3 -c "
          import json
          with open('benchmark-report.json') as f:
              report = json.load(f)

          lines = ['## 🏎️ Benchmark Results', '']
          lines.append('| Suite | Category | Mean | P50 | P95 |')
          lines.append('|-------|----------|------|-----|-----|')

          for c in report['cases']:
              name = c['name']
              cat = c['category']
              mean = f\"{c['duration']['mean']:.2f}ms\"
              p50 = f\"{c['duration']['p50']:.2f}ms\"
              p95 = f\"{c['duration']['p95']:.2f}ms\"
              lines.append(f'| {name} | {cat} | {mean} | {p50} | {p95} |')

          lines.append('')
          regressions = report['summary']['casesWithRegressions']
          if regressions > 0:
              lines.append(f'> ⚠️ **{regressions} performance regression(s) detected**')
          else:
              lines.append('> ✅ No performance regressions detected')

          print('\n'.join(lines))
          ")

          # Write to file and output for workflow
          echo "$REPORT" > benchmark-summary.md
          {
            echo 'comment<<EOF'
            cat benchmark-summary.md
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Comment on PR
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('node:fs');
            const summary = fs.readFileSync('benchmark-summary.md', 'utf-8');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            // Update existing benchmark comment or create new one
            const benchComment = comments.find(c =>
              c.body && c.body.startsWith('## 🏎️ Benchmark Results')
            );

            if (benchComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: benchComment.id,
                body: summary,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: summary,
              });
            }
