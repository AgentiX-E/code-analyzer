# @code-analyzer — Performance Regression Detection
#
# Runs benchmark suites and compares against the baseline stored in the master branch.
# Fails the PR if any benchmark regresses beyond the threshold (15% slower).
#
# Triggered:
#   - On every PR targeting master
#   - On push to master (to update the baseline)
#   - Manually via workflow_dispatch

name: Performance Benchmarks

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    paths:
      - 'packages/**/src/**'
      - 'scripts/run-benchmarks.ts'
      - 'vitest.bench.config.ts'
      - '.github/workflows/benchmark.yml'
  workflow_dispatch:
    inputs:
      category:
        description: 'Benchmark category to run (empty = all)'
        required: false
        type: choice
        options:
          - ''
          - parse
          - graph
          - scope
          - embed
          - search
          - heuristic
      compare:
        description: 'Compare against baseline (true/false)'
        required: false
        type: boolean
        default: true

env:
  NODE_VERSION: '22'

jobs:
  benchmarks:
    name: Run Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Download baseline report
        id: baseline
        uses: actions/cache/restore@v4
        with:
          path: benchmark-baseline.json
          key: benchmark-baseline-${{ github.ref == 'refs/heads/master' && github.sha || 'master-latest' }}
          restore-keys: |
            benchmark-baseline-master-

      - name: Run benchmarks
        id: run
        run: |
          CATEGORY_FLAG=""
          if [ -n "${{ github.event.inputs.category }}" ]; then
            CATEGORY_FLAG="--category ${{ github.event.inputs.category }}"
          fi

          COMPARE_FLAG=""
          if [ -f benchmark-baseline.json ] && [ "${{ github.event.inputs.compare }}" != "false" ]; then
            COMPARE_FLAG="--compare benchmark-baseline.json"
          fi

          npx tsx scripts/run-benchmarks.ts $CATEGORY_FLAG $COMPARE_FLAG --output benchmark-report.json

      - name: Check for regressions
        if: github.event_name == 'pull_request' && steps.run.outcome == 'success'
        run: |
          REGRESSIONS=$(python3 -c "
          import json
          with open('benchmark-report.json') as f:
              report = json.load(f)
          regressions = report['summary']['casesWithRegressions']
          print(regressions)
          ")
          if [ "$REGRESSIONS" -gt 0 ]; then
            echo "::warning::Detected $REGRESSIONS performance regression(s) — check the benchmark summary above."
          fi

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: benchmark-report.json
          retention-days: 90

      - name: Cache baseline (master branch only)
        if: github.ref == 'refs/heads/master' && steps.run.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: benchmark-report.json
          key: benchmark-baseline-${{ github.sha }}

  # Summary comment on PR
  pr-comment:
    name: Post Benchmark Summary
    needs: benchmarks
    if: github.event_name == 'pull_request' && always()
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: benchmark-report

      - name: Generate summary comment
        id: summary
        run: |
          REPORT=$(python3 -c "
          import json
          with open('benchmark-report.json') as f:
              report = json.load(f)

          lines = ['## 🏎️ Benchmark Results', '']
          lines.append('| Suite | Category | Mean | P50 | P95 |')
          lines.append('|-------|----------|------|-----|-----|')

          for c in report['cases']:
              name = c['name']
              cat = c['category']
              mean = f\"{c['duration']['mean']:.2f}ms\"
              p50 = f\"{c['duration']['p50']:.2f}ms\"
              p95 = f\"{c['duration']['p95']:.2f}ms\"
              lines.append(f'| {name} | {cat} | {mean} | {p50} | {p95} |')

          lines.append('')
          regressions = report['summary']['casesWithRegressions']
          if regressions > 0:
              lines.append(f'> ⚠️ **{regressions} performance regression(s) detected**')
          else:
              lines.append('> ✅ No performance regressions detected')

          print('\n'.join(lines))
          ")

          # Write to file and output for workflow
          echo "$REPORT" > benchmark-summary.md
          {
            echo 'comment<<EOF'
            cat benchmark-summary.md
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const summary = fs.readFileSync('benchmark-summary.md', 'utf-8');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            // Update existing benchmark comment or create new one
            const benchComment = comments.find(c =>
              c.body && c.body.startsWith('## 🏎️ Benchmark Results')
            );

            if (benchComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: benchComment.id,
                body: summary,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: summary,
              });
            }
