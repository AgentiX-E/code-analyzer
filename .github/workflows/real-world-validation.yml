# @code-analyzer — Real-World Source Validation
#
# Runs the full code-analyzer pipeline against real open-source projects
# (React, Vue, Django, Kubernetes, Spring Boot) to validate production
# readiness on a weekly cadence.
#
# Triggered:
#   - Weekly schedule (Sunday at 00:00 UTC)
#   - Manual workflow_dispatch (with project selection)
#   - Push to main when benchmark files change

name: Real-World Validation

on:
  schedule:
    - cron: '0 0 * * 0'  # Every Sunday at 00:00 UTC
  workflow_dispatch:
    inputs:
      projects:
        description: 'Comma-separated list of projects to validate (react,vue,django,k8s,spring-boot)'
        required: false
        default: 'react,vue,django'
        type: string
  push:
    branches: [main]
    paths:
      - 'tests/benchmarks/real-world/**'
      - 'packages/analyzer/src/languages/**'
      - '.github/workflows/real-world-validation.yml'

permissions:
  contents: read
  issues: write

env:
  PNPM_VERSION: '9.15.0'
  NODE_VERSION: '22'

jobs:
  validate:
    name: 'Validate: ${{ matrix.project }}'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(github.event.inputs.projects && format('["{0}"]', join(github.event.inputs.projects, '","')) || '["react","vue","django"]') }}
        include:
          - project: react
            repo: https://github.com/facebook/react.git
            branch: main
            test_pattern: 'React Source Code Analysis'
          - project: vue
            repo: https://github.com/vuejs/core.git
            branch: main
            test_pattern: 'Vue.js Source Code Analysis'
          - project: django
            repo: https://github.com/django/django.git
            branch: main
            test_pattern: 'Django Source Code Analysis'

    steps:
      - name: Checkout code-analyzer
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Clone ${{ matrix.project }}
        run: |
          REPO="${{ matrix.repo }}"
          PROJECT=$(echo "${{ matrix.project }}" | tr '[:lower:]' '[:upper:]')
          echo "Cloning $REPO..."
          git clone --depth 1 --branch "${{ matrix.branch }}" "$REPO" "/tmp/${{ matrix.project }}-src"
          echo "Cloned ${{ matrix.project }} to /tmp/${{ matrix.project }}-src"

      - name: Run validation benchmark
        run: |
          echo "Running ${{ matrix.project }} validation..."
          npx vitest run --config vitest.config.ts --reporter=verbose \
            --testNamePattern "${{ matrix.test_pattern }}"
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        continue-on-error: true

      - name: Collect report
        if: always()
        run: |
          REPORT_PATH="tests/benchmarks/real-world/${{ matrix.project }}-analysis-report.json"
          if [ -f "$REPORT_PATH" ]; then
            echo "Report found at $REPORT_PATH"
            # Extract key metrics for summary
            SUCCESS_RATE=$(jq -r '.parse.successRate // "N/A"' "$REPORT_PATH")
            FILES=$(jq -r '.parse.totalFiles // "N/A"' "$REPORT_PATH")
            SYMBOLS=$(jq -r '.symbols.totalCount // "N/A"' "$REPORT_PATH")
            MEMORY=$(jq -r '.memory.deltaRssMB // "N/A"' "$REPORT_PATH")
            echo "SUCCESS_RATE=${SUCCESS_RATE}" >> "$GITHUB_ENV"
            echo "FILES=${FILES}" >> "$GITHUB_ENV"
            echo "SYMBOLS=${SYMBOLS}" >> "$GITHUB_ENV"
            echo "MEMORY=${MEMORY}" >> "$GITHUB_ENV"
          else
            echo "No report generated for ${{ matrix.project }}"
            echo "SUCCESS_RATE=N/A" >> "$GITHUB_ENV"
            echo "FILES=N/A" >> "$GITHUB_ENV"
            echo "SYMBOLS=N/A" >> "$GITHUB_ENV"
            echo "MEMORY=N/A" >> "$GITHUB_ENV"
          fi

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-validation-report
          path: |
            tests/benchmarks/real-world/${{ matrix.project }}-analysis-report.json
          retention-days: 90
          if-no-files-found: ignore

  # ── Aggregate Summary ─────────────────────────────────────────────────────
  summary:
    name: 'Validation Summary'
    runs-on: ubuntu-latest
    needs: [validate]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "## 🔬 Real-World Validation Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Project | Status | Files | Parse Rate | Symbols | Memory Δ |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---------|--------|-------|------------|---------|----------|" >> "$GITHUB_STEP_SUMMARY"

          RESULTS="${{ needs.validate.result }}"
          if [ "$RESULTS" = "success" ]; then
            echo "| All | ✅ Pass | — | — | — | — |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| All | ⚠️ Some Failed | — | — | — | — |" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "> Reports available as workflow artifacts (90-day retention)." >> "$GITHUB_STEP_SUMMARY"
