name: AACR Bench

# **The field's own judge, run by us, on the field's own 50 PRs.**
#
# **Why this exists, and why the earlier claim was wrong.** A previous version of the audits page said Martian's judge
# "can only run inside their pipeline". **It cannot - the benchmark is MIT and open-sources the PRs, the golden
# comments, the judge prompts and the evaluation pipeline**, and its README's "Adding a new tool" section ends:
# *"If a tool doesn't meet these yet, the harness is public and you're welcome to run it and publish your own
# results."*
#
# **So this job runs that harness on our output.** It clones the benchmark, scores the 50 PRs' diffs with our review
# engine, writes the `benchmark_data.json` the pipeline expects, and runs their judge — **which is what makes our F1
# comparable with Greptile's rather than merely analogous to it.**
#
# **And the honest boundary is stated rather than hidden.** We do not run `step0_fork_prs`, because that installs a
# bot account on GitHub and this job has no such account to install — **so our reviews come from our engine reading
# each PR's diff, which is the same input the other tools saw** (their reviews are also comments on those diffs).
# **The artifact records which judge model produced the figure and which scoring profile was active**, because
# **the benchmark's own documentation says the judge moves the numbers.**

on:
  workflow_dispatch:
    inputs:
      competitor:
        # **The one input that decides whether this run buys a competitor result.** `replay` (the default) reads the
        # file at `benchmarks/aacr/competitor-baseline.json`; `record` buys one and uploads it for review; `off` removes
        # the arm. **The default is the cheap side on purpose**: a dispatch that forgets to choose spends nothing on the
        # arm, and the artifact says which mode ran.
        description: 'Competitor arm: replay the recorded result, record a new one, or switch it off'
        type: choice
        # **Quoted, because `off` is a boolean in YAML 1.1** - the same reason this file writes `on:` and lets the
        # parser turn it into `true`. An unquoted `off` reaches the workflow as `false`, and a mode that arrives as a
        # boolean is a mode the script reads as unrecognised and answers by replaying - **which is the safe direction,
        # and still not the one anybody selected**.
        options: ['replay', 'record', 'off']
        default: replay
      prompt_order:
        # **Where the diff sits in a lane's prompt, exposed because it is now a measured variable rather than a
        # preference.** `boilerplate-first` puts the shared target-and-diff block last, which is what raised prefix
        # reuse from 61 % to 91.7 % and cut the reviewer's bill from 1.41 USD to 0.29 USD - **and the first run that
        # measured quality as well as cost read F1 0.1691 where the previous ordering read 0.2405.** One run is not an
        # answer, so the order is an input: two dispatches that differ in this line and in nothing else are the
        # experiment, and both artifacts record which order produced them.
        description: 'Prompt order: boilerplate-first (cheapest), lane-first, or diff-first'
        type: choice
        options: ['boilerplate-first', 'lane-first', 'diff-first']
        default: boilerplate-first
      max_pull_requests:
        # **The instrument's resolution, as a number someone can raise.** Fourteen pull requests was chosen when a run
        # cost 8.53 USD; a run now costs 0.57, so the corpus can grow by the same factor the bill fell. **It has to**:
        # two runs of the same job reported the per-language checklist at +0.0544 and then at -0.0292, and our own F1
        # at 0.2405 and then at 0.1691 - **a resolution coarser than the effects being claimed turns every verdict into
        # a coin toss that is reported as a result.** The corpus holds 200 pull requests; this input is how many of them
        # a run reads.
        description: 'Pull requests to score (default 14; the corpus holds 200)'
        type: string
        default: '14'
      skip_pull_requests:
        # **Where the slice starts, so that a confirmation is not scored on the rows that produced the hypothesis.**
        #
        # R-17's discovery was made on the first fifty pull requests of this corpus. **A threshold chosen between two
        # measured groups and then confirmed on the same rows is a threshold fitted to them**, so the confirmation reads
        # `skip_pull_requests: 50` with `max_pull_requests: 100` - a corpus disjoint from the discovery by construction
        # rather than by an argument in a document.
        description: 'Row to start at (default 0); 50 with 100 reads the slice after the discovery set'
        type: string
        default: '0'
      agent:
        # **The arm the head-to-head made necessary: a reviewer that can read the repository.**
        #
        # The competitor scored F1 0.4043 against our 0.2033 on 36 paired pull requests, and 158 of the 282 goldens we
        # missed had a finding of ours on their path within ten lines that described something else. `on` replaces the
        # five single-shot lanes with `ReviewAgent` - a plan, a tool loop over a checkout, a finding that survives only
        # if the code it quotes is in the file, and a filter pass. **`off` is the default**, because every figure this
        # repository has published was measured under the lanes and an arm that cannot be switched off cannot be
        # measured against them.
        #
        # **And it collapses the matrix to one arm.** The two arms differ in `code_context`, which the agent provides
        # for itself by reading the file; running the agent twice would buy the same measurement twice and write two
        # artifacts whose only difference is a switch the agent does not consult.
        description: 'Review arm: the five lanes (off), or the reading agent (on)'
        type: choice
        options: ['off', 'on']
        default: 'off'
      max_findings_per_file:
        # **The cap that turned out to be a ceiling on the work rather than a rail on the noise.** §23.7 measured 25 of
        # one run's 225 drafts refused a slot, and 74 of that run's missed goldens sitting on files it had read - so the
        # next registered hypothesis (H2) is that volume, not aim, is where half the remaining gap lives. **It is a
        # dispatch input rather than an edit**, so the arm at 3 and the arm at 6 are the same script on the same rows.
        description: 'Findings one file may carry (default 3, the lane contract; 6 is H2)'
        type: string
        default: '3'
      # **`code_context` used to be an input here, and its deletion is the fix rather than a tidy-up.** As an input it
      # had one value per dispatch, so measuring the device meant two dispatches - and two dispatches of this job have
      # reported the *same* configuration at 0.1691 and 0.2405, which is a spread larger than every effect registered in
      # `EVAL-CONTRACT.md`. The switch is now a matrix key, so one dispatch produces both arms over the same corpus, the
      # same goldens and the same judge. **A device whose contribution can only be measured across runs cannot be
      # measured by this instrument**, and §20.4 named this edit before R-18's number existed.
  schedule:
    # **Off-peak on purpose.** The vendor halves every price outside 01:00-04:00 and 06:00-10:00 UTC on weekdays,
    # so a weekly run at this hour costs half what the same run costs at 08:00 - and this workflow's own artifact
    # records the spend it took to produce the figure.
    - cron: '20 4 * * 2'
  # **Not this file, and as of iteration 114 not the script either.**
  #
  # A workflow's own edit used to re-run it, so fixing a trigger cost one run of the thing it triggers. Then the one
  # path left was the harness itself, on the argument that an edited harness should be exercised against the corpus.
  # **The artifact says what that cost**: the run this path triggered on 2026-11-10 read the account at 355.69 CNY
  # before and 295.10 after - **60.59 CNY, or 8.53 USD, for one push** - and the model calls this repository can see
  # in that run came to 2.64 USD. **The harness's arithmetic is now proved by `--dry-run` in CI on every push, which
  # needs no credentials and no corpus**, so the corpus run is a dispatch or the weekly schedule and nothing else.

concurrency:
  group: aacr-bench
  cancel-in-progress: false

permissions:
  contents: read

#
# **And why this job runs twice, in parallel, differing in one environment variable.**
#
# `docs/EVAL-CONTRACT.md` registers a claim before its run, and the matrix below is where the claim is turned into two
# arms over **the same pull requests, the same goldens and the same judge** - with the `compare` job, which has no
# credentials and therefore cannot call a model, computing the paired difference. **Two runs in one workflow rather than
# one run today and another next week**, because a comparison across commits is a comparison across everything else that
# changed in between.
#
# **The matrix varies the hypothesis currently under test, and that changed in iteration 124.** It used to vary
# `AACR_CHECKLIST` - the per-language defect checklist of §8 - and that device has been measured twice and falsified
# twice, so a matrix that still varied it would spend two arms and a hundred pull requests comparing a retired
# configuration. Then it varied `AACR_PROFILE`, the category floor of §19/R-17, which was falsified at +0.0079 against a
# registered +0.02 on a hundred unseen pull requests. **What it varies now is `AACR_CODE_CONTEXT`**, the code window of
# §20/R-18: one arm reads each changed file at the pull request's head commit and shows each lane the block its hunk sits
# in, the other reads only the diff. **The comparison job reads the varied field out of the two artifacts rather than
# being told it**, so the next hypothesis is a matrix edit and not a rewrite.
#
# **And this arm moved into the matrix for a reason the last one did not have.** R-17 and R-18 were both measured across
# two dispatches, and two dispatches of this job have reported the *same* configuration at 0.1691 and 0.2405 - a spread
# larger than any effect registered here. **A comparison across runs therefore cannot separate a 0.02 device from the
# job's own variance**, which is why R-18's first result is `falsified` and `inconclusive` in the same sentence, and why
# §20.4 named this edit before that number existed. One dispatch now produces both arms over the same corpus, the same
# goldens and the same judge; `compare` still has no credentials, so the arithmetic still cannot have been done by a
# model.
jobs:
  aacr-bench:
    # **Both matrix keys are in the job's own name**, because a run page that shows two identical titles for two
    # different arms is a page a reader has to open artifacts to disambiguate - and the whole point of the pair is that
    # the difference is legible before anything is downloaded.
    name: Our reviews on a direct competitor's corpus (${{ matrix.profile }} profile, code context ${{ matrix.code_context }}, agent ${{ inputs.agent || 'off' }})
    runs-on: ubuntu-latest
    # **Raised from 180 when the corpus went from five pull requests to fourteen**, which is the size at which a 0.04
    # move stops being a coin toss. The previous corpus took 29 minutes; the arithmetic that expects roughly three times
    # that is the only reason this number moved, and **a timeout raised because a job is close to it would hide the
    # slowdown rather than accommodate the corpus.**
    #
    # **Raised again to 340, and the arithmetic is written down rather than felt.** Fourteen pull requests took 46
    # minutes on 2026-11-10 across 1 770 reviewer calls and 4 783 judge calls - **142 calls per minute, 3.3 minutes per
    # pull request** - and two hundred pull requests at that rate is eleven hours, which does not fit in any job GitHub
    # will run. **That paragraph was right about the runner and wrong about the work**: the fourteen-pull-request run
    # cost 468 model calls per pull request and the fifty-pull-request run of 2026-11-10 cost 301, so its two arms took
    # 61.0 and 79.7 minutes - **1.22 and 1.59 minutes per pull request, not 3.3**. The number this ceiling fits is
    # therefore **213** pull requests at the slower measured arm, and the figure in this comment said **190** until
    # iteration 119, which needs 1.8 minutes per pull request and is a number nobody measured.
    #
    # **What that changes in practice.** R-17's confirmation is a hundred pull requests the discovery did not see: 159
    # minutes of a 340-minute ceiling, dispatched as the single run the registration names. **The whole 200-pull-request
    # corpus is now 319 minutes - inside the ceiling at 94 % of it, and outside anything a retry could absorb**, so a
    # full-corpus run is a thing to schedule and not a thing that fails. A dispatch beyond 213 is refused by the runner
    # rather than by a wrong number in the artifact.
    timeout-minutes: 340
    strategy:
      # **Both arms are information.** A run that dies takes its half of the comparison with it, and `compare` has to
      # report that rather than a one-sided figure.
      fail-fast: false
      # **The two arms of the hypothesis currently registered, written as `include` so that a difference between them is a
      # variable somebody chose rather than a cross product of everything on the list.**
      #
      # **It varies `code_context` now, and `profile` is pinned to `advisory`.** R-18 (§20) was measured across two
      # dispatches and came back `falsified` on the arm it names by 0.0065 - a movement smaller than the 0.0311 that
      # slice resolves - so the difference it reported carries the run-to-run variance of this job as well as the device.
      # **Two runs of this job have reported the same configuration at 0.1691 and 0.2405**, which is larger than every
      # effect registered here; a comparison across dispatches therefore cannot settle a 0.02 claim at 36 pull requests,
      # and §20.4 named this matrix as the dispatch that could, before the number existed.
      #
      # **`profile` is pinned rather than deleted, and the reason is a measurement.** R-17's 0.22 floor was falsified at
      # +0.0079 against a registered +0.02 on 100 unseen pull requests (§19.3), so `advisory` is the default and the
      # other arm is a retired configuration. A cross product with it would double this dispatch's bill to answer a
      # question already answered, and **a matrix that varies two things answers neither**: `variedField` in
      # `aacr-ablation-compare.mjs` refuses a pair whose artifacts differ in more than one key, and it would refuse every
      # pair this job produced.
      #
      # **And it is one row rather than two when the arm under test is the agent.** The agent reads the file it needs, so
      # `code_context` is not a variable it consults: two rows would buy the same measurement twice and write two
      # artifacts whose difference is a switch neither of them read. **The rows are computed rather than filtered**, because
      # a job-level `if` cannot see `matrix` - the expansion happens before it, and a workflow that names `matrix` there
      # does not parse at all. That is not a preference: the dispatch this replaced was refused with
      # *"Unrecognized named-value: 'matrix'"* and the workflow did not load until the expression moved here.
      matrix:
        include: '${{ fromJSON((inputs.agent || ''off'') == ''on'' && ''[{"profile":"advisory","code_context":"on"}]'' || ''[{"profile":"advisory","code_context":"off"},{"profile":"advisory","code_context":"on"}]'') }}'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      # **The arithmetic, before the money.** `--dry-run` runs ranking, matching, the curve and the paired test over a
      # six-finding fixture whose expected figures are written in the script, and exits without writing an artifact or
      # calling a provider. **A benchmark job whose maths is unverified until the day it produces a quotable number is a
      # job that spends a thousand calls to test its own arithmetic for the first time in a report.**
      - name: Prove the measurement's arithmetic without the model
        run: node .github/scripts/aacr-bench.mjs --dry-run

      # **The competitor this job now scores beside us, installed from its own registry entry.**
      #
      # **The first run of the second reviewer reported `spawnSync ocr ENOENT` five times**, which is **the honest way
      # to be missing a tool and the reason `firstFailure` exists as a field.** **A reviewer that cannot be invoked
      # contributes zero findings and reads as a silent one** - and **the difference between those two is a field, not
      # a footnote.**
      - name: Install the competitor whose corpus this is
        run: |
          set -e
          # **Pinned, because the figure this job publishes is a comparison and an unpinned competitor moves under it.**
          # 1.13.8 is the version every published AACR figure in this repository was measured against - the install step
          # prints its own version on the next line, so a bump is a visible change to the comparison rather than a
          # silent one. Bumping it means re-running the pairing, not just this job.
          npm install -g @alibaba-group/open-code-review@1.13.8
          command -v ocr
          ocr --version

      # **A direct competitor's corpus, published under Apache-2.0 with three context levels, the third of which is
      # Repo Level** - so **it measures cross-file behaviour, which is the claim this project makes for itself.**
      - name: Clone the benchmark
        run: |
          set -e
          git clone --depth 1 https://github.com/alibaba/aacr-bench /tmp/aacr-bench
          echo "cloned at $(git -C /tmp/aacr-bench rev-parse HEAD)"
          find /tmp/aacr-bench -name '*.json' | head -10

      # **No `|| true`, and no fallback.** **A corpus that is not there fails the job**, because **a green run with no
      # data is the failure mode this repository has three rules about.**
      - name: Review the corpus with our engine
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # **The token the diff requests are made with, and the reason the two arms of the last run read different
          # corpora.**
          #
          # `fetchPrDiff` has read `GITHUB_TOKEN` since iteration 118 - and **this step never passed it**, so every
          # fifty-pull-request arm fetched its diffs unauthenticated: sixty requests an hour, shared by whichever arms
          # happened to be running from the same runner range. The `with` arm read forty-six of fifty and the artifact
          # recorded `"51 requests left in the hour and the request was unauthenticated"` four times. **A variable the
          # code reads and the job does not set is a default nobody chose.**
          #
          # **`github.token` rather than a PAT**: it is scoped to this repository, it expires with the job, and reading
          # a public pull request's diff needs nothing more than `contents: read`, which is the permission this workflow
          # already declares. The rate limit goes from sixty an hour to a thousand per repository.
          GITHUB_TOKEN: ${{ github.token }}
          MARTIAN_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MARTIAN_BASE_URL: https://api.deepseek.com/v1
          MARTIAN_MODEL: deepseek-chat
          AACR_DIR: /tmp/aacr-bench
          # **`MAX_PRS` is the corpus size the registration was written against**, and the slice below is where it
          # starts.
          MAX_PRS: ${{ inputs.max_pull_requests || '14' }}
          # **And where the slice starts**, so a confirmation run and its discovery never share a row.
          AACR_SKIP_PRS: ${{ inputs.skip_pull_requests || '0' }}
          # **The checklist is off in both arms**, because it is retired: two paired runs put it 12 and then 13 goldens
          # behind the prompt without it, and §16.2 measured it at −0.0237 with the corpus at fifty. **A device that has
          # been falsified twice does not get a third arm by default** - it gets a registration, and this one has none.
          AACR_CHECKLIST: 'off'
          # **What this arm may spend, in USD.** The reviewer is given a ledger and a ceiling, so **a retry storm or a
          # corpus that grew by an order of magnitude stops at a stated number instead of at the account's balance** -
          # which is what happened on 2026-11-09, when four ad-hoc runs of this job spent most of a day's credit and the
          # only record of it was a balance that had moved. **The ceiling is an input so a larger corpus can raise it
          # deliberately**, and the artifact records the number the run was bounded by.
          #
          # **The ceiling is no longer computed here, and that is the point.**
          #
          # It used to be `5` for a replaying run and `12` for a recording one - two constants written for fourteen
          # pull requests. **Then `max_pull_requests` became an input**, and a fifty-pull-request run - about 2.3 USD by
          # the same rate - would have been admitted by a bound that was never about it. **A ceiling that does not move
          # with the work is a comment, not a bound**, so the arithmetic now lives in `.github/scripts/lib/run-config.mjs`
          # where a unit test can call it, and it scales with the corpus the dispatch asked for. **Only a `record` run
          # needs an override**, because buying the competitor's arm is a decision this workflow makes and not one the
          # rate can infer; everything else lets the script compute its own bound and record it in the artifact.
          AACR_MAX_USD: ${{ inputs.competitor == 'record' && '12' || '' }}
          # **The experimental variable, passed through and recorded.** A run that does not name an order gets the
          # default the code was written with, and the artifact's `configuration.promptOrder` says which one ran - so
          # two artifacts can be compared without anyone remembering what the default was that week.
          AACR_PROMPT_ORDER: ${{ inputs.prompt_order || 'boilerplate-first' }}
          # **The experimental variable, and the only one this matrix varies.** Read from `matrix.code_context` rather
          # than from a dispatch input, because **an input would be one value chosen once and given to both arms** - which
          # is exactly the arrangement that made R-18 a comparison across two dispatches. The artifact's
          # `configuration.codeContext` and this line cannot disagree: there is one place to write `on`.
          AACR_CODE_CONTEXT: ${{ matrix.code_context }}
          # **The profile the artifact will record**, passed explicitly rather than left to the script's default, so the
          # workflow and the artifact cannot disagree about which reviewer produced the figure.
          AACR_PROFILE: ${{ matrix.profile }}
          # **The arm itself**, passed explicitly for the same reason as the two above: the artifact and the workflow
          # cannot disagree about which reviewer produced the figure. The agent reads a checkout of the pull request's
          # head commit and ignores `AACR_CODE_CONTEXT` - it does not need a window when it can open the file.
          AACR_AGENT: ${{ inputs.agent || 'off' }}
          # **The cap on findings per file, which §23.7 measured to bind rather than to protect.** On `43176459822` the
          # arm filed 225 drafts and kept 196 - **25 were refused a slot, not found wanting** - while 74 goldens it missed
          # sat on files it read and said nothing about. Three per file is inherited from the lanes, where three slots per
          # file per lane *was* the emission contract; **an input rather than a constant, so a run at 6 and a run at 3 on
          # the same rows differ in this line and in nothing else**, and the artifact records which produced the figure.
          AACR_MAX_FINDINGS_PER_FILE: ${{ inputs.max_findings_per_file || '3' }}
          # **Whether this run buys a competitor result, or reads the one already paid for.** The script's own default
          # is `replay`; it is passed explicitly here so the artifact cannot disagree with the workflow about which run
          # produced it, and so a manual `record` is a line in the log rather than an environment variable someone set.
          #
          # **And only one arm records.** The matrix runs this job twice, differing in `code_context`; the competitor is
          # the same measurement in both, so a `record` dispatch that let both arms record would buy the 5.89 USD arm
          # twice and write two files whose only difference is which arm's artifact carried them. **The `off` arm
          # records**, because the recorded baseline is the configuration every published figure was measured under, and
          # a baseline bought by the arm under test would make the competitor's operating point depend on the device
          # being measured.
          AACR_COMPETITOR: ${{ inputs.competitor == 'record' && matrix.code_context == 'off' && 'record' || inputs.competitor == 'record' && 'off' || inputs.competitor || 'replay' }}
          # **And the second reviewer's own configuration**, pointing at the same provider the judge uses - so
          # **the reviewer and the judge are the same model, which is requirement 2 satisfied by construction.**
          OCR_LLM_URL: https://api.deepseek.com/anthropic
          OCR_LLM_TOKEN: ${{ secrets.DEEPSEEK_API_KEY }}
          OCR_LLM_MODEL: deepseek-chat
        run: node .github/scripts/aacr-bench.mjs

      # **The artifact proves its own figure before it is uploaded, and the proof is a program rather than a paragraph.**
      #
      # `scripts/aacr-paired-replay.mjs --check` recomputes the published precision, recall and F1 from the rows beside
      # them, with no model and no network, and **exits non-zero when the rows do not support the figure**. Iteration 122
      # shipped the script and wrote the claim in a document; **the claim was in the document and the script was in no
      # job**, so the one thing that could have caught a figure drifting from its rows ran only when a person remembered
      # to run it - which is the definition of a check that is not one. **`Lint & Format` said so on the next push**
      # (`scripts/aacr-paired-replay.mjs: no workflow names it`), which is the wiring gate doing its job on the same day
      # the omission was made.
      #
      # **It runs here rather than in `compare`** because this is the job that produced the file: a run whose artifact
      # does not replay to its own figure is a run that must fail before the artifact is published, not after two arms
      # have been compared on it. **No `|| true`**: a refusal is the output.
      - name: Prove the artifact replays to its own figure
        run: |
          set -e
          node scripts/aacr-paired-replay.mjs --check

      # **The score is not the only figure an artifact publishes any more.** Iteration 124 added the full attribution
      # list, the per-category decomposition of the true positives, and the goldens neither reviewer found - and **a
      # breakdown computed by a second rule can disagree with the figure it decomposes while both numbers are plausible**.
      # The first draft of the category table did exactly that: it counted findings that matched a golden and reported 73
      # where the run scored 39, because one golden mentioned by three lanes is one true positive and three matches.
      #
      # **It fails here rather than in `compare`** for the same reason the step above does: a run whose own detail layers
      # do not add up must fail where it produced them, before the artifact is published and before two arms are compared
      # on it. **No `|| true`**: a refusal is the output.
      - name: Prove the artifact's detail layers add up
        run: |
          set -e
          node scripts/aacr-bench-audit.mjs --check

      - name: Upload the figure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          # **Both matrix keys are in the name**, because a pair of artifacts whose names differ in one segment is a pair
          # a reader can match to the arms without opening either - and because `an-artifact-that-is-never-uploaded-is-
          # never-downloaded.test.ts` expands this name from the matrix and refuses a download nothing uploads.
          name: aacr-bench-${{ matrix.profile }}-${{ matrix.code_context }}
          # **The figure and the competitor's whole output**, because **that output's format is what the next
          # iteration has to read** and **a field cannot hold a document**.
          path: |
            benchmarks/aacr-bench.json
            benchmarks/aacr/competitor-baseline.json
            benchmarks/runnable-competitors-outputs/
          if-no-files-found: warn
          retention-days: 90

  # **The comparison, computed where no model can be called.**
  #
  # This job downloads the two artifacts and does arithmetic on them. It has no `secrets.`, no provider endpoint and no
  # corpus checkout, so **the number it produces cannot have been produced by a model** - which is the property a
  # comparison needs and a benchmark arm does not have.
  compare:
    name: The two runs, paired
    needs: aacr-bench
    runs-on: ubuntu-latest
    # **A single-row matrix has no counterpart, so this job does not run for it.** The agent arm collapses the matrix
    # to one row because `code_context` is not a switch it consults, and the first dispatch under that shape failed
    # here - at `Download the run without it`, looking for an artifact the matrix never produced. **The job that
    # reports a comparison is not the job that should discover there is nothing to compare**: a dispatch whose whole
    # purpose is one arm should end green with its figure, and a run of this job over one row would compute a
    # difference between an arm and nothing.
    if: (inputs.agent || 'off') != 'on'
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc

      # **The arithmetic before the answer**, for the same reason the bench job has `--dry-run`: this script's
      # "no effect" branch is the branch a device that does nothing would take, and **a comparison whose null branch is
      # wrong reports null results that read as science.**
      - name: Prove the comparison's arithmetic on fixtures
        run: node .github/scripts/aacr-ablation-compare.mjs --self-test

      # **The arm under test goes in `/tmp/with`, and the direction is load-bearing rather than stylistic.** The
      # comparison script reads `with` as the side that has the device and `without` as the side that does not, and its
      # registrations name a sign: R-18 asks the pull-request arm to *rise*. Swapping these two paths would report the
      # same experiment with every gain negated, and **the artifact would be internally consistent while saying the
      # opposite**, which is the one failure no gate in this job can see.
      - name: Download the run with the code window
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: aacr-bench-advisory-on
          path: /tmp/with

      # **Every artifact name here is produced by the matrix above, and a job that downloads a name the matrix does not
      # produce fails at this step rather than at the comparison.** This one said `aacr-bench-defectout` for two
      # iterations - the name that `without` became when the matrix was renamed by substitution - so the fifty- and
      # hundred-pull-request runs both spent their money, uploaded both artifacts, and then failed here, which is the
      # only step whose output is the thing the run was dispatched for.
      - name: Download the run without it
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: aacr-bench-advisory-off
          path: /tmp/without

      # **No `|| true` and no fallback**: the script refuses to compare two artifacts that are not the same experiment,
      # and a refusal is written into the artifact rather than swallowed. A missing artifact fails the job here, which
      # is the correct outcome - **a comparison of one run is not a comparison.**
      - name: Compare them, paired
        run: |
          set -e
          node .github/scripts/aacr-ablation-compare.mjs /tmp/with/aacr-bench.json /tmp/without/aacr-bench.json

      - name: Upload the comparison
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: aacr-ablation-paired
          path: benchmarks/aacr-ablation-paired.json
          if-no-files-found: warn
          retention-days: 90
