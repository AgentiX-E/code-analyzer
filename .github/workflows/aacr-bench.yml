name: AACR Bench

# **Two corpora, one runner, and the difference between them stated where the run is dispatched.**
#
# **Why this header had to be rewritten.** It said the job *"runs that harness on our output"* over Martian's 50 pull
# requests, cloning the benchmark and writing the `benchmark_data.json` their pipeline expects. **No such job existed**:
# the only corpus this workflow has ever read is AACR-Bench, and `AACR_DIR` was a hard-coded `/tmp/aacr-bench`. A
# comment describing a measurement nobody ran is the same defect class as a figure whose provenance nobody recorded -
# and it was found by going to look for the job, which is the only way a claim in a comment is ever checked.
#
# **The two corpora answer two different questions and are never pooled.**
#
# - **AACR-Bench** (Alibaba, Apache-2.0, 200 pull requests, 1,505 expert-confirmed issues, ten languages). It is the
#   corpus this repository's figures have always been measured on, and its caveat is in the artifact: **Alibaba built
#   both the tool and the benchmark it wins on.**
# - **Martian's Code Review Bench** (MIT, 50 pull requests across five repositories, 173 golden comments, three judge
#   models, nineteen tools ranked). **This is the only corpus on which our F1 can be placed beside a competitor's
#   number** - Greptile 62.3, CodeRabbit 61.0, Qodo 58.4, on the same 173 comments. It is also the corpus whose
#   answer key the field argues about: 137 comments at launch, 173 after the August audit that *removed two, rewrote
#   twenty-five and added thirty-eight*.
#
# **What we do and do not borrow.** `dataset: martian` reads the committed, converted copy of their golden set
# (`benchmarks/martian/`, provenance in its README) and scores **our own findings** against it with our own judge. We do
# not run `step0_fork_prs`, because that installs a bot account on GitHub and this job has none - **so our reviews come
# from our engine reading each pull request's diff, which is the same input the other tools saw.** And we do not borrow
# their judge model: the figure this produces is `deepseek-chat` against `claude-opus-4-5` / `gpt-5.2`, a difference the
# benchmark's own documentation prices at **up to nine F1 points for the top tools**.

on:
  workflow_dispatch:
    inputs:
      dataset:
        # **Which answer key this run is scored on.** `aacr` is the default because it is the corpus every earlier
        # figure was measured on, and **a default that silently changed the corpus would invalidate the comparison the
        # artifact makes against its own history.** `martian` is the comparability run: same runner, different key.
        description: 'Corpus: AACR-Bench (our history) or Martian (the field leaderboard)'
        type: choice
        options: ['aacr', 'martian']
        default: aacr
      competitor:
        # **The one input that decides whether this run buys a competitor result.** `replay` (the default) reads the
        # file at `benchmarks/aacr/competitor-baseline.json`; `record` buys one and uploads it for review; `off` removes
        # the arm. **The default is the cheap side on purpose**: a dispatch that forgets to choose spends nothing on the
        # arm, and the artifact says which mode ran.
        description: 'Competitor arm: replay the recorded result, record a new one, or switch it off'
        type: choice
        # **Quoted, because `off` is a boolean in YAML 1.1** - the same reason this file writes `on:` and lets the
        # parser turn it into `true`. An unquoted `off` reaches the workflow as `false`, and a mode that arrives as a
        # boolean is a mode the script reads as unrecognised and answers by replaying - **which is the safe direction,
        # and still not the one anybody selected**.
        options: ['replay', 'record', 'off']
        default: replay
      pair:
        # **Whether this dispatch buys two arms or one, and it is a budget question with a measurement behind it.**
        #
        # A pair exists to price a device, and a device is priced once per registration. §45's registration carried its
        # own stopping rule - *if R-20 is falsified on its discovery slice, the claim-checking device is retired* - and
        # R-20 was falsified: 24 true positives against 90, paired 6 for and 72 against. **A third dispatch of a retired
        # device would buy a comparison nobody registered**, so the default is one arm and the arithmetic follows it
        # (`compare` is skipped, not failed, because a job that reports a difference between an arm and nothing is the
        # one failure no gate in that job can see).
        #
        # **`on` is still reachable**, because the retired device's code stays in the tree as an ablation reference and
        # a future hypothesis may want to re-price it against a corpus that changed. Re-arming it is a decision with a
        # price, which is what a dispatch input is for.
        # **And a third value, because the claim check has two forms and only one of them was ever priced.**
        # `on` is §44's adjudicator: one call per finding, and a removal applied on the reader's word. It moved precision
        # to 45.5 % and recall to 6.6 %, and F1 from 19.5 % to 11.6 %. `falsifier` is R-36's gate: **one call per file,
        # keep by default, and a removal only when the reader quotes a line this diff added** - verified against the
        # added lines, and refused if the quote is not one of them. The field is shared because the question is shared
        # (*does a second reader agree with this sentence*) and only the contract differs; a run that could not say
        # which contract produced its pool would be the §44 artifact defect, one device later.
        description: 'Buy both arms (a registered device under test) or one arm (a diagnostic run); falsifier buys the keep-by-default gate'
        type: choice
        options:
          ['off', 'on', 'falsifier', 'falsifier-v2', 'falsifier-v3', 'falsifier-v4', 'change-shape']
        # **Quoted, for the reason the `competitor` input above spells out.** An unquoted `off` is a YAML boolean, and a
        # dispatch that omits this input fails with 422 *"Provided value 'false' for input 'pair' not in the list of
        # allowed values"* - **the workflow could not be dispatched with its own defaults**, which is how the R-30
        # dispatch was refused on its first attempt.
        default: 'off'
      prompt_order:
        # **Where the diff sits in a lane's prompt, exposed because it is now a measured variable rather than a
        # preference.** `boilerplate-first` puts the shared target-and-diff block last, which is what raised prefix
        # reuse from 61 % to 91.7 % and cut the reviewer's bill from 1.41 USD to 0.29 USD - **and the first run that
        # measured quality as well as cost read F1 0.1691 where the previous ordering read 0.2405.** One run is not an
        # answer, so the order is an input: two dispatches that differ in this line and in nothing else are the
        # experiment, and both artifacts record which order produced them.
        description: 'Prompt order: boilerplate-first (cheapest), lane-first, or diff-first'
        type: choice
        options: ['boilerplate-first', 'lane-first', 'diff-first']
        default: boilerplate-first
      max_pull_requests:
        # **The instrument's resolution, as a number someone can raise.** Fourteen pull requests was chosen when a run
        # cost 8.53 USD; a run now costs 0.57, so the corpus can grow by the same factor the bill fell. **It has to**:
        # two runs of the same job reported the per-language checklist at +0.0544 and then at -0.0292, and our own F1
        # at 0.2405 and then at 0.1691 - **a resolution coarser than the effects being claimed turns every verdict into
        # a coin toss that is reported as a result.** The corpus holds 200 pull requests; this input is how many of them
        # a run reads.
        description: 'Pull requests to score (default 14; the corpus holds 200)'
        type: string
        default: '14'
      skip_pull_requests:
        # **Where the slice starts, so that a confirmation is not scored on the rows that produced the hypothesis.**
        #
        # R-17's discovery was made on the first fifty pull requests of this corpus. **A threshold chosen between two
        # measured groups and then confirmed on the same rows is a threshold fitted to them**, so the confirmation reads
        # `skip_pull_requests: 50` with `max_pull_requests: 100` - a corpus disjoint from the discovery by construction
        # rather than by an argument in a document.
        description: 'Row to start at (default 0); 50 with 100 reads the slice after the discovery set'
        type: string
        default: '0'
      window:
        # **The code-window control, and the arm R-22 needs before its number can be read.**
        #
        # R-22 measured the reading agent at **+0.0412** on the file arm in one dispatch, and the reader cannot be
        # switched on without being shown the code it reads - its artifact carries `codeContext: true` while the lane
        # arm carries `false`. The window has its own measured movement (**+0.0240**, §20.5, 36 pull requests), so
        # **a gain of 0.0412 with a 0.0240 component in it is not yet a reader result**.
        #
        # `pair` runs the five lanes twice, once with the window and once without, over the same hundred rows - which is
        # the arm that was deleted when `code_context` stopped being an input. It is back as a control rather than as a
        # device: the number it produces is **subtracted** from R-22's, and **a decomposition that is not measured is a
        # confound wearing a verdict.**
        #
        # **`grid` is the arm this input could not express until §129.** A pair varies one key, because `variedField`
        # refuses a pair of artifacts that differ in more than one - correct for a subtraction, and fatal for the only
        # experiment that can find a *combination*. `grid` buys the full `2^3` over `code_context` x `adjudicate` x
        # `remarks` (`.github/scripts/aacr-plan-matrix.mjs`), row 0 being the baseline every published figure was
        # measured under. **Three devices priced in one dispatch instead of three iterations**, which is what three
        # single-factor ablations against a 0.0281 resolution actually cost.
        description: 'Code-window control: one arm (off), the five lanes with and without it (pair), or the 2^3 grid over code context x adjudicate x remarks'
        type: choice
        options: ['off', 'pair', 'grid']
        default: 'off'
      reach:
        # **The repository graph, for the lanes** (§100's device, §101's supply).
        #
        # §100 moved the index in front of the sentence and registered R-44 - **and the device could not be run, because
        # no arm had a repository.** The benchmark fetches the changed files and nothing else, so *"three callers still
        # pass two arguments"* was a sentence no lane could produce. `on` clones the pull request's head commit, walks it
        # once, and hands each changed file the one line describing what it reaches.
        #
        # **`off` is every figure this repository has published**, and the artifact's `configuration.reach` says which
        # side a figure came from. The price is bandwidth and a few hundred milliseconds per repository, recorded as
        # `reach.indexMs` and `reach.filesIndexed` beside the figure it may move.
        description: 'Repository graph for the lanes: off (every published figure) or on (R-44)'
        type: choice
        options: ['off', 'on']
        default: 'off'
      agent:
        # **The arm the head-to-head made necessary: a reviewer that can read the repository.**
        #
        # The competitor scored F1 0.4043 against our 0.2033 on 36 paired pull requests, and 158 of the 282 goldens we
        # missed had a finding of ours on their path within ten lines that described something else. `on` replaces the
        # five single-shot lanes with `ReviewAgent` - a plan, a tool loop over a checkout, a finding that survives only
        # if the code it quotes is in the file, and a filter pass. **`off` is the default**, because every figure this
        # repository has published was measured under the lanes and an arm that cannot be switched off cannot be
        # measured against them.
        #
        # **And it collapses the matrix to one arm.** The two arms differ in `code_context`, which the agent provides
        # for itself by reading the file; running the agent twice would buy the same measurement twice and write two
        # artifacts whose only difference is a switch the agent does not consult.
        description: 'Review arm: the five lanes (off), the reading agent (on), or both in one dispatch (pair)'
        type: choice
        options: ['off', 'on', 'pair']
        default: 'off'
      ensemble:
        # **Both reviewers, merged into one list (§56), and the arm exists because the overlap was measured before it was
        # built.** `43676036390` ran the lanes and the reader over the same hundred pull requests: 198 and 171 distinct
        # goldens, **93 in common**, a union of 276 of 724 against 198 for either alone. The second reviewer was never
        # paid for because it costs 1 920 comments to say what one says in 1 109; **cut to twelve per pull request the
        # union scores 0.2243 and a merge that removes the restatements reaches 0.2422**, so the device is the merge and
        # this input is how it is measured. It requires `agent: on` and any other combination is ignored by the script.
        # **`pair` is the arm R-29 could not run.** The registration named *a list merged from the five lanes and the
        # reading reviewer*, and the run that confirmed it had the lanes emptied by the cost rule above, so the artifact
        # carried one reviewer's candidates and no way to tell. `pair` dispatches both configurations over the same rows,
        # so the difference between the artifacts is the merge and the union it merges is checkable in `merge.sides`.
        # **`reader` is the device R-29 measured by accident, named on purpose.** With `on` the merge has two lists;
        # with `reader` it has one, and the selection pass - de-duplicate, then twelve per pull request - is what is being
        # measured. That arm scored 0.2504 against the single reader's 0.2148 on the confirmation slice, and **a device
        # reachable only through another device's upstream cost rule cannot be registered or falsified**.
        # **`pair-reader`** dispatches both the lanes and that arm over the same rows, which is the pair R-31 needs.
        description: 'Merge both reviewers (on), the reader alone (reader), or both sides of either in one dispatch (pair, pair-reader)'
        type: choice
        options: ['off', 'on', 'reader', 'pair', 'pair-reader']
        default: 'off'
      idioms:
        # **Whether the deterministic idiom lane runs beside the five model lanes, and it is the arm the sample bought.**
        #
        # Fifty missed goldens were read one at a time: **five were the same concern in other words, four aimed at the
        # same function with a different focus, and forty-one described something else entirely** - a `const auto&` on a
        # variable that is only read, a `2.0` that should be `2.0f`, a commented-out `Fill(0.0)`, an `async` with
        # nothing to await. Those are not findings a model asked for defects produces, and **two prompt contracts and a
        # stated line-number window could not produce them either**.
        #
        # **`off` is the default**, because every figure this repository has published was measured without this lane:
        # an arm that cannot be switched off cannot be compared with them.
        #
        # **`pair` is what R-21 is scored with**: the same hundred pull requests reviewed twice inside one dispatch, so the
        # difference between the arms is the lane. `on` alone is the diagnostic dispatch - it prices the lane without a
        # comparison - and it is the value that makes the matrix expression's third branch reachable.
        description: 'Idiom lane: five model lanes (off), the lane alone (on), or both arms (pair)'
        type: choice
        options: ['off', 'on', 'pair']
        default: 'off'
      remarks:
        # **The arm R-25 registers: one model call per file, asked for the remarks the five lanes never attempt.**
        #
        # §47.1 read fifty of the goldens that had a finding of ours on their own path and were still judged not to
        # address them: **five were the same concern in other words, four aimed at the same function with a different
        # focus, and forty-one described something else entirely** - a `const auto&` on a loop variable that is only
        # read, a `2.0` that should be `2.0f`, a commented-out `Fill(0.0)`, a doc comment naming the old parameter.
        # **About ten report a defect and about twenty-nine report a maintainability or convention remark**, and the
        # engine emits semantic defects and nothing else.
        #
        # **Why this is not `idioms` again.** R-21 measured the six deterministic rules at +0.0148 against a registered
        # +0.02 (p = 0.2615): the right direction and short of the bar, which is what a fixed list looks like against a
        # vocabulary. **A rule fires on the construct its author thought of**; the families in `remark-lane.ts` are a
        # list of things to look for, and the reading is still the model's.
        #
        # **`off` is the default** because every published lane figure was measured without it, and `pair` is how the
        # device is priced: the same hundred pull requests reviewed twice inside one dispatch, differing in this line.
        description: 'Remark pass: five lanes (off), the pass alone (on), or both arms (pair)'
        type: choice
        options: ['off', 'on', 'pair']
        default: 'off'

      second_concern:
        # **The arm R-32 registers: a defect at a site is a second comment, not a duplicate of the remark already there.**
        #
        # The run of 2026-11-16 removed **2 273 of its 2 295 merged findings under the range rule alone** - overlapping
        # ranges with no textual agreement behind the merge - and **276 of its 455 rejected goldens sat on a line it had
        # commented on**. The corpus names the case: `electron#47361` carries a use-after-free and an O(n^2) erase on one
        # line, and **a reviewer that says one true thing per site loses the second every time.**
        #
        # **Why this is a dispatch and not a paragraph.** The switch changes what the engine emits, so no cut of an
        # existing artifact can price it - `aacr-operating-point.mjs` prices cuts, and a device needs a run. `pair`
        # dispatches both sides over the same rows, the same judge and the same corpus, so the difference between the two
        # artifacts is the device and nothing else.
        description: 'Second concern at a site: merge cross-category overlaps (off), keep one (on), or both arms (pair)'
        type: choice
        options: ['off', 'on', 'pair']
        default: 'off'

      lane_set:
        # **The arm R-35 registers: the same diff, a different question asked of it.**
        #
        # Of the 1 054 goldens on the merged 146-pull-request corpus, **449 sit on a file we commented on and were judged
        # not to address them**, and only seven of those are recoverable by a better matcher (§69.4). **426 of the 1 054
        # name a boundary condition**, and the findings that name one are the ones that get accepted - precision 0.257
        # against 0.196 over the 2 438 ranked rows of three artifacts. What the five lanes produce instead is mostly the
        # **shape of the change**: *"field removed without deprecation"* where the golden says *"the `///` became `//`, so
        # the field loses its documentation"*.
        #
        # **So this switch swaps one question for another and nothing else.** `behaviour` runs the same four lanes plus a
        # lane asked *which value, state or sequence that can reach this line makes it produce something wrong*, in place
        # of the `testing` lane - which reaches this corpus's question 8.6 % of the time at precision 0.111, and whose own
        # removal gains 0.0069 F1 (§69.3). **Five calls per file either way**, so a difference between the arms is the
        # question and not the budget.
        #
        # **`pair` is how it is priced**: both lane sets over the same rows in one dispatch, so the difference between
        # the two artifacts is this line. `off` is the default because every figure in `EVAL-CONTRACT.md` was measured
        # under `shipped`, and a lane set that cannot be switched off re-prices all of them.
        # **And R-37's arm, which is the union rather than a third substitution.** R-35 measured `behaviour` *instead of*
        # `testing` and it lost (0.1973 against 0.2076, p = 0.354) - but a substitution forces a choice between two lanes
        # that are not the same device: `testing` filed 289 findings and hit 59 goldens at precision 0.158, `behaviour`
        # filed 75 and hit 24 at 0.258. **`wide` asks both and pays one more call per file**; the arithmetic then belongs
        # to the judge, which is where §69's substitution should have left it. `pair-wide` is how it is priced, and it is
        # a separate value rather than a redefinition of `pair` so that §72's figure stays reproducible from the switch
        # that produced it.
        description: 'Lane set: the five lanes every figure was measured under (off), the behaviour lane in place of testing (on), both arms (pair), the union of both (wide), or the union priced against the five (pair-wide)'
        type: choice
        options: ['off', 'on', 'pair', 'wide', 'pair-wide', 'lean', 'pair-lean']
        default: 'off'

      lane_mode:
        # **Whether the five questions are asked five times or once.** `fused` sends one prompt that asks every lane
        # its own question and asks the answer to label itself; the engine files each finding under the lane it names,
        # falling back to the category it asserted when it names none. **The claim is about money and the risk is about
        # accuracy**, so the default is the arrangement every published figure was measured under and a fused dispatch
        # is read against the same day's `separate` run rather than against history.
        description: 'Lane calls: one per lane (separate), or one call asking all of them (fused)'
        type: choice
        options: ['separate', 'fused']
        default: 'separate'

      judge_batch:
        # **How many pairs one judge call carries.** §110 priced the judge at 46 % of the bill and measured a prompt
        # cache ratio of 8.5 % against the reviewer's 52.9 % on the same day: the constant block of a judge prompt is
        # about 57 tokens and a prefix cache works in blocks of 64, so **the shared block did not exist**. A batch is
        # the device that creates it - one instruction block and one golden behind eight comments.
        #
        # **`1` is the default because the history is priced in singles.** A device that changes the instrument is not a
        # default: every figure before §111 was measured one pair at a time, and a dispatch that wants the batched arm
        # asks for it and gets an artifact that says so.
        description: 'Pairs per judge call (1 = the per-pair arm every earlier figure used, 8 = the batched arm)'
        type: string
        default: '1'

      file_semantic_judge:
        # **Which question the judge is asked, which is a second instrument rather than a second judge.**
        #
        # `Alibaba-Aone/aacr-bench/docs/metrics.md` defines `file-level-semantic-v1`: one call per file, every reference
        # comment of that file in a numbered list, and a verdict that may cover more than one of them. Every figure in
        # `docs/EVAL-CONTRACT.md` was bought from a judge shown **one pair** at a time, and §137 records what that cost:
        # of 254 reference comments whose file the reviewer did comment on, **141 sat on the same line as a finding we
        # had emitted and the pairwise judge called all 141 different defects.**
        #
        # **`off` is the default because changing the instrument is not a default.** `on` buys the second reading
        # *beside* the first - same findings, same goldens, same run, same reviewer - so one artifact carries both
        # figures and the difference between them is the protocol rather than the day. A dispatch that replaced the
        # instrument instead would make its own figure incomparable to every earlier one.
        #
        # **The second reading is also the cheaper one**, which is why it is worth asking every time: a pair-shaped
        # judge costs `findings x goldens` calls (14 892 on the corpus of 2026-11-10) and a file-shaped one costs one
        # call per file that carries both a finding and a reference comment.
        description: 'Also ask each file what a pair could not answer (off = the pairwise arm every figure used)'
        type: choice
        options: ['off', 'on']
        default: 'off'

      max_findings_per_file:
        # **The cap that turned out to be a ceiling on the work rather than a rail on the noise.** §23.7 measured 25 of
        # one run's 225 drafts refused a slot, and 74 of that run's missed goldens sitting on files it had read - so the
        # next registered hypothesis (H2) is that volume, not aim, is where half the remaining gap lives. **It is a
        # dispatch input rather than an edit**, so the arm at 3 and the arm at 6 are the same script on the same rows.
        description: 'Findings one file may carry (default 3, the lane contract; 6 is H2)'
        type: string
        default: '3'
      same_site_concerns:
        # **How many findings one *range* may keep, which is a different cap from the one above.** The per-file cap
        # truncates a file's list; this one decides whether two findings marked on overlapping lines are one remark or
        # two. R-55 removed **1 112 of its 1 646 findings under the range rule alone** - no textual agreement behind the
        # merge - and `keptAsSecondConcern` was **0**, so the goldens that sit beside a kept finding on the same range
        # were rejected with their neighbour reported.
        #
        # **`1` is the default because it is the history**, and because a cap of two would re-price every figure in the
        # tree by a device nobody registered. R-64 is the run that prices it: **the claim is on the pool's true
        # positives** (the recall ceiling rather than the emitted F1), with F1 as a guard rail - §124.2 measured that
        # ceiling at **91 of 330 goldens**, which no emission rule can raise.
        description: 'Findings one range may keep (default 1, the arm every figure was measured under; 3 is R-64)'
        type: string
        default: '1'
      provider:
        # **Which model family reviews the corpus, and the arm this input exists for.**
        #
        # §125 read three 2026 studies that agree on one shape: the defects one model finds are not the defects another
        # finds - **56.8 % of defects caught by exactly one model** (Zenodo 20519584), a cross-family Jaccard of **0.29**,
        # and a second reviewer that lifts a single reviewer's recall from **47 % to 72 %**. If that holds here, every
        # recall figure in `docs/EVAL-CONTRACT.md` is a figure about DeepSeek's blind spots rather than the reviewer's.
        #
        # **`deepseek` is the default because it is the arm those figures were measured on.** The second family reads its
        # key from `ZHIPU_API_KEY`, which is the same secret the embedding backend reads - one account pays for both, so a
        # Zhipu-only deployment does not need two credentials that must agree.
        description: 'Which model family reviews the corpus (default deepseek)'
        type: choice
        options:
          - deepseek
          - zhipu
        default: deepseek
      pull_request_budget:
        # **The emission budget, which stopped being a constant when the pool doubled.** §124.2 measured twelve as the
        # maximum of the F1 curve on the cap-1 arm; R-64 put the pool at 1 100 findings and moved that maximum to
        # **twenty**, by 0.0175 - so the budget is a device and R-67 prices the pair (cap 3, budget 20) rather than
        # either alone.
        description: 'Findings one pull request may carry (default 12; 20 is the R-67 pair)'
        type: string
        default: '12'
      promote:
        # **The switch that decides whether this dispatch may change what the product ships.**
        #
        # Off, because most dispatches are measurements and a measurement should not move the product by accident. On,
        # and the `promote` job applies `packages/intelligence/config/promotion-rule.json` to every artifact this
        # dispatch produced and, if a challenger clears the bar, rewrites
        # `packages/intelligence/config/review-defaults.json` - the file the engine's compiled defaults and the
        # harness's own arms are both read from - regenerates the module beside it, and commits both.
        #
        # **The default is off and the mechanism is not optional.** A dispatch with this off still uploads every
        # artifact, so the next dispatch can promote from them; what off prevents is a scheduled weekly run silently
        # changing the shipped reviewer because a noise draw cleared a floor.
        description: 'Promote the winning arm into the shipped configuration (off; on applies the pre-registered rule)'
        type: choice
        options:
          - 'off'
          - 'on'
        default: 'off'
      # **`code_context` used to be an input here, and its deletion is the fix rather than a tidy-up.** As an input it
      # had one value per dispatch, so measuring the device meant two dispatches - and two dispatches of this job have
      # reported the *same* configuration at 0.1691 and 0.2405, which is a spread larger than every effect registered in
      # `EVAL-CONTRACT.md`. The switch is now a matrix key, so one dispatch produces both arms over the same corpus, the
      # same goldens and the same judge. **A device whose contribution can only be measured across runs cannot be
      # measured by this instrument**, and §20.4 named this edit before R-18's number existed.
  schedule:
    # **Off-peak on purpose.** The vendor halves every price outside 01:00-04:00 and 06:00-10:00 UTC on weekdays,
    # so a weekly run at this hour costs half what the same run costs at 08:00 - and this workflow's own artifact
    # records the spend it took to produce the figure.
    - cron: '20 4 * * 2'
  # **Not this file, and as of iteration 114 not the script either.**
  #
  # A workflow's own edit used to re-run it, so fixing a trigger cost one run of the thing it triggers. Then the one
  # path left was the harness itself, on the argument that an edited harness should be exercised against the corpus.
  # **The artifact says what that cost**: the run this path triggered on 2026-11-10 read the account at 355.69 CNY
  # before and 295.10 after - **60.59 CNY, or 8.53 USD, for one push** - and the model calls this repository can see
  # in that run came to 2.64 USD. **The harness's arithmetic is now proved by `--dry-run` in CI on every push, which
  # needs no credentials and no corpus**, so the corpus run is a dispatch or the weekly schedule and nothing else.

concurrency:
  group: aacr-bench
  cancel-in-progress: false

permissions:
  contents: read

#
# **And why this job runs twice, in parallel, differing in one environment variable.**
#
# `docs/EVAL-CONTRACT.md` registers a claim before its run, and the matrix below is where the claim is turned into two
# arms over **the same pull requests, the same goldens and the same judge** - with the `compare` job, which has no
# credentials and therefore cannot call a model, computing the paired difference. **Two runs in one workflow rather than
# one run today and another next week**, because a comparison across commits is a comparison across everything else that
# changed in between.
#
# **The matrix varies the hypothesis currently under test, and that changed in iteration 124.** It used to vary
# `AACR_CHECKLIST` - the per-language defect checklist of §8 - and that device has been measured twice and falsified
# twice, so a matrix that still varied it would spend two arms and a hundred pull requests comparing a retired
# configuration. Then it varied `AACR_PROFILE`, the category floor of §19/R-17, which was falsified at +0.0079 against a
# registered +0.02 on a hundred unseen pull requests. **What it varies now is `AACR_CODE_CONTEXT`**, the code window of
# §20/R-18: one arm reads each changed file at the pull request's head commit and shows each lane the block its hunk sits
# in, the other reads only the diff. **The comparison job reads the varied field out of the two artifacts rather than
# being told it**, so the next hypothesis is a matrix edit and not a rewrite.
#
# **And this arm moved into the matrix for a reason the last one did not have.** R-17 and R-18 were both measured across
# two dispatches, and two dispatches of this job have reported the *same* configuration at 0.1691 and 0.2405 - a spread
# larger than any effect registered here. **A comparison across runs therefore cannot separate a 0.02 device from the
# job's own variance**, which is why R-18's first result is `falsified` and `inconclusive` in the same sentence, and why
# §20.4 named this edit before that number existed. One dispatch now produces both arms over the same corpus, the same
# goldens and the same judge; `compare` still has no credentials, so the arithmetic still cannot have been done by a
# model.
jobs:
  # **The arm list is computed by a function a test can call**, where a 9 223-character `include:` expression used to
  # hold twenty-six `||` branches that could each vary at most one key. That shape was forced by `variedField` in
  # `aacr-ablation-compare.mjs`, which refuses a pair of artifacts differing in more than one key - correct for a
  # subtraction, and fatal for a factorial, because a factorial is not a subtraction: its analysis is a difference of
  # means over disjoint row sets, and its rows differ in several keys by construction.
  #
  # **`window: grid` buys the `2^3` over `code_context` x `adjudicate` x `remarks`**, three devices that are
  # implemented, independent of `agent`, and each aimed at a measured defect rather than a hypothesis. Row 0 is the
  # baseline, so a grid never re-buys its own control.
  plan:
    name: Plan the arms this dispatch buys
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # **`node-version-file` rather than a scalar**, because the version gate refuses a scalar that floats: a planner
      # reading a different Node than the job it plans for would be a matrix built by one tool and run by another.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.nvmrc'
      - id: plan
        # **Every input is mapped explicitly**, because a planner that scanned `INPUT_*` by prefix would turn an
        # unrelated variable into a factor the moment one was renamed.
        env:
          INPUT_WINDOW: ${{ inputs.window || 'off' }}
          INPUT_AGENT: ${{ inputs.agent || 'off' }}
          INPUT_IDIOMS: ${{ inputs.idioms || 'off' }}
          INPUT_REMARKS: ${{ inputs.remarks || 'off' }}
          INPUT_PAIR: ${{ inputs.pair || 'off' }}
          INPUT_ENSEMBLE: ${{ inputs.ensemble || 'off' }}
          INPUT_SECOND_CONCERN: ${{ inputs.second_concern || 'off' }}
          INPUT_LANE_SET: ${{ inputs.lane_set || 'off' }}
        run: node .github/scripts/aacr-plan-matrix-cli.mjs >> "$GITHUB_OUTPUT"

  aacr-bench:
    needs: plan
    # **Both matrix keys are in the job's own name**, because a run page that shows two identical titles for two
    # different arms is a page a reader has to open artifacts to disambiguate - and the whole point of the pair is that
    # the difference is legible before anything is downloaded.
    name: Our reviews on a direct competitor's corpus (${{ matrix.profile }} profile, code context ${{ matrix.code_context }}, adjudicate ${{ matrix.adjudicate }}, idioms ${{ matrix.idioms }}, agent ${{ matrix.agent }}, remarks ${{ matrix.remarks }}, ensemble ${{ matrix.ensemble }}, second concern ${{ matrix.second_concern }}, lanes ${{ matrix.lane_set }}, change shape ${{ matrix.change_shape }})
    runs-on: ubuntu-latest
    # **Raised from 180 when the corpus went from five pull requests to fourteen**, which is the size at which a 0.04
    # move stops being a coin toss. The previous corpus took 29 minutes; the arithmetic that expects roughly three times
    # that is the only reason this number moved, and **a timeout raised because a job is close to it would hide the
    # slowdown rather than accommodate the corpus.**
    #
    # **Raised again to 340, and the arithmetic is written down rather than felt.** Fourteen pull requests took 46
    # minutes on 2026-11-10 across 1 770 reviewer calls and 4 783 judge calls - **142 calls per minute, 3.3 minutes per
    # pull request** - and two hundred pull requests at that rate is eleven hours, which does not fit in any job GitHub
    # will run. **That paragraph was right about the runner and wrong about the work**: the fourteen-pull-request run
    # cost 468 model calls per pull request and the fifty-pull-request run of 2026-11-10 cost 301, so its two arms took
    # 61.0 and 79.7 minutes - **1.22 and 1.59 minutes per pull request, not 3.3**.
    #
    # **340 was still the wrong shape, and §77.1 is the correction.** A constant is right for the run that finishes or
    # right for the one that hangs, never both: 340 admitted a 146-pull-request pair for 178 minutes of work, and it
    # also admitted run 44100493243 to spend 128 minutes inside a single step before a person read the clock and
    # cancelled it. **The slot below is 1.47 times the pair that finally ran** - 190 minutes for 146 pull requests over
    # two arms, i.e. **1.30 minutes per pull request** - and 1.08 times the slower arm's own 232.
    #
    # **It is a constant because GitHub refuses the expression.** The first version of this line was
    # `fromJSON(inputs.max_pull_requests || '146') * 2`, then `github.event.inputs` - and a dispatch answered
    # `(Line: 324, Col: 22): Unexpected symbol: '*' ... Located at position 58 within expression`. **A timeout that
    # scales with the corpus is the right shape and is not available**: `timeout-minutes` takes contexts, not
    # arithmetic. So the number is fixed at the corpus this job is dispatched with, and **175** pull requests at the
    # confirmation tolerance is what it covers - a dispatch beyond that is refused by `slicesThatFit` rather than by the
    # runner** - the arithmetic that used to
    # live here now lives in a function a test can call.
    timeout-minutes: 280
    strategy:
      # **Both arms are information.** A run that dies takes its half of the comparison with it, and `compare` has to
      # report that rather than a one-sided figure.
      fail-fast: false
      # **The two arms of the hypothesis currently registered, written as `include` so that a difference between them is a
      # variable somebody chose rather than a cross product of everything on the list.**
      #
      # **It varies `code_context` now, and `profile` is pinned to `advisory`.** R-18 (§20) was measured across two
      # dispatches and came back `falsified` on the arm it names by 0.0065 - a movement smaller than the 0.0311 that
      # slice resolves - so the difference it reported carries the run-to-run variance of this job as well as the device.
      # **Two runs of this job have reported the same configuration at 0.1691 and 0.2405**, which is larger than every
      # effect registered here; a comparison across dispatches therefore cannot settle a 0.02 claim at 36 pull requests,
      # and §20.4 named this matrix as the dispatch that could, before the number existed.
      #
      # **`profile` is pinned rather than deleted, and the reason is a measurement.** R-17's 0.22 floor was falsified at
      # +0.0079 against a registered +0.02 on 100 unseen pull requests (§19.3), so `advisory` is the default and the
      # other arm is a retired configuration. A cross product with it would double this dispatch's bill to answer a
      # question already answered, and **a matrix that varies two things answers neither**: `variedField` in
      # `aacr-ablation-compare.mjs` refuses a pair whose artifacts differ in more than one key, and it would refuse every
      # pair this job produced.
      #
      # **And it is one row rather than two when the arm under test is the agent.** The agent reads the file it needs, so
      # `code_context` is not a variable it consults: two rows would buy the same measurement twice and write two
      # artifacts whose difference is a switch neither of them read. **The rows are computed rather than filtered**, because
      # a job-level `if` cannot see `matrix` - the expansion happens before it, and a workflow that names `matrix` there
      # does not parse at all. That is not a preference: the dispatch this replaced was refused with
      # *"Unrecognized named-value: 'matrix'"* and the workflow did not load until the expression moved here.
      #
      # **It varied `adjudicate` from iteration 141, and it varies `idioms` now.** The pin on `code_context` is a
      # decision rather than tidying:
      # §20/R-18 measured the code window at −0.0065 against a registered +0.02 and left it `falsified`, so the two arms
      # below are the reviewer without a window - the configuration every published lane figure was measured under - and
      # the only difference between them is whether a finding's claim is checked before it is filed. **A matrix that
      # varied both would answer neither**, which is the refusal `aacr-ablation-compare.mjs` already encodes.
      # **Every row carries all four keys, including the ones it does not vary.** A row that omitted `idioms` would
      # reach the script as `undefined`, and `AACR_IDIOMS` would then be set by a workflow whose matrix did not record
      # it - the one arrangement in which the artifact and the dispatch can disagree about which reviewer produced the
      # figure. **The two experiments never run in one dispatch**: `adjudicate` is a retired device kept as an ablation
      # reference and `idioms` is the arm R-21 registered, and a matrix that varied both would answer neither - which is
      # the refusal `aacr-ablation-compare.mjs` already encodes as `variedField`.
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      # **The arithmetic, before the money.** `--dry-run` runs ranking, matching, the curve and the paired test over a
      # six-finding fixture whose expected figures are written in the script, and exits without writing an artifact or
      # calling a provider. **A benchmark job whose maths is unverified until the day it produces a quotable number is a
      # job that spends a thousand calls to test its own arithmetic for the first time in a report.**
      - name: Prove the measurement's arithmetic without the model
        run: node .github/scripts/aacr-bench.mjs --dry-run

      # **The competitor this job now scores beside us, installed from its own registry entry.**
      #
      # **The first run of the second reviewer reported `spawnSync ocr ENOENT` five times**, which is **the honest way
      # to be missing a tool and the reason `firstFailure` exists as a field.** **A reviewer that cannot be invoked
      # contributes zero findings and reads as a silent one** - and **the difference between those two is a field, not
      # a footnote.**
      - name: Install the competitor whose corpus this is
        run: |
          set -e
          # **Pinned, because the figure this job publishes is a comparison and an unpinned competitor moves under it.**
          # 1.13.8 is the version every published AACR figure in this repository was measured against - the install step
          # prints its own version on the next line, so a bump is a visible change to the comparison rather than a
          # silent one. Bumping it means re-running the pairing, not just this job.
          npm install -g @alibaba-group/open-code-review@1.13.8
          command -v ocr
          ocr --version

      # **A direct competitor's corpus, published under Apache-2.0 with three context levels, the third of which is
      # Repo Level** - so **it measures cross-file behaviour, which is the claim this project makes for itself.**
      - name: Clone the benchmark
        if: inputs.dataset != 'martian'
        run: |
          set -e
          git clone --depth 1 https://github.com/alibaba/aacr-bench /tmp/aacr-bench
          echo "cloned at $(git -C /tmp/aacr-bench rev-parse HEAD)"
          find /tmp/aacr-bench -name '*.json' | head -10

      # **The other answer key, counted out loud before it is scored against.** The figure this run produces will be
      # compared with nineteen published ones, so **the log has to show which key it was**: fifty pull requests, one
      # hundred and seventy-three golden comments, and the three profile counts upstream publishes. **A corpus that is
      # the wrong size is a comparison nobody can make**, and this step is where that is said rather than discovered
      # three hours later in a delta.
      - name: Rebuild the answer key and refuse to score a stale one
        if: inputs.dataset == 'martian'
        run: |
          set -e
          npm run -s corpus:martian
          # **The committed corpus must be exactly what the builder produces from the committed raw files.** A figure
          # compared with nineteen published ones is only a comparison if the key is the key, and the two files can drift
          # while both look plausible - a category renamed, a row dropped by a filter. `--exit-code` is the whole gate.
          git diff --exit-code -- benchmarks/martian/positive_samples.json

      # **No `|| true`, and no fallback.** **A corpus that is not there fails the job**, because **a green run with no
      # data is the failure mode this repository has three rules about.**
      - name: Review the corpus with our engine
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # **The token the diff requests are made with, and the reason the two arms of the last run read different
          # corpora.**
          #
          # `fetchPrDiff` has read `GITHUB_TOKEN` since iteration 118 - and **this step never passed it**, so every
          # fifty-pull-request arm fetched its diffs unauthenticated: sixty requests an hour, shared by whichever arms
          # happened to be running from the same runner range. The `with` arm read forty-six of fifty and the artifact
          # recorded `"51 requests left in the hour and the request was unauthenticated"` four times. **A variable the
          # code reads and the job does not set is a default nobody chose.**
          #
          # **`github.token` rather than a PAT**: it is scoped to this repository, it expires with the job, and reading
          # a public pull request's diff needs nothing more than `contents: read`, which is the permission this workflow
          # already declares. The rate limit goes from sixty an hour to a thousand per repository.
          GITHUB_TOKEN: ${{ github.token }}
          MARTIAN_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MARTIAN_BASE_URL: https://api.deepseek.com/v1
          MARTIAN_MODEL: deepseek-chat
          AACR_DIR: ${{ inputs.dataset == 'martian' && format('{0}/benchmarks/martian', github.workspace) || '/tmp/aacr-bench' }}
          # **And the artifact says which key it was scored on**, because a figure's corpus is part of the figure: the
          # two keys share the runner and the judge and share nothing else, and a delta between them would be a delta
          # between two corpora.
          AACR_CORPUS_LABEL: ${{ inputs.dataset == 'martian' && 'withmartian/code-review-benchmark (MIT, 50 PRs, 173 goldens)' || 'Alibaba-Aone/aacr-bench (Apache-2.0, public on Hugging Face)' }}
          # **`MAX_PRS` is the corpus size the registration was written against**, and the slice below is where it
          # starts.
          MAX_PRS: ${{ inputs.max_pull_requests || '14' }}
          # **And where the slice starts**, so a confirmation run and its discovery never share a row.
          AACR_SKIP_PRS: ${{ inputs.skip_pull_requests || '0' }}
          # **The checklist is off in both arms**, because it is retired: two paired runs put it 12 and then 13 goldens
          # behind the prompt without it, and §16.2 measured it at −0.0237 with the corpus at fifty. **A device that has
          # been falsified twice does not get a third arm by default** - it gets a registration, and this one has none.
          AACR_CHECKLIST: 'off'
          # **What this arm may spend, in USD.** The reviewer is given a ledger and a ceiling, so **a retry storm or a
          # corpus that grew by an order of magnitude stops at a stated number instead of at the account's balance** -
          # which is what happened on 2026-11-09, when four ad-hoc runs of this job spent most of a day's credit and the
          # only record of it was a balance that had moved. **The ceiling is an input so a larger corpus can raise it
          # deliberately**, and the artifact records the number the run was bounded by.
          #
          # **The ceiling is no longer computed here, and that is the point.**
          #
          # It used to be `5` for a replaying run and `12` for a recording one - two constants written for fourteen
          # pull requests. **Then `max_pull_requests` became an input**, and a fifty-pull-request run - about 2.3 USD by
          # the same rate - would have been admitted by a bound that was never about it. **A ceiling that does not move
          # with the work is a comment, not a bound**, so the arithmetic now lives in `.github/scripts/lib/run-config.mjs`
          # where a unit test can call it, and it scales with the corpus the dispatch asked for. **Only a `record` run
          # needs an override**, because buying the competitor's arm is a decision this workflow makes and not one the
          # rate can infer; everything else lets the script compute its own bound and record it in the artifact.
          AACR_MAX_USD: ${{ inputs.competitor == 'record' && '12' || '' }}
          # **The experimental variable, passed through and recorded.** A run that does not name an order gets the
          # default the code was written with, and the artifact's `configuration.promptOrder` says which one ran - so
          # two artifacts can be compared without anyone remembering what the default was that week.
          AACR_PROMPT_ORDER: ${{ inputs.prompt_order || 'boilerplate-first' }}
          # **The experimental variable, and the only one this matrix varies.** Read from `matrix.code_context` rather
          # than from a dispatch input, because **an input would be one value chosen once and given to both arms** - which
          # is exactly the arrangement that made R-18 a comparison across two dispatches. The artifact's
          # `configuration.codeContext` and this line cannot disagree: there is one place to write `on`.
          AACR_CODE_CONTEXT: ${{ matrix.code_context }}
          # **The arm under test**, read from the matrix rather than from a dispatch input, because an input is one value
          # chosen once and given to both arms - the arrangement that made R-18 a comparison across two dispatches and
          # this repository's own variance larger than the effect it was trying to see.
          AACR_ADJUDICATE: ${{ matrix.adjudicate }}
          # **And whether the diff's own verdict is computed before the gate is asked** (§79). Read from the matrix for
          # the reason every arm here is: an input would be one value chosen once and given to both arms, which is the
          # arrangement that made R-18 a comparison across two dispatches rather than inside one.
          AACR_CHANGE_SHAPE: ${{ matrix.change_shape }}
          # **And whether the lanes are told what each changed file reaches** (§101). A dispatch input rather than a
          # matrix dimension, because this arm is being measured for the first time: **a pair costs two full runs and a
          # device whose price is not yet known is bought once** - the second one is the confirmation, and it is a
          # dispatch somebody has to read the first artifact before making.
          AACR_REACH: ${{ inputs.reach || 'off' }}
          # **The profile the artifact will record**, passed explicitly rather than left to the script's default, so the
          # workflow and the artifact cannot disagree about which reviewer produced the figure.
          AACR_PROFILE: ${{ matrix.profile }}
          # **The arm itself**, passed explicitly for the same reason as the two above: the artifact and the workflow
          # cannot disagree about which reviewer produced the figure. The agent reads a checkout of the pull request's
          # head commit and ignores `AACR_CODE_CONTEXT` - it does not need a window when it can open the file.
          AACR_AGENT: ${{ matrix.agent }}
          # **The deterministic lane**, passed explicitly for the same reason: the artifact's `configuration.idioms`
          # names the rules that ran, and a run whose workflow and artifact disagreed about whether they ran would be a
          # figure with two configurations.
          AACR_IDIOMS: ${{ matrix.idioms }}
          # **The model-driven remark pass, R-25's arm.** R-21 measured the six deterministic rules at +0.0148 against a
          # registered +0.02, and §47.1 says why a fixed list cannot get there: **the bucket is a vocabulary rather than
          # six constructs**. This switch buys one call per file whose contract is that vocabulary, with the patch's
          # added lines as the only place it may speak - and it is read from the matrix for the same reason every other
          # arm is, so the artifact and the workflow cannot disagree about which reviewer produced the figure.
          AACR_REMARKS: ${{ matrix.remarks }}
          AACR_SECOND_CONCERN: ${{ matrix.second_concern }}
          AACR_LANE_SET: ${{ matrix.lane_set }}
          # **One call for five questions, or five.** §106.7's ledger is five almost equal lane bills over one diff -
          # 1.46 M, 1.36 M, 1.36 M, 1.34 M and 1.34 M prompt tokens - and the block they all contain is the price this
          # switch removes. **On one 8 000-character diff the five prompts are 68 111 characters and the fused prompt is
          # 14 944**, which is the arithmetic R-47 registered; what the switch may cost in accuracy is what the run is
          # for. It is not a matrix key because a pair here would double a bill to answer a question whose token side is
          # already exact, and a diagnostic arm beside the same day's `separate` run is what the claim is read against.
          AACR_LANE_MODE: ${{ inputs.lane_mode || 'separate' }}
          # **The judge's call shape, which the artifact records beside the reviewer's.** Passed explicitly so a
          # dispatch cannot produce a figure whose instrument is only in the script's default; the script rejects a value
          # that is not a positive integer rather than falling back, because a run labelled `8` that bought singles would
          # be a comparison against the wrong history.
          AACR_JUDGE_BATCH: ${{ inputs.judge_batch || '1' }}
          # **The second question, and the only difference between this run and a pairwise one.** Passed as `1`/`0`
          # rather than as the choice's own words because the script refuses any value that is not one of those two -
          # a run labelled `on` that silently bought the pairwise arm would be a figure under the wrong instrument, and
          # a mapping here keeps that refusal about the variable rather than about the dispatch form.
          AACR_FILE_SEMANTIC_JUDGE: ${{ inputs.file_semantic_judge == 'on' && '1' || '0' }}
          # **The merge of the two reviewers**, read from the matrix for the same reason as every other arm: the artifact
          # and the workflow cannot disagree about which reviewer produced the figure. Off means the arm reviewed with one
          # reviewer, which is what every figure before §56 was measured under.
          AACR_ENSEMBLE: ${{ matrix.ensemble }}
          # **The cap on findings per file, which §23.7 measured to bind rather than to protect.** On `43176459822` the
          # arm filed 225 drafts and kept 196 - **25 were refused a slot, not found wanting** - while 74 goldens it missed
          # sat on files it read and said nothing about. Three per file is inherited from the lanes, where three slots per
          # file per lane *was* the emission contract; **an input rather than a constant, so a run at 6 and a run at 3 on
          # the same rows differ in this line and in nothing else**, and the artifact records which produced the figure.
          AACR_MAX_FINDINGS_PER_FILE: ${{ inputs.max_findings_per_file || '3' }}
          # **The per-range cap, beside the per-file one and for the same reason**: the two are separate decisions and a
          # run that recorded one and applied the other would be an artifact about a reviewer nobody dispatched.
          # **Which family the lanes run on**, recorded in the artifact as `configuration.provider` so two runs that
          # differ only in this field can be read as the two reviewers they are.
          AACR_PROVIDER: ${{ inputs.provider || 'deepseek' }}
          # **The second family's key.** Passed unconditionally rather than behind an `if`, because a secret that is
          # absent is an empty string and the provider refuses at construction with the name of the variable - which is a
          # clearer failure than a lane that silently ran on the default family while the artifact said `zhipu`.
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          AACR_SAME_SITE_CONCERNS: ${{ inputs.same_site_concerns || '1' }}
          # **The emission budget, beside the two caps it interacts with**: the per-site cap decides what enters the
          # ranking and this one decides how much of the ranking a reviewer sees, and §126.4 measured them moving
          # together.
          PR_BUDGET: ${{ inputs.pull_request_budget || '12' }}
          # **Whether this run buys a competitor result, or reads the one already paid for.** The script's own default
          # is `replay`; it is passed explicitly here so the artifact cannot disagree with the workflow about which run
          # produced it, and so a manual `record` is a line in the log rather than an environment variable someone set.
          #
          # **And only one arm records.** The matrix runs this job twice, differing in `code_context`; the competitor is
          # the same measurement in both, so a `record` dispatch that let both arms record would buy the 5.89 USD arm
          # twice and write two files whose only difference is which arm's artifact carried them. **The `off` arm
          # records**, because the recorded baseline is the configuration every published figure was measured under, and
          # a baseline bought by the arm under test would make the competitor's operating point depend on the device
          # being measured.
          AACR_COMPETITOR: ${{ inputs.competitor == 'record' && matrix.code_context == 'off' && 'record' || inputs.competitor == 'record' && 'off' || inputs.competitor || 'replay' }}
          # **And the second reviewer's own configuration**, pointing at the same provider the judge uses - so
          # **the reviewer and the judge are the same model, which is requirement 2 satisfied by construction.**
          OCR_LLM_URL: https://api.deepseek.com/anthropic
          OCR_LLM_TOKEN: ${{ secrets.DEEPSEEK_API_KEY }}
          OCR_LLM_MODEL: deepseek-chat
        run: node .github/scripts/aacr-bench.mjs

      # **The artifact proves its own figure before it is uploaded, and the proof is a program rather than a paragraph.**
      #
      # `scripts/aacr-paired-replay.mjs --check` recomputes the published precision, recall and F1 from the rows beside
      # them, with no model and no network, and **exits non-zero when the rows do not support the figure**. Iteration 122
      # shipped the script and wrote the claim in a document; **the claim was in the document and the script was in no
      # job**, so the one thing that could have caught a figure drifting from its rows ran only when a person remembered
      # to run it - which is the definition of a check that is not one. **`Lint & Format` said so on the next push**
      # (`scripts/aacr-paired-replay.mjs: no workflow names it`), which is the wiring gate doing its job on the same day
      # the omission was made.
      #
      # **It runs here rather than in `compare`** because this is the job that produced the file: a run whose artifact
      # does not replay to its own figure is a run that must fail before the artifact is published, not after two arms
      # have been compared on it. **No `|| true`**: a refusal is the output.
      - name: Prove the artifact replays to its own figure
        run: |
          set -e
          node scripts/aacr-paired-replay.mjs --check

      # **The score is not the only figure an artifact publishes any more.** Iteration 124 added the full attribution
      # list, the per-category decomposition of the true positives, and the goldens neither reviewer found - and **a
      # breakdown computed by a second rule can disagree with the figure it decomposes while both numbers are plausible**.
      # The first draft of the category table did exactly that: it counted findings that matched a golden and reported 73
      # where the run scored 39, because one golden mentioned by three lanes is one true positive and three matches.
      #
      # **It fails here rather than in `compare`** for the same reason the step above does: a run whose own detail layers
      # do not add up must fail where it produced them, before the artifact is published and before two arms are compared
      # on it. **No `|| true`**: a refusal is the output.
      - name: Prove the artifact's detail layers add up
        run: |
          set -e
          node scripts/aacr-bench-audit.mjs --check

      # **The ensemble dimension is in the name, and the first run of the merge is why.** That run published
      # `...-adjudicate-off-idioms-off-agent-on-ensemble-off-remarks-off`, the name an agent-only run uses - **two
      # devices, one artifact name**, and a paired comparison matching on names would have compared an arm with itself.
      # **Only a run that reached the end publishes a figure.** `always()` was here so that a skipped run - no corpus, no
      # credential - would still upload its marker, and that part is still true: those runs exit zero. What it also did
      # was copy `benchmarks/aacr-bench.json` on a run that died mid-review, **and that path is a tracked file**, so the
      # artifact it published was the previous run's figure under this run's arm name (§58.1). The script now clears the
      # path before the first request; this condition is the second half of the same guarantee.
      - name: Upload the figure
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          # **Every matrix key is in the name**, because a pair of artifacts whose names differ in one segment is a pair
          # a reader can match to the arms without opening either - and because `an-artifact-that-is-never-uploaded-is-
          # never-downloaded.test.ts` expands this name from the matrix and refuses a download nothing uploads.
          name: aacr-bench-${{ matrix.profile }}-${{ matrix.code_context }}-${{ matrix.adjudicate }}-${{ matrix.idioms }}-${{ matrix.agent }}-${{ matrix.ensemble }}-${{ matrix.remarks }}-${{ matrix.second_concern }}-${{ matrix.lane_set }}-${{ matrix.change_shape }}
          # **The figure and the competitor's whole output**, because **that output's format is what the next
          # iteration has to read** and **a field cannot hold a document**.
          path: |
            benchmarks/aacr-bench.json
            benchmarks/aacr/competitor-baseline.json
            benchmarks/runnable-competitors-outputs/
          if-no-files-found: warn
          retention-days: 90

  # **The comparison, computed where no model can be called.**
  #
  # This job downloads the two artifacts and does arithmetic on them. It has no `secrets.`, no provider endpoint and no
  # corpus checkout, so **the number it produces cannot have been produced by a model** - which is the property a
  # comparison needs and a benchmark arm does not have.
  compare:
    name: The two runs, paired
    needs: aacr-bench
    runs-on: ubuntu-latest
    # **A single-row matrix has no counterpart, so this job does not run for it.** The agent arm collapses the matrix
    # to one row because `code_context` is not a switch it consults, and the first dispatch under that shape failed
    # here - at `Download the run without it`, looking for an artifact the matrix never produced. **The job that
    # reports a comparison is not the job that should discover there is nothing to compare**: a dispatch whose whole
    # purpose is one arm should end green with its figure, and a run of this job over one row would compute a
    # difference between an arm and nothing.
    #
    # **And it must fire for the merge arms, which it did not.** The gate listed four inputs and `ensemble` was not one
    # of them, so R-30's dispatch bought two arms and would have ended without a comparison - **the job whose output is
    # the thing the run was dispatched for was skipped, and the run still looked complete.**
    if: (inputs.window || 'off') == 'pair' || (inputs.agent || 'off') == 'pair' || (inputs.remarks || 'off') == 'pair' || (inputs.ensemble || 'off') == 'pair' || (inputs.ensemble || 'off') == 'pair-reader' || (inputs.second_concern || 'off') == 'pair' || (inputs.lane_set || 'off') == 'pair' || (inputs.lane_set || 'off') == 'pair-wide' || (inputs.lane_set || 'off') == 'pair-lean' || ((inputs.agent || 'off') != 'on' && ((inputs.pair || 'off') == 'on' || (inputs.pair || 'off') == 'falsifier' || (inputs.pair || 'off') == 'falsifier-v2' || (inputs.pair || 'off') == 'falsifier-v3' || (inputs.pair || 'off') == 'change-shape' || (inputs.pair || 'off') == 'falsifier-v4' || (inputs.idioms || 'off') == 'pair'))
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc

      # **The arithmetic before the answer**, for the same reason the bench job has `--dry-run`: this script's
      # "no effect" branch is the branch a device that does nothing would take, and **a comparison whose null branch is
      # wrong reports null results that read as science.**
      - name: Prove the comparison's arithmetic on fixtures
        run: node .github/scripts/aacr-ablation-compare.mjs --self-test

      # **The arm under test goes in `/tmp/with`, and the direction is load-bearing rather than stylistic.** The
      # comparison script reads `with` as the side that has the device and `without` as the side that does not, and its
      # registrations name a sign: R-18 asks the pull-request arm to *rise*. Swapping these two paths would report the
      # same experiment with every gain negated, and **the artifact would be internally consistent while saying the
      # opposite**, which is the one failure no gate in this job can see.
      # **Two names, one of them taken, and both written out rather than computed.** A single step whose name depended on
      # which input chose the arm would be a name no test can expand and no reader can check against the matrix; two
      # steps with literal names and complementary conditions are checkable by both, and only one of them ever runs.
      - name: Download the run with the claim check
        # **And not on a merge dispatch either.** This step downloads the code-window arm's name, and a merge dispatch's
        # matrix does not produce it - so the comparison would have failed here, after both arms had been paid for.
        # **`pair` and `lane_set` were the two inputs missing from this list**, and the omission cost R-35 its
        # comparison: the step fired on a `lane_set: pair` dispatch, downloaded an arm that matrix never produced, and
        # failed the job whose output was the whole point of the run - after both 146-pull-request arms were paid for.
        # **`pair: on` deliberately stays out of the list**: that dispatch's matrix is the claim check switched on beside
        # the baseline, so this is the step that fetches its arm - the retired device kept as an ablation reference.
        # **The list is checked by evaluation rather than by reading it** (`fires, on every pair dispatch, only the
        # downloads that dispatch uploaded`), because a guard written by extension is a guard that will be extended
        # wrong again.
        if: (inputs.idioms || 'off') != 'pair' && (inputs.agent || 'off') != 'pair' && (inputs.window || 'off') != 'pair' && (inputs.remarks || 'off') != 'pair' && (inputs.ensemble || 'off') != 'pair' && (inputs.ensemble || 'off') != 'pair-reader' && (inputs.second_concern || 'off') != 'pair' && (inputs.lane_set || 'off') != 'pair' && (inputs.lane_set || 'off') != 'pair-wide' && (inputs.lane_set || 'off') != 'pair-lean' && (inputs.pair || 'off') != 'falsifier' && (inputs.pair || 'off') != 'falsifier-v2' && (inputs.pair || 'off') != 'falsifier-v3' && (inputs.pair || 'off') != 'change-shape' && (inputs.pair || 'off') != 'falsifier-v4'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: aacr-bench-advisory-off-on-off-off-off-off-off-shipped-off
          path: /tmp/with

      # **And the keep-by-default gate's arm, which is R-36's device side.** A `pair: falsifier` dispatch uploads the
      # lanes as they ship and the same lanes behind a gate that can only remove what it can quote; this step takes the
      # second as the device side, so the comparison's sign is the one the registration states. **It is a step of its own
      # rather than a second value accepted by the one above**, because the two arms have different names and a step
      # whose condition matched both would download one arm twice under two different titles.
      - name: Download the run with the falsifier gate
        if: (inputs.pair || 'off') == 'falsifier'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: aacr-bench-advisory-off-falsifier-off-off-off-off-off-shipped-off
          path: /tmp/with

      # **And the second contract's arm.** §74 falsified the first one on its own evidence: of 277 removals that could
      # have reached a reviewer, 69 were true positives against a pool rate of 21.3 %, and every sampled removal quoted a
      # line inside the claim it attacked. `falsifier-v2` removes the claim's own range from the quotable set, so the
      # only thing that can refute a sentence is the rest of the change. **It is a separate input value rather than a
      # change to the first**, because a run that redefined `falsifier` would make §73's figure unreproducible.
      - name: Download the run with the independent-evidence gate
        if: (inputs.pair || 'off') == 'falsifier-v2'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: aacr-bench-advisory-off-falsifier-v2-off-off-off-off-off-shipped-off
          path: /tmp/with

      # **And the arm whose gate is told which lines the change actually wrote** (§79). `pair: change-shape` buys the
      # second contract as it ships and the same contract with the classifier switched on, and the comparison takes the
      # second as the device side - so the sign answers whether a finding standing on lines the change did not write was
      # ever a finding. **The name is a step of its own for the reason every arm here is one**: two arms, two names, and
      # a step whose condition matched both would download one arm twice under two titles and lose the other.
      - name: Download the run whose gate knows which lines the change wrote
        if: (inputs.pair || 'off') == 'change-shape'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: aacr-bench-advisory-off-falsifier-v2-off-off-off-off-off-shipped-on
          path: /tmp/with

      # **The third contract, and the one that has somewhere else to look.** `v2` removed 169 claims on 146 pull requests
      # and left 148 behind because the only quotable line lay inside the claim's own range - a hunk of three lines
      # carries no independent evidence about those three lines. `v3` adds the file's untouched lines around each claim
      # to the evidence, so the guard forty lines above the change can refute a sentence about the change.
      - name: Download the run with the gate that reads the file around its claims
        if: (inputs.pair || 'off') == 'falsifier-v3'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: aacr-bench-advisory-off-falsifier-v3-off-off-off-off-off-shipped-off
          path: /tmp/with

      # **And the contract whose second block is an index rather than a window** (§80). §78 bought 6 000 characters of
      # surrounding lines and returned −0.0022; `v4` keeps the same evidence rule and hands the reader the file's export
      # surface, the declaration each claim stands in and the guards inside it - 600 characters, and every one of them
      # about the claim. **It is a separate input value rather than a change to `v3`**, because §78's figure has to stay
      # reproducible from the switch that produced it.
      - name: Download the run whose gate reads the file as an index
        if: (inputs.pair || 'off') == 'falsifier-v4'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: aacr-bench-advisory-off-falsifier-v4-off-off-off-off-off-shipped-off
          path: /tmp/with

      - name: Download the run with the idiom lane
        if: (inputs.idioms || 'off') == 'pair'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: aacr-bench-advisory-off-off-on-off-off-off-off-shipped-off
          path: /tmp/with

      # **Every artifact name here is produced by the matrix above, and a job that downloads a name the matrix does not
      # produce fails at this step rather than at the comparison.** This one said `aacr-bench-defectout` for two
      # iterations - the name that `without` became when the matrix was renamed by substitution - so the fifty- and
      # hundred-pull-request runs both spent their money, uploaded both artifacts, and then failed here, which is the
      # only step whose output is the thing the run was dispatched for.
      # **The control's own arm, named literally like the rest.** A `window: pair` dispatch uploads
      # `...-on-off-off-off` and `...-off-off-off-off`; this step takes the first as the device side, so the comparison's
      # sign is the one the registration states - the window is the *with* side.
      - name: Download the lanes with the code window
        if: (inputs.window || 'off') == 'pair'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: aacr-bench-advisory-on-off-off-off-off-off-off-shipped-off
          path: /tmp/with

      - name: Download the reading agent's run
        if: (inputs.agent || 'off') == 'pair'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: aacr-bench-advisory-off-off-off-on-off-off-off-shipped-off
          path: /tmp/with

      # **And the remark pass's own arm, R-25's device side.** It is the arm that answers §47.1's bucket - 386 of 724
      # goldens had a finding of ours on their path and were still judged not to address them - with one call per file
      # whose contract is a remark vocabulary rather than a defect checklist.
      - name: Download the run with the remark pass
        if: (inputs.remarks || 'off') == 'pair'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: aacr-bench-advisory-off-off-off-off-off-on-off-shipped-off
          path: /tmp/with

      # **And the second-concern arm, which is §59's device side and the only arm whose two sides differ in one key.**
      # A `second_concern: pair` dispatch uploads the lanes as they ship and the lanes with the range rule's
      # cross-category overlap kept; this step takes the second as the device side, so the comparison's sign is the one
      # the registration states - **F1 has to rise**.
      - name: Download the run with the second concern
        if: (inputs.second_concern || 'off') == 'pair'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: aacr-bench-advisory-off-off-off-off-off-off-on-shipped-off
          path: /tmp/with

      # **And the behaviour lane's arm, which is R-35's device side and the only arm whose two sides ask a different
      # question of the same diff.** A `lane_set: pair` dispatch uploads the five lanes every published figure was
      # measured under and the same four plus the lane asked for the value that breaks a line; this step takes the
      # second as the device side, so the comparison's sign is the one the registration states - **F1 has to rise**.
      # **And the union's arm, which is R-37's device side.** `lane_set: pair-wide` uploads the five lanes as they ship
      # and the same lanes plus `behaviour`, so the difference between the two artifacts is one call per file - and the
      # comparison's sign is the one the registration states. **A separate step rather than a second condition on the one
      # below**, because a step whose condition matched both values would download one arm twice under two titles.
      # **And the set the corpus does not score, which is the only arm here that is expected to cost less and score
      # the same.** `lane_set: pair-lean` uploads the five lanes as they ship and the same four without `testing`, whose
      # 152 `test`-category findings reached a judge zero times on two artifacts because `drop test` is the first step of
      # the cut. **A device that removes a fifth of the bill and nothing else is priced by its token count as much as by
      # its F1**, and the comparison job reports both.
      - name: Download the run with the lean lane set
        if: (inputs.lane_set || 'off') == 'pair-lean'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: aacr-bench-advisory-off-off-off-off-off-off-off-lean-off
          path: /tmp/with

      - name: Download the run with the wide lane set
        if: (inputs.lane_set || 'off') == 'pair-wide'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: aacr-bench-advisory-off-off-off-off-off-off-off-wide-off
          path: /tmp/with

      - name: Download the run with the behaviour lane
        if: (inputs.lane_set || 'off') == 'pair'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: aacr-bench-advisory-off-off-off-off-off-off-off-behaviour-off
          path: /tmp/with

      # **The arm without the device, and for one pair it is not the arm without a gate.**
      #
      # Every falsifier pair varies the gate against no gate, so `without` was the bare reader and this step had no
      # condition. `pair: change-shape` varies the *shape* with the gate held at `falsifier-v2` on both sides, so the
      # arm it must be compared with is the one with the gate and without the classifier - and the dispatch of
      # 2026-11-18 ended red at this step, after both arms had been paid for, because the job asked the matrix for an
      # artifact the matrix never built. **The comparison the run was dispatched for was the only thing it did not
      # produce.**
      - name: Download the run without it
        if: (inputs.pair || 'off') != 'change-shape'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: aacr-bench-advisory-off-off-off-off-off-off-off-shipped-off
          path: /tmp/without

      # **And for `change-shape`, the same gate on both sides, differing only in whether the diff was read first.**
      - name: Download the run whose gate was not told what the change wrote
        if: (inputs.pair || 'off') == 'change-shape'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: aacr-bench-advisory-off-falsifier-v2-off-off-off-off-off-shipped-off
          path: /tmp/without

      # **And the merge's own arm, which is the one R-29 could not be.** The registration named a merge of the five lanes
      # and the reading reviewer; that dispatch had the lanes emptied by the cost rule, so `merge.candidates` was one
      # reviewer's worth and the union was never formed. This pair dispatches both configurations over the same rows -
      # same slice, same judge, same model - so the difference between the artifacts is the merge, and `merge.sides`
      # says whether the union it merged was really a union.
      # **The merge's comparator is the lanes, and it is the same artifact every other pair compares against**, so it is
      # downloaded once by the unconditional step below rather than a second time here with a duplicate name - **two
      # downloads of one name is how `downloads` and `uploads` came to disagree**, which is the failure this file's
      # sibling test exists for.
      - name: Download the run with the merge
        if: (inputs.ensemble || 'off') == 'pair'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: aacr-bench-advisory-off-off-off-on-on-off-off-shipped-off
          path: /tmp/with

      # **And the reader's own arm for `pair-reader`**, which is the one-sided device with its own name. The lanes side is
      # the unconditional download below: it is the same artifact every other pair compares against.
      - name: Download the reader-only merge
        if: (inputs.ensemble || 'off') == 'pair-reader'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: aacr-bench-advisory-off-off-off-on-reader-off-off-shipped-off
          path: /tmp/with

      # **No `|| true` and no fallback**: the script refuses to compare two artifacts that are not the same experiment,
      # and a refusal is written into the artifact rather than swallowed. A missing artifact fails the job here, which
      # is the correct outcome - **a comparison of one run is not a comparison.**
      - name: Compare them, paired
        run: |
          set -e
          node .github/scripts/aacr-ablation-compare.mjs /tmp/with/aacr-bench.json /tmp/without/aacr-bench.json

      # **A cut is arithmetic over verdicts the artifacts already carry, so it costs nothing to print here.** The pair
      # above answers "did the arm move the run"; this answers "how much of what the run said survives each registered
      # cut", on the same verdicts, in the same job. Reading it afterwards would need the artifact and a hand-run
      # command, which is how the cut for a published figure became a decision nobody could re-open.
      - name: What does each registered cut score on these verdicts?
        run: |
          set -e
          node scripts/aacr-operating-point.mjs --bench /tmp/with/aacr-bench.json
          node scripts/aacr-operating-point.mjs --bench /tmp/without/aacr-bench.json

      - name: Upload the comparison
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: aacr-ablation-paired
          path: benchmarks/aacr-ablation-paired.json
          if-no-files-found: warn
          retention-days: 90

  # **The factorial, priced as a factorial** (§129). `compare` answers "did this device move the figure" by subtraction,
  # and a `2^k` design has no pair to subtract: no two of its arms differ in one key, so every pair `variedField` would
  # accept is a pair the design does not contain. The answer a grid gives is **a difference of two means over disjoint
  # row sets**, which is what this job computes - three devices priced in one dispatch instead of three iterations, each
  # of which cost more than the instrument could resolve.
  #
  # **It is a job of its own rather than a branch of `compare`**, because the two read different numbers of artifacts by
  # different mechanisms: `compare` downloads two named arms, and this one takes every artifact the bench job uploaded.
  grid-compare:
    name: The grid, priced as a factorial
    needs: aacr-bench
    if: (inputs.window || 'off') == 'grid'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.nvmrc'

      # **Every arm, each in its own directory.** `merge-multiple` is left off on purpose: eight `aacr-bench.json` files
      # written into one folder would leave whichever finished last, and **the report would then describe one arm eight
      # times** - an artifact internally consistent and about a dispatch that never ran, which is the §58.1 shape this
      # job exists to avoid.
      - name: Download every arm the plan bought
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: aacr-bench-*
          path: /tmp/arms

      # **The arithmetic before the answer**, for the same reason the bench job has `--dry-run`: this script's "no
      # effect" branch is the branch a device that does nothing would take.
      - name: Prove the readback's arithmetic on fixtures
        run: node .github/scripts/aacr-grid-compare.mjs --self-test

      - name: Read the factorial
        run: |
          set -e
          node .github/scripts/aacr-grid-compare.mjs /tmp/arms/* --out /tmp/aacr-grid.json | tee /tmp/aacr-grid.md

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: aacr-grid-report
          path: |
            /tmp/aacr-grid.json
            /tmp/aacr-grid.md
          if-no-files-found: warn
          retention-days: 90

  # **The join between the experiment and the product, and the reason it is a job rather than a paragraph.**
  #
  # Three iterations produced figures and every one of them ended in a markdown table: a device that measured to help
  # reached the engine only if a person made the edit, and a device that measured to hurt stayed in the engine until a
  # person made the opposite edit. **Both are the same defect** - the experiment and the product were two places and
  # nothing joined them - and this job is the join.
  #
  # **It cannot promote by accident, and it cannot promote nothing.** `packages/intelligence/config/promotion-rule.json`
  # is read from the repository rather than from this file, so the acceptance criteria are reviewed like code; the
  # promoter refuses on ten named conditions, each with its own arm in
  # `tests/unit/scripts/a-promotion-that-cannot-be-justified-is-refused.test.ts`; and the baseline it compares against is
  # an arm of *this dispatch*, so a promotion never compares a figure against a remembered figure.
  promote:
    name: Promote the winning arm into the shipped configuration
    needs: aacr-bench
    # **Only on a dispatch that asked, and only on a dispatch that produced artifacts.** `always()` would run this job
    # after a cancelled benchmark and hand it the previous run's artifacts, which is the §58.1 incident - a cancelled run
    # uploading a figure under another arm's name - one job later.
    if: (inputs.promote || 'off') == 'on' && needs.aacr-bench.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # **Write, because the product change *is* the output.** Nothing else in this workflow writes, and the scope is
      # this job's rather than the file's: a benchmark job with `contents: write` could rewrite the code it measures,
      # which is the one thing a measurement must not be able to do.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # **The token the repository already has, not a second credential.** A PAT would be a secret that can push to
          # every repository the account can see, held for a job whose entire output is two files in this one.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.nvmrc'

      # **Each arm in its own directory, for the reason `grid-compare` does the same.** Eight `aacr-bench.json` files in
      # one folder leave whichever finished last, and the promoter would then be comparing one arm with itself.
      - name: Download every arm this dispatch bought
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: aacr-bench-*
          path: /tmp/arms

      # **The committed module has to be what the JSON renders before anything is allowed to rewrite either of them.**
      # A promotion on top of a drifted pair would commit a configuration whose two copies disagree, and the guard test
      # would then fail on the promoted commit rather than on the one that drifted.
      - name: Prove the committed configuration is what its source renders
        run: node .github/scripts/aacr-review-defaults-codegen.mjs --check

      # **The arithmetic before the answer**, for the same reason every other script here has a self-test: a promoter's
      # "no challenger" branch is the branch a promoter that does nothing would take.
      - name: Prove the promoter's rule on a fixture whose answer is known
        run: node .github/scripts/aacr-promote.mjs --self-test

      - name: Apply the pre-registered rule
        id: apply
        run: |
          set -e
          node .github/scripts/aacr-promote.mjs \
            --write \
            --out /tmp/promotion.json \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            /tmp/arms > /dev/null
          node -e '
            const record = require("/tmp/promotion.json");
            const lines = [
              `outcome=${record.outcome}`,
              `reason=${record.reason}`,
              `metric=${record.metricPath}`,
              `delta=${record.delta ?? ""}`,
              `champion=${record.champion?.label ?? ""}`,
              `p=${record.paired?.pValue?.toFixed(4) ?? ""}`,
            ];
            require("node:fs").appendFileSync(process.env.GITHUB_OUTPUT, `${lines.join("\n")}\n`);
          '

      - name: Upload the promotion record
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: aacr-promotion-record
          path: /tmp/promotion.json
          if-no-files-found: warn
          retention-days: 365

      # **The shipped configuration and the module beside it, in one commit.** Two files because the engine cannot import
      # JSON through `tsc` without pointing at a file the build never copies; one commit because a commit that carried
      # one and not the other would be a build whose two copies disagree.
      - name: Commit the promoted configuration
        if: steps.apply.outputs.outcome == 'promote'
        run: |
          set -e
          git config user.name 'Lambertyan'
          git config user.email 'lambertyan@users.noreply.github.com'
          git add packages/intelligence/config/review-defaults.json \
                  packages/intelligence/src/review/llm/review-defaults.generated.ts
          if git diff --cached --quiet; then
            echo 'the rule promoted an arm whose configuration is already shipped: nothing to commit'
            exit 0
          fi
          git commit -m "feat(review): the shipped configuration is ${{ steps.apply.outputs.champion }}, ${{ steps.apply.outputs.delta }} F1 on the pull-request arm

          Promoted by the pre-registered rule in packages/intelligence/config/promotion-rule.json.

          Metric: ${{ steps.apply.outputs.metric }}
          Delta over the arm that shipped: ${{ steps.apply.outputs.delta }}
          Exact McNemar over the goldens both arms were scored on: p = ${{ steps.apply.outputs.p }}
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          The configuration file carries the whole record in its provenance block: the incumbent, the challenger,
          the discordance, the p-value and the artifact this figure came from."
          git push origin "HEAD:${{ github.event.repository.default_branch }}"

      - name: Say what happened
        if: always()
        run: |
          echo "### Promotion: ${{ steps.apply.outputs.outcome || 'not reached' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- reason: \`${{ steps.apply.outputs.reason || '—' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- metric: \`${{ steps.apply.outputs.metric || '—' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- delta: \`${{ steps.apply.outputs.delta || '—' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- champion: \`${{ steps.apply.outputs.champion || '—' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- p: \`${{ steps.apply.outputs.p || '—' }}\`" >> "$GITHUB_STEP_SUMMARY"
