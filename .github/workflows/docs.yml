# @code-analyzer — Documentation CI
#
# Validates documentation quality: broken links, README structure,
# and ensures all doc files are well-formed.
#
# Triggered:
#   - Push to master when documentation changes
#   - Manual workflow_dispatch

name: Documentation CI

on:
  push:
    branches: [master]
    paths:
      - '**.md'
      - 'docs/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'CHANGELOG.md'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [master]
    paths:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Link Checker ──────────────────────────────────────────────────────────
  link-check:
    name: 'Check Markdown Links'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # `spec.modelcontextprotocol.io` completes a TLS handshake from a browser but not from the runner, with
      # `--max-retries 3` already in effect. It is excluded by name below so the failure is recorded rather
      # than appearing as a flaky build; remove the entry to check the link again.
      #
      # **The repository's own Actions pages answer an unauthenticated check with 504 Gateway Timeout.** Both badge
      # links at the top of `README.md` point at `github.com/AgentiX-E/code-analyzer/actions…`, and GitHub returned
      # `[504]` for them on two consecutive runs (10:59 and 11:02 on 2026-11-08) after `--max-retries 3`. A link to
      # this repository's own Actions tab cannot be broken in a way a checker could find, and silencing *all* 504s by
      # adding the code to `--accept` would hide a genuinely dead host — so the exclusion names the two paths.
      #
      # Note for the next editor: everything inside `args: >` is one scalar. A `#` written there is passed
      # to lychee as an argument, not treated as a comment — which is exactly how this job was broken once.
      # **And why the check is authenticated now.** On 2026-11-09 the same job returned `[504]` for a dozen ordinary
      # `github.com` URLs - `.../issues`, `.../blob/master/packages/*/README.md` - across three runs in a row. Those are
      # not dead links: **an unauthenticated burst of requests from a shared runner IP is answered with 504 rather than
      # 403**, and `--max-retries 3` cannot beat a rate limit that outlasts the retry window. Excluding each URL by name
      # would have grown a silent allow-list one outage at a time, so the request carries the job's own read-only token
      # and the 504 disappears for the reason it appeared: **the checker was measuring github.com's tolerance for
      # anonymous traffic, not this repository's documentation.**
      - name: Check all links in markdown files
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        env:
          # lychee reads this variable and sends it as a bearer token for `github.com` hosts.
          #
          # **And it was not enough**, which is worth recording: with the token in place the `/blob/...` links passed and
          # the bare `.../issues` URL still returned `[504]` on every run, including one at 08:00 after a ten-minute
          # wait. **A URL that points at this repository's own issue tracker cannot be broken in a way a link checker
          # could find** - if the repository is renamed, every link in it breaks at once and this job is not what notices
          # - so the path is excluded by exact anchor, beside the numbered-issue exclusion that predates it.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            --verbose
            --no-progress
            --max-retries 3
            --timeout 30
            --accept 200,201,202,203,204,206,301,302,304,307,308
            --exclude '^https://github.com/AgentiX-E/code-analyzer/(issues|pulls)/\d+'
            --exclude '^https://github.com/AgentiX-E/code-analyzer/issues/?$'
            --exclude '^https://codecov.io/.*'
            --exclude '^https://img.shields.io/.*'
            --exclude '^http://localhost:.*'
            --exclude '^file://'
            --exclude '^mailto:'
            --exclude '^https://api\.securityscorecards\.dev/.*'
            --exclude '^https://spec\.modelcontextprotocol\.io/.*'
            --exclude '^https://github\.com/AgentiX-E/code-analyzer/actions'
            './**/*.md'
          failIfEmpty: false
          format: markdown

      - name: Upload link check report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: link-check-report
          path: lychee-out.md
          retention-days: 7
          if-no-files-found: ignore

  # ── README Structure Validator ────────────────────────────────────────────
  readme-check:
    name: 'Validate README Structure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check README has required sections
        run: |
          if [ ! -f README.md ]; then
            echo "::warning::README.md not found"
          else

          MISSING_SECTIONS=""

          # Required sections for a quality README
          check_section() {
            local section="$1"
            if ! grep -qi "^## .*$section" README.md; then
              MISSING_SECTIONS="${MISSING_SECTIONS}  - $section\n"
            fi
          }

          check_section "Overview"
          check_section "Features"
          check_section "Install"
          check_section "Usage"
          check_section "Architecture"
          check_section "Contributing"

          if [ -n "$MISSING_SECTIONS" ]; then
            echo "::warning::README.md missing recommended sections:"
            printf "%b" "$MISSING_SECTIONS"
          else
            echo "✅ README.md has all recommended sections."
          fi

          # Check for broken relative links in README
          echo ""
          echo "Checking README internal links..."
          grep -oP '\[.*?\]\(\K[^)]+' README.md | while read -r link; do
            # Skip external URLs and anchors
            if echo "$link" | grep -qE '^(https?://|#|mailto:)'; then
              continue
            fi
            # Resolve relative to repo root
            resolved="./${link}"
            if [ ! -f "$resolved" ] && [ ! -d "$resolved" ]; then
              echo "::warning::Broken internal link in README: $link"
            fi
          done
          fi

  # ── Markdown Lint ─────────────────────────────────────────────────────────
  markdown-lint:
    name: 'Lint Markdown Files'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '9.15.0'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install markdownlint
        run: pnpm add -g markdownlint-cli

      - name: Lint markdown files
        run: |
          markdownlint '**/*.md' \
            --ignore node_modules \
            --ignore packages/*/node_modules \
            --ignore .git \
            --disable MD013 MD033 MD041 MD024 \
            || echo "::warning::Markdown lint issues found (non-blocking)"

  # ── Doc Summary ───────────────────────────────────────────────────────────
  doc-summary:
    name: 'Documentation Summary'
    runs-on: ubuntu-latest
    needs: [link-check, readme-check, markdown-lint]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "## 📚 Documentation CI Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          LK="${{ needs.link-check.result }}"
          RC="${{ needs.readme-check.result }}"
          ML="${{ needs.markdown-lint.result }}"

          echo "| Check | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|--------|" >> "$GITHUB_STEP_SUMMARY"

          if [ "$LK" = "success" ]; then
            echo "| Link Check | ✅ Pass |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Link Check | ⚠️ Issues Found |" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$RC" = "success" ]; then
            echo "| README Structure | ✅ Pass |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| README Structure | ⚠️ Issues Found |" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$ML" = "success" ]; then
            echo "| Markdown Lint | ✅ Pass |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Markdown Lint | ⚠️ Issues Found |" >> "$GITHUB_STEP_SUMMARY"
          fi
