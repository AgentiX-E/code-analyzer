name: Publish VS Code Extension

on:
  release:
    types: [published]

concurrency:
  group: publish-vscode-${{ github.ref }}
  cancel-in-progress: false

# **The token is scoped to what the workflow reads.** The default is the repository's default — read-write on
# an older repository — and `vsce publish` authenticates with `VSCE_PAT`, so the workflow token only reads the checkout.
permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    environment: vscode-marketplace
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm turbo build --filter=code-analyzer

      - name: Package VS Code extension
        run: |
          cd packages/vscode
          npx @vscode/vsce package

      - name: Publish to VS Code Marketplace
        run: |
          cd packages/vscode
          npx @vscode/vsce publish --packagePath $(ls *.vsix | head -1)
        env:
          VSCE_PAT: ${{ secrets.VSCODE_MARKETPLACE_TOKEN }}

      - name: Publish to Open VSX Registry
        run: |
          cd packages/vscode
          npx ovsx publish $(ls *.vsix | head -1)
        env:
          OVSX_PAT: ${{ secrets.OPEN_VSX_TOKEN }}
