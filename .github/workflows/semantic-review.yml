name: Semantic Review Benchmark

# **The figure the repository cannot commit**, because it comes from a model.
#
# **The heuristic path has a number in the docs and this one has a job instead**, for the reason the docs give: a
# committed figure that nobody can reproduce is a claim, and **a job that produces the figure whenever a credential
# is configured is a measurement.** **The credential is `DEEPSEEK_API_KEY`; without it the job reports a skip with its
# reason rather than a zero**, so **an unrun measurement cannot be mistaken for a bad one.**
#
# **And it is dispatched rather than scheduled**, because **each run calls a model once per file window and costs
# money** - so a human decides when to spend it, and **the artifact records when it was measured.**

on:
  workflow_dispatch:
  schedule:
    # **Off-peak on purpose.** The vendor halves every price outside 01:00-04:00 and 06:00-10:00 UTC on weekdays,
    # so a weekly run at this hour costs half what the same run costs at 08:00 - and this workflow's own artifact
    # records the spend it took to produce the figure.
    - cron: '20 5 * * 2'
  # **Not even this file.** A workflow's own edit used to re-run it, so fixing a trigger cost one run of the
  # thing it triggers - which is the shape of a bill that pays for its own paperwork. `gate:actions` and the project
  # standards check read this file on every push; the paid run is a dispatch or the weekly schedule.
  push:
    branches: [master]
    paths:
      - '.github/scripts/measure-semantic-review.mjs'

concurrency:
  group: semantic-review
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  semantic-review:
    name: Review the real dataset with a model
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Review the dataset, or say why not
        env:
          # **The credential is read from the environment and never written anywhere.** The script logs no part of it,
          # and the artifact carries only counts.
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node .github/scripts/measure-semantic-review.mjs

      - name: Upload the figure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: semantic-review
          path: benchmarks/semantic-review.json
          if-no-files-found: warn
          retention-days: 90
