name: Symbol Crosscheck

# **The two-sided verifier, bought on the arm's own emission.**
#
# `EVAL-CONTRACT.md` §166 read the published Martian artifact and found the deficit is **predicative**: 27 of the 33 goldens
# only the competitor credits sit on a symbol **our own comment already names**, against a base rate of 79 % on the goldens
# neither arm credits. So the comments are in the right places and ask a different question about them, and §166.4 priced
# the correction - the same 227 comments, their sentences corrected - at F1 `0.3221 → 0.3896` against a bar of `0.3735`.
#
# **This job buys the reading of that device, and it is a dispatch rather than a schedule.** A paid run has two honest
# triggers in this repository: a person deciding to spend, and one cron row a reviewer can see. The verifier's own calls
# are ~5 % of the run they ride on (§166.6), and the judgement is one pass over the emission plus one over the corrections,
# so the bill is bounded by the ceiling the script carries and by `max_calls` below.
#
# **And the two arms are judged in the same run by the same judge.** A difference between two runs is a difference between
# two judgements as well as two sentences, and removing that confound is the only reason a paired number here is worth
# more than two unpaired ones.

on:
  workflow_dispatch:
    inputs:
      max_pull_requests:
        description: "How many of the board's fifty pull requests to verify (a slice is a sample of the board, not a smaller corpus)"
        required: false
        type: string
        default: '50'
      max_calls:
        description: "The verifier's call budget for the whole run"
        required: false
        type: string
        default: '250'
      max_usd:
        description: "The run's spend ceiling in USD - crosscheck calls and judge calls together"
        required: false
        type: string
        default: '3'

concurrency:
  group: symbol-crosscheck
  cancel-in-progress: false

permissions:
  contents: read
  # **Read on pull requests, because the evidence is the change**: a two-sided question is answered from the diff, and the
  # diff is fetched from the API rather than reconstructed from the artifact.
  pull-requests: read

jobs:
  crosscheck:
    name: Price the verifier on the comments the arm already posts
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      # **The record is the artifact of this job**, and it is committed afterwards by a person rather than by the job: a
      # workflow that pushes its own numbers is a workflow whose figures cannot be reviewed before they are published.
      - name: Record the verifier and judge both arms
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_MAX_USD: ${{ inputs.max_usd }}
        run: |
          pnpm -s bench:symbol-crosscheck:record -- \
            --max-prs "${{ inputs.max_pull_requests }}" \
            --max-calls "${{ inputs.max_calls }}" \
            --max-usd "${{ inputs.max_usd }}"

      - name: Collect the record
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: symbol-crosscheck
          path: |
            benchmarks/symbol-crosscheck.json
            benchmarks/martian-harness.json
          if-no-files-found: warn
