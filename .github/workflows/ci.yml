# @code-analyzer — Main CI Pipeline
#
# Comprehensive CI pipeline with parallelized lint, typecheck, unit/integration/
# property/E2E tests, coverage gates, and benchmark checks.
#
# Triggered on:
#   - push to master (gate for merge)
#   - pull_request to master (pre-merge validation)
#   - manual workflow_dispatch

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Cancel in-progress runs on the same PR to conserve CI resources
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write

env:
  PNPM_VERSION: '9.15.0'
  NODE_VERSION: '22'

# ── Reusable setup step ─────────────────────────────────────────────────────
# Shared across all jobs to reduce YAML duplication
# Note: Must be inlined per job since GitHub Actions does not support
# YAML anchors in workflow_call without composite actions.

jobs:
  # ── Lint & Format ─────────────────────────────────────────────────────────
  lint:
    name: 'Lint & Format'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Run lint (all packages)
        run: pnpm lint
      - name: Check formatting
        run: pnpm format:check

  # ── Type Check ────────────────────────────────────────────────────────────
  typecheck:
    name: 'Type Check'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Run type check (all packages)
        run: pnpm typecheck

  # ── Unit Tests ────────────────────────────────────────────────────────────
  test-unit:
    name: 'Unit Tests (Node ${{ matrix.node-version }})'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node-version: [22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Run unit tests
        run: pnpm test:unit
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      - name: Upload test results (Node 22 only)
        if: matrix.node-version == '22' && always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-node-${{ matrix.node-version }}
          path: |
            test-results/
            coverage/
          retention-days: 14
          if-no-files-found: ignore

  # ── Integration Tests ─────────────────────────────────────────────────────
  test-integration:
    name: 'Integration Tests'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [test-unit]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Run integration tests
        run: pnpm test:integration
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      - name: Upload integration test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  # ── Property Tests ────────────────────────────────────────────────────────
  test-property:
    name: 'Property-Based Tests'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [test-unit]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Run property-based tests
        run: pnpm test:property
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

  # ── E2E Tests ─────────────────────────────────────────────────────────────
  test-e2e:
    name: 'E2E Tests'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [test-integration]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      - name: Upload E2E test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  # ── Coverage Gate ─────────────────────────────────────────────────────────
  coverage:
    name: 'Coverage ≥95% Gate'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [test-unit, test-integration, test-property]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Run full test suite with coverage
        id: coverage-run
        run: |
          npx vitest run --config vitest.config.ts --coverage \
            --coverage.enabled=true \
            --coverage.provider=v8 \
            --coverage.reporter=json \
            --coverage.reporter=json-summary \
            --coverage.reporter=text \
            --coverage.reportsDirectory=coverage
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      - name: Enforce coverage thresholds
        run: |
          # Per-dimension thresholds from vitest.config.ts
          # lines: 95, branches: 89, functions: 95, statements: 95
          FAILED=0
          for dim in lines branches functions statements; do
            case $dim in
              lines)     TH=95 ;;
              branches)  TH=89 ;;
              functions) TH=95 ;;
              statements)TH=95 ;;
            esac
            if ! node scripts/coverage-report.js --threshold "$TH" --json coverage/coverage-summary.json --quiet 2>/dev/null; then
              echo "::error title=Coverage Gate::${dim} coverage is below ${TH}% threshold"
              FAILED=1
            fi
          done
          if [ "$FAILED" -ne 0 ]; then
            echo "::error::Coverage gate failed — one or more dimensions below threshold."
            exit 1
          fi
          echo "::notice::All coverage dimensions meet thresholds (lines≥95%, branches≥89%, functions≥95%, statements≥95%)."
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30
      - name: Post coverage summary on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');

            const header = '<!-- code-analyzer-ci-coverage -->';
            let body = '';

            try {
              const raw = fs.readFileSync('coverage/coverage-summary.json', 'utf-8');
              const summary = JSON.parse(raw);
              body = '## 📊 Coverage Report\n\n';
              body += '| Dimension | Covered | Total | Pct | Gate |\n';
              body += '|-----------|---------|-------|-----|------|\n';

              const dims = ['lines', 'branches', 'functions', 'statements'];
              let allPass = true;
              for (const dim of dims) {
                const d = summary.total?.[dim];
                if (d) {
                  const pct = Number(d.pct || 0).toFixed(1);
                  const pass = Number(pct) >= 95;
                  if (!pass) allPass = false;
                  body += `| ${dim} | ${d.covered || 0} | ${d.total || 0} | ${pct}% | ${pass ? '✅' : '❌'} |\n`;
                }
              }
              body += `\n**Threshold:** ≥95%\n`;
              body += allPass ? '\n✅ All dimensions pass.\n' : '\n❌ Coverage below threshold.\n';
            } catch {
              body = '## 📊 Coverage Report\n\n⚠️ Could not parse coverage data.';
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body?.includes(header));
            const fullBody = `${header}\n${body}`;

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: fullBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: fullBody,
              });
            }

  # ── Benchmark ─────────────────────────────────────────────────────────────
  bench:
    name: 'Performance Benchmarks'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Run benchmarks
        run: pnpm bench
      - name: Check for benchmark regressions
        id: bench-check
        run: node scripts/check-benchmarks.js
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: bench-results.json
          retention-days: 30
          if-no-files-found: ignore

  # ── CI Summary ────────────────────────────────────────────────────────────
  ci-summary:
    name: 'CI Summary'
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test-unit, test-integration, test-property, test-e2e, coverage, bench]
    if: always()
    steps:
      - name: Generate CI summary
        run: |
          echo "## CI Pipeline Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Job | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|--------|" >> "$GITHUB_STEP_SUMMARY"

          declare -A JOBS=(
            ["lint"]="${{ needs.lint.result }}"
            ["typecheck"]="${{ needs.typecheck.result }}"
            ["test-unit"]="${{ needs.test-unit.result }}"
            ["test-integration"]="${{ needs.test-integration.result }}"
            ["test-property"]="${{ needs.test-property.result }}"
            ["test-e2e"]="${{ needs.test-e2e.result }}"
            ["coverage"]="${{ needs.coverage.result }}"
            ["bench"]="${{ needs.bench.result }}"
          )

          ALL_PASS=true
          for job in "${!JOBS[@]}"; do
            result="${JOBS[$job]}"
            if [ "$result" = "success" ]; then
              echo "| $job | ✅ Pass |" >> "$GITHUB_STEP_SUMMARY"
            elif [ "$result" = "skipped" ]; then
              echo "| $job | ⏭️ Skipped |" >> "$GITHUB_STEP_SUMMARY"
              ALL_PASS=false
            else
              echo "| $job | ❌ $result |" >> "$GITHUB_STEP_SUMMARY"
              ALL_PASS=false
            fi
          done

          if [ "$ALL_PASS" = true ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "✅ **All jobs passed.**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "❌ **Some jobs failed.** Review the details above." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
