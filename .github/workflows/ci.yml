# @code-analyzer — Main CI Pipeline
#
# Comprehensive CI pipeline with parallelized lint, typecheck, unit/integration/
# property/E2E tests, coverage gates, and benchmark checks.
#
# Triggered on:
#   - push to master (gate for merge)
#   - pull_request to master (pre-merge validation)
#   - manual workflow_dispatch

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Cancel in-progress runs on the same PR to conserve CI resources
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write

env:
  PNPM_VERSION: '9.15.0'

# ── Reusable setup step ─────────────────────────────────────────────────────
# Shared across all jobs to reduce YAML duplication
# Note: Must be inlined per job since GitHub Actions does not support
# YAML anchors in workflow_call without composite actions.

jobs:
  # ── Lint & Format ─────────────────────────────────────────────────────────
  lint:
    name: 'Lint & Format'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # `pnpm lint` (turbo, per package) reports what is outstanding; the ratchet is the gate: a file
      # may not grow, and a file with no recorded findings must stay clean.
      - name: Lint ratchet (per file)
        run: npm run lint:ratchet
      - name: Check formatting
        run: pnpm format:check
      # A gate that is correct, tested and never invoked looks exactly like one that guards a pull
      # request. This asks which is which, for every script in `scripts/` and `.github/scripts/`.
      - name: Is every script wired to something that runs?
        run: npm run -s gate:wiring
      # One runtime is described by `.nvmrc`, eleven `engines.node` fields and a matrix; this is the only place
      # that requires them to describe the same one.
      - name: Does the runtime agree with its three declarations?
        run: npm run -s gate:node-version
      # A mutable tag runs whatever it points at today. Ninety-seven `PinnedDependenciesID` alerts said so.
      - name: Does every action run a named commit?
        run: npm run -s gate:actions
      # A figure that names a directory has named a moving thing. This requires it to say which version.
      - name: Does every figure that names a corpus name its version?
        run: npm run -s gate:corpus

  # ── Type Check ────────────────────────────────────────────────────────────
  typecheck:
    name: 'Type Check'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Run type check (all packages)
        run: pnpm typecheck

      - name: Ratchet the test tree's type errors
        run: |
          # Every test file is excluded from the build projects, so the test tree is compiled by
          # its own noEmit project — and it is known-red (see scripts/typecheck-tests-baseline.json).
          # That command exits non-zero for that reason, so its output is captured and the ratchet
          # judges it instead: no new errors anywhere, and no file may exceed its recorded count.
          pnpm typecheck:tests > /tmp/typecheck-tests.log 2>&1 || true
          node scripts/typecheck-per-file.js --log /tmp/typecheck-tests.log

  # ── Unit Tests ────────────────────────────────────────────────────────────
  test-unit:
    name: 'Unit Tests (Node ${{ matrix.node-version }})'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # **The floor and the pinned engine, in that order.** The floor is what `engines.node` promises and what no
        # workflow had ever installed; the pinned version is the one `.nvmrc` names and the only one whose coverage
        # numbers are comparable between runs. `scripts/node-version-gate.js` fails when either drifts from the two
        # declarations, so this list cannot quietly become one version again.
        node-version: ['22.14.0', '22.23.4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Run unit tests
        run: pnpm test:unit
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      # **Both legs upload, under their own names.** The condition this replaced compared against a version the
      # matrix no longer contains, which made it permanently false — a step that had silently stopped running. The
      # artifact name already distinguishes the legs, so there is nothing left for a comparison to decide.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results-node-${{ matrix.node-version }}
          path: |
            test-results/
            coverage/
          retention-days: 14
          if-no-files-found: ignore

  # ── Integration Tests ─────────────────────────────────────────────────────
  test-integration:
    name: 'Integration Tests'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [test-unit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Run integration tests
        run: pnpm test:integration
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      - name: Upload integration test artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: integration-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  # ── Property Tests ────────────────────────────────────────────────────────
  test-property:
    name: 'Property-Based Tests'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [test-unit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Run property-based tests
        run: pnpm test:property
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

  # ── E2E Tests ─────────────────────────────────────────────────────────────
  test-e2e:
    name: 'E2E Tests'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [test-integration]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      - name: Upload E2E test artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  # ── Web UI Tests ──────────────────────────────────────────────────────────
  #
  # **The only job that runs `packages/web`.** Its suite is the one kind of test in this repository that the root
  # `vitest.config.ts` cannot see: the files are `.test.tsx` and they need jsdom, so the root `include` never matched
  # them and no job ever named them. They had been failing for every run of `pnpm test:web` - a `pnpm.overrides` entry
  # for `undici` with no upper bound had resolved the version jsdom needs past a major it supports - and nothing said
  # so, because nothing ran them. A suite nobody invokes is a suite that is green by absence.
  test-web:
    name: 'Web UI Tests'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Run the web suite
        run: pnpm test:web
      - name: Build the web bundle
        run: pnpm --filter @code-analyzer/web build

  # ── Coverage Gate ─────────────────────────────────────────────────────────
  coverage:
    name: 'Coverage ≥95% Gate'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [test-unit, test-integration, test-property]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Run full test suite with coverage
        id: coverage-run
        run: |
          npx vitest run --config vitest.config.ts --coverage \
            --coverage.enabled=true \
            --coverage.provider=v8 \
            --coverage.reporter=json \
            --coverage.reporter=json-summary \
            --coverage.reporter=text \
            --coverage.reportsDirectory=coverage
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      - name: Enforce coverage thresholds
        run: |
          # Per-dimension thresholds from vitest.config.ts
          # lines: 95, branches: 95, functions: 95, statements: 95
          FAILED=0
          for dim in lines branches functions statements; do
            case $dim in
              lines)     TH=95 ;;
              branches)  TH=95 ;;
              functions) TH=95 ;;
              statements)TH=95 ;;
            esac
            if ! node scripts/coverage-report.js --threshold "$TH" --json coverage/coverage-summary.json --quiet 2>/dev/null; then
              echo "::error title=Coverage Gate::${dim} coverage is below ${TH}% threshold"
              FAILED=1
            fi
          done
          if [ "$FAILED" -ne 0 ]; then
            echo "::error::Coverage gate failed — one or more dimensions below threshold."
            exit 1
          fi
          echo "::notice::All coverage dimensions meet thresholds (lines≥95%, branches≥95%, functions≥95%, statements≥95%)."

      - name: Enforce that every published number is cited
        run: npm run docs:numbers

      # **The figures a reader quotes are rendered from the artifact, not typed beside it.** The Long Code Arena tables
      # in `docs/BENCHMARK_REPORT.md` sit between markers and are written by `scripts/lca-report.js`; this step fails when
      # the report and `benchmarks/lca-bug-localization.json` disagree, which is the only version of that section that
      # cannot drift when the artifact is re-merged. It reads two committed files and needs no corpus.
      - name: Enforce that the corpus figures are rendered from their artifact
        run: npm run docs:lca

      # **The L4 task set and its answer key, checked on every push.** `--check` proves every gold tool still exists in
      # the registry, every grounding value still appears in the fixture, and every gold call still passes its own tool's
      # schema. `--self-test` runs those gold calls through the same execution and scoring path a model's calls take and
      # requires the answer key to score 1.0 — so if a correct answer would not have scored 1.0, this fails before any
      # number is published. Neither needs a key, a model or the network.
      - name: Enforce that the tool-selection task set is still answerable
        run: npm run docs:agentic

      - name: Enforce that every status claim is backed by a record
        run: npm run docs:status

      - name: Enforce that stated counts match the code
        run: npm run docs:code-sync

      - name: Enforce that every path a baseline records still exists
        run: npm run baselines:anchors

      - name: Enforce that every coverage exclusion is recorded
        run: npm run coverage:exclusions

      - name: Enforce per-file coverage
        run: |
          # The aggregate gate above reads only `total`, so a run can pass with individual files
          # far below the threshold. This walks every file; files with no countable code are
          # skipped, and the few that cannot reach the bar carry a recorded floor with a reason
          # in scripts/coverage-per-file-exclusions.json.
          node scripts/coverage-per-file.js --json coverage/coverage-summary.json --threshold 95
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30
      - name: Post coverage summary on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('node:fs');

            const header = '<!-- code-analyzer-ci-coverage -->';
            let body = '';

            try {
              const raw = fs.readFileSync('coverage/coverage-summary.json', 'utf-8');
              const summary = JSON.parse(raw);
              body = '## 📊 Coverage Report\n\n';
              body += '| Dimension | Covered | Total | Pct | Gate |\n';
              body += '|-----------|---------|-------|-----|------|\n';

              const dims = ['lines', 'branches', 'functions', 'statements'];
              let allPass = true;
              for (const dim of dims) {
                const d = summary.total?.[dim];
                if (d) {
                  const pct = Number(d.pct || 0).toFixed(1);
                  const pass = Number(pct) >= 95;
                  if (!pass) allPass = false;
                  body += `| ${dim} | ${d.covered || 0} | ${d.total || 0} | ${pct}% | ${pass ? '✅' : '❌'} |\n`;
                }
              }
              body += `\n**Threshold:** ≥95%\n`;
              body += allPass ? '\n✅ All dimensions pass.\n' : '\n❌ Coverage below threshold.\n';
            } catch {
              body = '## 📊 Coverage Report\n\n⚠️ Could not parse coverage data.';
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body?.includes(header));
            const fullBody = `${header}\n${body}`;

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: fullBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: fullBody,
              });
            }

  # ── Benchmark ─────────────────────────────────────────────────────────────
  bench:
    name: 'Performance Benchmarks'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Run benchmarks
        run: pnpm bench:ci
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: benchmark-results
          path: bench-results.json
          retention-days: 30
          if-no-files-found: ignore

  # ── CI Summary ────────────────────────────────────────────────────────────
  ci-summary:
    name: 'CI Summary'
    runs-on: ubuntu-latest
    needs:
      [
        lint,
        typecheck,
        test-unit,
        test-integration,
        test-property,
        test-e2e,
        test-web,
        coverage,
        bench,
      ]
    if: always()
    steps:
      - name: Generate CI summary
        run: |
          echo "## CI Pipeline Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Job | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|--------|" >> "$GITHUB_STEP_SUMMARY"

          declare -A JOBS=(
            ["lint"]="${{ needs.lint.result }}"
            ["typecheck"]="${{ needs.typecheck.result }}"
            ["test-unit"]="${{ needs.test-unit.result }}"
            ["test-integration"]="${{ needs.test-integration.result }}"
            ["test-property"]="${{ needs.test-property.result }}"
            ["test-e2e"]="${{ needs.test-e2e.result }}"
            ["test-web"]="${{ needs.test-web.result }}"
            ["coverage"]="${{ needs.coverage.result }}"
            ["bench"]="${{ needs.bench.result }}"
          )

          ALL_PASS=true
          for job in "${!JOBS[@]}"; do
            result="${JOBS[$job]}"
            if [ "$result" = "success" ]; then
              echo "| $job | ✅ Pass |" >> "$GITHUB_STEP_SUMMARY"
            elif [ "$result" = "skipped" ]; then
              echo "| $job | ⏭️ Skipped |" >> "$GITHUB_STEP_SUMMARY"
              ALL_PASS=false
            else
              echo "| $job | ❌ $result |" >> "$GITHUB_STEP_SUMMARY"
              ALL_PASS=false
            fi
          done

          if [ "$ALL_PASS" = true ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "✅ **All jobs passed.**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "❌ **Some jobs failed.** Review the details above." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  impact-of-change:
    name: 'Impact of the Change'
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The script compares against the previous commit, which needs the history the default depth omits.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: Which tests reach what changed
        # **Printed, not enforced.** The suite that runs in the other jobs is the enforcement; this says which parts
        # of it a reviewer should expect to matter. It exits zero by design - a listing that fails a build would be
        # turned off the first time it was inconvenient, which is how a gate becomes a habit.
        run: node scripts/impact-of-change.mjs --changed
