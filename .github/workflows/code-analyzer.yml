name: 'Code Analyzer PR Review'

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pr-number:
        description: 'PR number to analyze'
        required: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    # Skip for draft PRs and only run on approved review submissions
    if: |
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      (github.event_name != 'pull_request_review' || github.event.review.state == 'approved')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/code-analyzer-action
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  summary:
    runs-on: ubuntu-latest
    needs: analyze
    if: always()
    steps:
      - name: Check Analysis Status
        #
        # **A failed review is reported, not enforced.** The action runs advisory (`fail-on: off`) because iteration 110
        # measured the reviewer's precision at 0.04 behind the competitor with 45 % of findings false, and the first
        # pull request it ran on produced 44 critical findings that were all test fixtures. Failing the job here would
        # have turned that precision gap into a blocked merge, and this step would have been deleted within a week.
        # A hard failure now means the analysis could not run at all, which is what `failure` still has to say.
        #
        run: |
          if [ "${{ needs.analyze.result }}" == "success" ]; then
            echo "Code Analyzer review completed; findings are on the pull request."
          elif [ "${{ needs.analyze.result }}" == "failure" ]; then
            echo "::error::Code Analyzer could not complete. Check the analyze job for a build or configuration failure."
            exit 1
          else
            echo "Code Analyzer review was skipped or cancelled"
          fi
