name: Code QA Benchmark

# **A figure that can be compared with somebody else's.** Every retrieval number this repository published before this
# job was measured on its own corpus with its own questions: it could say a change helped, and it could not say whether
# the result was any good. This job runs the product on **CoSQA** - the retrieval corpus the code-search literature
# reports on - and publishes recall@1/5/10 and MRR@10 beside the SHA-256 of the file it measured.
#
# **The dataset is downloaded, not committed**, so the run always measures the published revision rather than a copy
# that drifted; the artifact names the file's hash.

on:
  # **A product change does not dispatch a paid run.** These paths used to start this job on every commit that
  # touched the code it measures, which is a bill for measuring one's own edit - the trigger fires on corpora and
  # harnesses only now, and the schedule below is the weekly measurement, placed inside the vendor's off-peak
  # window where every price is half.
  schedule:
    - cron: '0 4 * * 3'
  workflow_dispatch:
    inputs:
      pool:
        description: 'Which collection to retrieve from: test-split (500 answers) or all (the published pool)'
        required: false
        default: 'test-split'
        type: choice
        options:
          - test-split
          - all
      depth:
        description: 'How many results each channel contributes before fusion, and how many the reranker sees'
        required: false
        default: '50'
        type: string
      sweep:
        description: 'Depths to score the fused arm at in one pass, comma separated (e.g. 50,100,200). Empty scores depth alone'
        required: false
        default: ''
        type: string
      vectorWeights:
        description: 'Fusion weights to score the same two lists at, comma separated (e.g. 1,2,3). Empty scores weight one alone'
        required: false
        default: ''
        type: string
      rerankDepths:
        # **The question §30.5 registered, and the reason it is a dispatch rather than a schedule.** A rerank depth buys a
        # completion per question per arm, so a two-depth run costs twice a one-depth run; and it has to be *one* run,
        # because measuring the deeper arm in a second job puts the model's run-to-run variance back into the comparison
        # the two-arm design removed. `50,100` reranks both arms at both depths and publishes the paired tests.
        description: 'Depths to rerank at, comma separated (e.g. 50,100). Empty reranks once at depth'
        required: false
        default: ''
        type: string

concurrency:
  group: code-qa-benchmark
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cosqa:
    name: Score retrieval on CoSQA
    runs-on: ubuntu-latest
    # **A stated budget rather than one discovered by a timeout.** Five hundred questions are 500 vector searches and,
    # when a key is present, 500 completions - and the `all` pool indexes twelve times as many functions before any of
    # that starts, so the ceiling covers the arm that costs the most rather than the one that runs on a schedule.
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      # **The dataset, from the repository that publishes it.** `raw.githubusercontent.com` is the canonical path; the
      # fallback branch name exists because the upstream default branch has changed once already.
      - name: Fetch the CoSQA retrieval split
        run: |
          set -euo pipefail
          mkdir -p benchmarks/corpora/cosqa
          url=""
          for branch in main master; do
            candidate="https://raw.githubusercontent.com/Jun-jie-Huang/CoCLR/${branch}/data/search/cosqa-retrieval-test-500.json"
            if curl -fsSL "$candidate" -o benchmarks/corpora/cosqa/cosqa-retrieval-test-500.json; then
              url="$candidate"
              break
            fi
          done
          if [ -z "$url" ]; then
            echo "::error::CoSQA could not be downloaded; the measurement is skipped rather than invented"
            exit 1
          fi
          echo "fetched $url"
          sha256sum benchmarks/corpora/cosqa/cosqa-retrieval-test-500.json | tee -a "$GITHUB_STEP_SUMMARY"
          node -e "const rows=require('./benchmarks/corpora/cosqa/cosqa-retrieval-test-500.json');console.log('questions:', rows.length)"

          # **The distractor pool, only when the arm asks for it.** `all` reproduces the collection a published table
          # retrieves from; without this file the test would measure 500 candidates and label the figure `all`, which is
          # the one outcome worse than not running - so a missing file fails the step rather than shrinking the pool.
          if [ "${{ inputs.pool || 'test-split' }}" = "all" ]; then
            got=""
            for branch in main master; do
              candidate="https://raw.githubusercontent.com/Jun-jie-Huang/CoCLR/${branch}/data/qa/cosqa-all.json"
              if curl -fsSL "$candidate" -o benchmarks/corpora/cosqa/cosqa-all.json; then
                got="$candidate"
                break
              fi
            done
            if [ -z "$got" ]; then
              echo "::error::the distractor pool could not be downloaded; the pool would silently shrink to 500"
              exit 1
            fi
            echo "fetched $got"
            sha256sum benchmarks/corpora/cosqa/cosqa-all.json | tee -a "$GITHUB_STEP_SUMMARY"
            node -e "const rows=require('./benchmarks/corpora/cosqa/cosqa-all.json');const u=new Set(rows.map(r=>r.code));console.log('collection rows:',rows.length,'unique functions:',u.size)"
          fi

      - name: Are the credentials present?
        id: credential
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -n "$ZHIPU_API_KEY" ]; then echo "vectors=true" >> "$GITHUB_OUTPUT"; else
            echo "vectors=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ZHIPU_API_KEY is absent, so the semantic half cannot run and this measurement is skipped."
          fi
          if [ -n "$DEEPSEEK_API_KEY" ]; then echo "rerank=true" >> "$GITHUB_OUTPUT"; else
            echo "rerank=false" >> "$GITHUB_OUTPUT"
            echo "::warning::DEEPSEEK_API_KEY is absent, so nothing will be reordered and the column will say so."
          fi

      - name: Measure the product on CoSQA
        if: steps.credential.outputs.vectors == 'true'
        env:
          COSQA_DIR: benchmarks/corpora/cosqa
          # **Which pool this run measures.** Empty on the schedule, which resolves to the arm every figure so far was
          # measured on; the published pool is a dispatch, because it is twelve times the indexing cost.
          COSQA_POOL: ${{ inputs.pool || 'test-split' }}
          # **The depth the reranker is shown**, and the curve the fused arm is scored along. Two variables because they
          # answer two questions: a wider pool is free to retrieve from and costs completions to reorder, so the curve
          # and the arm a run pays for are separate decisions.
          COSQA_DEPTH: ${{ inputs.depth || '50' }}
          COSQA_SWEEP: ${{ inputs.sweep || '' }}
          # **The rerank depths, which are the paid part of a run.** Empty means the arm's own depth, which is what the
          # weekly job measures; a dispatch that names two pays for both arms at both and gets a paired comparison
          # between them rather than two figures a year apart.
          COSQA_RERANK_DEPTHS: ${{ inputs.rerankDepths || '' }}
          # **The fusion weight, which the depth sweep pointed at**: at the collection pool the fused list finds the
          # answer fewer times than either channel alone, so the compromise itself is the suspect.
          COSQA_VECTOR_WEIGHTS: ${{ inputs.vectorWeights || '' }}
          # **This run publishes figures**: recording is opt-in so a local run cannot replace the committed artifact.
          BENCHMARK_WRITE: '1'
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          ZHIPU_EMBEDDING_MODEL: embedding-3
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -o pipefail
          npx vitest run --config vitest.config.ts packages/intelligence/src/__tests__/cosqa-retrieval.test.ts 2>&1 | tee /tmp/cosqa.log
          # **Every line the test published, not the last one**: the summary line is the arm and `COSQA-SWEEP` is the
          # depth curve, and a job summary that kept only the tail would drop the measurement the dispatch asked for.
          # **Every line the run published**, matched by prefix rather than by an enumerated list: the list was three
          # names long and a fourth line (`COSQA-PAIRED`) was being published into a log nobody reads.
          grep -oE 'COSQA-[A-Z-]+ .*' /tmp/cosqa.log | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the CoSQA figure
        if: always() && steps.credential.outputs.vectors == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cosqa-retrieval
          path: benchmarks/cosqa-retrieval.json
          if-no-files-found: warn
          retention-days: 90
