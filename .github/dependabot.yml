# Dependabot configuration for automated dependency updates
# Updates npm dependencies weekly with grouped PRs
# Security alerts are handled via GitHub's built-in security features

version: 2
updates:
  # Root workspace dependencies
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Asia/Shanghai'
    versioning-strategy: 'increase'
    open-pull-requests-limit: 10
    # **Two majors are held by a decision rather than by a failure, and an ignore rule is where a decision belongs.**
    #
    # `@types/node` describes the API surface of *its own* major, and this repository builds and tests on Node 22.14.0
    # and 22.23.4. Taking the types ahead of the runtime makes the compiler accept a call the runner cannot make - **the
    # one failure a green type check cannot catch, because it is the type check that would be lying.** The rule comes off
    # in the same change that moves the runtime.
    #
    # A test runner major is the other one: it rewrites the suites that decide whether this repository still works, and a
    # pull-request run compiles the tests rather than proving them. **A major that a green CI cannot settle is a
    # migration, not a version number**, so it is held until the iteration that reads every suite it changes.
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      - dependency-name: 'vitest'
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitest/*'
        update-types: ['version-update:semver-major']
    labels:
      - 'dependencies'
      - 'automated'
    commit-message:
      prefix: 'deps'
      prefix-development: 'deps(dev)'
      include: 'scope'
    groups:
      # **The React runtime moves as one, because React refuses to run when the pair differs.** An ungrouped bump moved
      # `react` to 19.3.1 and left `react-dom` at 19.2.7, and the result was four web suites failing at import with
      # `Incompatible React versions` - a message from React's internals that names neither manifest. Grouping makes the
      # two arrive in one pull request; `react-and-react-dom-move-together.test.ts` makes a skew fail as one named
      # invariant rather than as four broken suites.
      react:
        patterns:
          - 'react'
          - 'react-dom'
      typescript-eslint:
        patterns:
          - '@typescript-eslint/*'
          - 'typescript-eslint'
      testing:
        patterns:
          - 'vitest'
          - '@vitest/*'
      types:
        patterns:
          - '@types/*'

  # GitHub Actions dependencies
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Asia/Shanghai'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'ci'
    commit-message:
      prefix: 'ci(deps)'
