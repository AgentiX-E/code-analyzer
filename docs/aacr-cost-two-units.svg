<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="Two arms of one dispatch billed twice: the arm with one lane fewer costs more as billed and less on a cold cache">
<rect width="960" height="560" fill="#ffffff" />
<text x="24" y="34" font-size="16" font-weight="700" fill="#1f2328">The same pair, in two units: the arm with one lane fewer is dearer as billed and cheaper on a cold cache</text>
<text x="24" y="54" font-size="11" fill="#57606a">USD per arm. The vendor's prefix cache is state that outlives the process, so the arm that runs second is billed less for the same tokens.</text>
<text x="24" y="72" font-size="9" fill="#8c959f">source: run 44867457528, 100 pull requests (skip 50), 724 goldens, deepseek-chat at the repository's own price table · multiplier recovered per arm: 0.50 and 0.50</text>
