apiVersion: v1
kind: Service
metadata:
  name: code-analyzer
  namespace: code-analyzer
  labels:
    app.kubernetes.io/name: code-analyzer
spec:
  type: ClusterIP
  ports:
    - name: graphql
      port: 3000
      targetPort: 3000
      protocol: TCP
    - name: mcp-sse
      port: 3001
      targetPort: 3001
      protocol: TCP
  selector:
    app.kubernetes.io/name: code-analyzer
